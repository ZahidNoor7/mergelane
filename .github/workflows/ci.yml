name: ci

# Paused by the owner on 2026-11-10 (docs/DECISIONS.md ADR-0020): runs only when started by hand,
# from the Actions tab or `gh workflow run ci.yml --ref <branch>`. To resume, restore:
#   push: { branches: [main] }
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every macOS job runs on xcode-27 (macOS 27, arm64): see docs/DECISIONS.md ADR-0004.
# Jobs for the app, daemon, packaging and simulated networks are added by their milestones.
jobs:
  repo-checks:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the repository checks
        run: bash scripts/ci/check-repo.test.sh
      - name: Check this repository
        run: bash scripts/ci/check-repo.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test the CI scripts
        run: node --test --experimental-test-coverage scripts/ci/*.test.mjs
      - name: Test the release-notes script
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/release/notes.mjs' --test-coverage-lines=90 scripts/release/notes.test.mjs
      # Builds tiny Mach-O fixtures with clang and runs fake build scripts: no download, no FFmpeg
      # compile.
      - name: Test the media-tools fetch script
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/media-tools/fetch.mjs' --test-coverage-lines=90 scripts/media-tools/fetch.test.mjs
      - name: Test the media-tools sources script
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/media-tools/sources.mjs' --test-coverage-lines=90 scripts/media-tools/sources.test.mjs
      - name: Test the local release script
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/release/local-release.mjs' --test-coverage-lines=90 scripts/release/local-release.test.mjs
      - name: Test the real-hardware suite's script (against a stand-in Mac; ADR-0050)
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/hardware/hardware.mjs' --test-coverage-lines=90 scripts/hardware/hardware.test.mjs
      - name: Test the Deno notices generator
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/media-tools/deno-notices.mjs' --test-coverage-lines=90 scripts/media-tools/deno-notices.test.mjs
      # A stand-in for go, git and zip, and static checks of test-kit.ps1, which runs only on Windows.
      - name: Test the Windows test kit's builder and report reader (ADR-0054)
        run: node --test --experimental-test-coverage --test-coverage-include='scripts/windows/kit.mjs' --test-coverage-include='scripts/windows/report.mjs' --test-coverage-lines=90 scripts/windows/kit.test.mjs scripts/windows/report.test.mjs

  app-checks:
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Linting and typechecking need only the packages: skip the Electron download and native
      # rebuild that postinstall does.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      # Renderer unit tests in jsdom (Vitest, ADR-0034). Each file listed in vitest.config.ts's COVERED
      # must keep 90% of its lines covered, or the run fails.
      - name: Renderer unit tests, 90% line coverage per covered file
        run: npm run test:unit:coverage

  app-e2e-smoke:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Two FFmpegs (app/e2e/streamMedia.ts): the app's own, the one under test, built from the
      # pinned source by fetch.mjs (ADR-0028; cached, rebuilt when its source or build script
      # changes); and Homebrew's full FFmpeg, test-only, which makes the sample media and reads the
      # results back (ours can't encode). The image ships Homebrew but not FFmpeg.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/resources/bin
          key: media-tools-${{ hashFiles('scripts/media-tools/tools.json', 'scripts/media-tools/licenses/**', 'scripts/media-tools/build-ffmpeg.sh', 'scripts/media-tools/fetch.mjs') }}
      - name: Fetch yt-dlp and Deno, and build FFmpeg (pinned SHA-256s, docs/MEDIA-TOOLS.md)
        run: node ../scripts/media-tools/fetch.mjs
      - name: Install a full FFmpeg for the test media
        run: brew install ffmpeg
      - run: npm run test:e2e:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14

  # Phase 1 acceptance criterion 1: build the DMG, audit it, install it like a user, reach ready.
  package:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: Build the helper that ships inside the app
        working-directory: daemon
        run: |
          version=$(node -p "require('../app/package.json').version")
          go build -trimpath -ldflags "-X main.version=$version" -o bin/mergelane-daemon ./cmd/mergelane-daemon
          go build -trimpath -ldflags "-X main.version=$version" -o bin/mergelane-nmhost ./cmd/mergelane-nmhost
      # FFmpeg is compiled from its pinned source here (ADR-0028), with the image's Xcode command line
      # tools (clang, make); the cache keeps the result until its source or build script changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/resources/bin
          key: media-tools-${{ hashFiles('scripts/media-tools/tools.json', 'scripts/media-tools/licenses/**', 'scripts/media-tools/build-ffmpeg.sh', 'scripts/media-tools/fetch.mjs') }}
      - name: Fetch yt-dlp and Deno, and build FFmpeg (pinned SHA-256s, docs/MEDIA-TOOLS.md)
        run: node ../scripts/media-tools/fetch.mjs
      - name: Build the arm64 DMG (ad-hoc signed)
        # electron-builder skips signing on pull requests unless told otherwise. Ad-hoc signing uses
        # no secrets, so forcing it is safe on any pull request, including forks.
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npm run build:extension && npx electron-vite build && npx electron-builder --mac --publish never
      - name: Audit Electron fuses with REA
        run: node ../scripts/ci/audit-fuses.mjs dist/mac-arm64/Mergelane.app
      - name: Install from the DMG and reach the ready state
        run: |
          version=$(node -p "require('./package.json').version")
          bash ../scripts/ci/package-test.sh "dist/Mergelane-$version-arm64.dmg" "$version"
      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mergelane-dmg
          path: app/dist/Mergelane-*-arm64.dmg
          retention-days: 7

  daemon:
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      # Upstream's SOCKS and probe tests need two extra loopback addresses.
      - run: sudo ifconfig lo0 alias 127.0.0.2/32 && sudo ifconfig lo0 alias 127.0.0.3/32
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./... # staticcheck 2026.2.2
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage by package
        run: go tool cover -func=coverage.out | tail -1 && rm coverage.out
      - run: go build -trimpath -o mergelane-daemon ./cmd/mergelane-daemon && file mergelane-daemon

  # Phase 1 M1.5: the simulated-network harness proves itself and its leak detection.
  netsim:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # pinned-get.mjs loads koffi from app/node_modules; its prebuilt binary needs no install script.
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: node --test --experimental-test-coverage scripts/netsim/*.test.mjs
      - name: Self-test with a 20 and a 50 Mbit/s link
        run: bash scripts/netsim/with-netsim.sh "1:20:10:0 2:50:10:0" -- bash scripts/netsim/selftest.sh
      - name: A leftover route fails the run
        run: |
          if bash scripts/netsim/with-netsim.sh "1:20:10:0" -- sudo route -q -n add -host 192.0.2.77 127.0.0.1; then
            echo "with-netsim did not notice the leftover route" >&2
            exit 1
          fi
          sudo route -q -n delete -host 192.0.2.77 127.0.0.1
      - name: Clean up after a failure
        if: always()
        run: sudo bash scripts/netsim/netsim.sh down

  # Phase 1 acceptance criteria 3, 4, 5 and the system half of 6, on simulated links.
  daemon-acceptance:
    runs-on: xcode-27
    timeout-minutes: 25
    needs: [daemon, netsim]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Daemon acceptance on a 20 and a 50 Mbit/s link
        run: bash scripts/netsim/with-netsim.sh "1:20:10:0 2:50:10:0" -- bash scripts/acceptance/daemon.sh
      - name: Clean up after a failure
        if: always()
        run: |
          sudo pkill -f mergelane-acceptance-bin || true
          sudo /tmp/mergelane-acceptance-bin/mergelane-daemon uninstall || true
          sudo /tmp/mergelane-acceptance-bin/mergelane-daemon cleanup || true
          sudo bash scripts/netsim/netsim.sh down

  # Phase 1 acceptance criteria 2 and 6 (app part): the app's downloads over simulated links.
  app-acceptance:
    runs-on: xcode-27
    timeout-minutes: 30
    needs: [netsim]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: App downloads on a 20 and a 50 Mbit/s link
        run: >-
          bash scripts/netsim/with-netsim.sh "1:20:10:0 2:50:10:0" --
          bash -c 'cd app && npx playwright test --grep @netsim --reporter=list --workers=1'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-netsim
          path: app/playwright-report
          retention-days: 14
      - name: Clean up after a failure
        if: always()
        run: sudo bash scripts/netsim/netsim.sh down

  # Chromium + the real extension + mergelane-nmhost + the app (docs/BROWSER-BRIDGE.md).
  extension-e2e:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx playwright install chromium
        working-directory: app
      - run: npx playwright test --grep @extension --reporter=list
        working-directory: app
