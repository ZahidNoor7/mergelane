<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mergelane Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one page column. Prototype controls, then a macOS window (sidebar | list | inspector), then the change list.
   Colour: a theme is a handful of seeds (ML_THEMES, below): window and sidebar grounds, ink, one accent and the three
   network colours, for light and for dark. Every other colour token is derived from those seeds right here, so a
   theme change reaches every surface, line, control, selection, focus ring and chart without per-component work.
   Type: Archivo for words and, at a condensed width, for every figure. Fragment Mono only for interface names and links. */
:root {
  --traffic-close: #FF5F57;
  --traffic-min: #FEBC2E;
  --traffic-max: #28C840;
  /* states keep their meaning in every theme */
  --color-danger: #BB2F28;
  --color-danger-bg: #FCEDEC;
  --color-danger-border: #F2C4C0;
  --color-warning: #8F5300;
  --color-warning-bg: #FBF1DF;
  --color-warning-border: #EED7A8;
  --lane-mark: rgb(255 255 255 / 0.6);
  --scrim: rgb(16 20 28 / 0.24);
  --shadow-window: 0 0 0 1px rgb(16 20 28 / 0.10), 0 2px 6px rgb(16 20 28 / 0.06), 0 32px 80px -28px rgb(16 20 28 / 0.40);
  --shadow-sheet: 0 0 0 1px rgb(16 20 28 / 0.10), 0 24px 60px -18px rgb(16 20 28 / 0.45);
  --shadow-raise: 0 1px 2px rgb(16 20 28 / 0.14), 0 0 0 0.5px rgb(16 20 28 / 0.10);
  /* how strongly ink shows through for lines and secondary text; High contrast raises these */
  --line: 14%; --line-subtle: 8%; --line-strong: 34%; --ink-2: 76%; --ink-3: 63%;
  --thumb-mix: 0%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-danger: #FF8B82; --color-danger-bg: #3A1D1C; --color-danger-border: #5C2C2A;
    --color-warning: #F0B35E; --color-warning-bg: #33260F; --color-warning-border: #5A4219;
    --lane-mark: rgb(0 0 0 / 0.38); --scrim: rgb(0 0 0 / 0.5);
    --shadow-window: 0 0 0 1px rgb(255 255 255 / 0.07), 0 32px 80px -24px rgb(0 0 0 / 0.75);
    --shadow-sheet: 0 0 0 1px rgb(255 255 255 / 0.08), 0 24px 60px -18px rgb(0 0 0 / 0.70);
    --shadow-raise: 0 1px 2px rgb(0 0 0 / 0.50), 0 0 0 0.5px rgb(255 255 255 / 0.08);
    --thumb-mix: 62%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-danger: #FF8B82; --color-danger-bg: #3A1D1C; --color-danger-border: #5C2C2A;
  --color-warning: #F0B35E; --color-warning-bg: #33260F; --color-warning-border: #5A4219;
  --lane-mark: rgb(0 0 0 / 0.38); --scrim: rgb(0 0 0 / 0.5);
  --shadow-window: 0 0 0 1px rgb(255 255 255 / 0.07), 0 32px 80px -24px rgb(0 0 0 / 0.75);
  --shadow-sheet: 0 0 0 1px rgb(255 255 255 / 0.08), 0 24px 60px -18px rgb(0 0 0 / 0.70);
  --shadow-raise: 0 1px 2px rgb(0 0 0 / 0.50), 0 0 0 0.5px rgb(255 255 255 / 0.08);
  --thumb-mix: 62%;
  color-scheme: dark;
}
/* Derived tokens. Declared again on .ml-surface, which re-grounds a region (the sidebar) on the theme's sidebar
   colours, so a dark sidebar in a light theme gets its own hovers, lines, ink and controls. */
:root, .ml-surface {
  --bg-secondary: var(--card);
  --bg-tertiary: color-mix(in oklab, var(--text) 5%, var(--bg));
  --sunken: color-mix(in oklab, var(--text) 4.5%, var(--bg));
  --input-bg: var(--card);
  --track-bg: color-mix(in oklab, var(--text) 10%, var(--bg));
  --hover: color-mix(in oklab, var(--color-accent) 6%, color-mix(in oklab, var(--text) 3%, var(--bg)));
  --selected: color-mix(in oklab, var(--color-accent) 15%, var(--bg));
  --text-secondary: color-mix(in oklab, var(--text) var(--ink-2), var(--bg));
  --text-tertiary: color-mix(in oklab, var(--text) var(--ink-3), var(--bg));
  --border: color-mix(in oklab, var(--text) var(--line), var(--bg));
  --border-subtle: color-mix(in oklab, var(--text) var(--line-subtle), var(--bg));
  --border-strong: color-mix(in oklab, var(--text) var(--line-strong), var(--bg));
  --control: color-mix(in oklab, var(--text) 52%, var(--bg));
  --focus: var(--color-accent);
  --icon-muted: color-mix(in oklab, var(--text) 24%, var(--bg));
  --scrollbar-thumb: color-mix(in oklab, var(--text) 22%, var(--bg));
  --switch-off: color-mix(in oklab, var(--text) 13%, var(--bg));
  --switch-on: var(--color-accent);
  --switch-thumb-on: var(--color-accent-onsolid);
  --switch-thumb-off: color-mix(in oklab, var(--text) var(--thumb-mix), var(--card));
  --color-accent-soft: color-mix(in oklab, var(--color-accent) 13%, var(--bg));
  --color-accent-ink: var(--accent-ink, var(--color-accent));
  --color-wifi-bg: color-mix(in oklab, var(--color-wifi) 14%, var(--bg));
  --color-usb-bg: color-mix(in oklab, var(--color-usb) 14%, var(--bg));
  --color-ethernet-bg: color-mix(in oklab, var(--color-ethernet) 14%, var(--bg));
}
.ml-surface { --bg: var(--sidebar); --text: var(--sidebar-ink); --card: var(--sidebar-card); --thumb-mix: var(--sidebar-thumb-mix); color: var(--text); }
html, body { background: var(--desk); color: var(--text); }
body {
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.page {
  box-sizing: border-box;
  width: 100%;
  max-width: 1280px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.boot { font-size: 14px; color: var(--text-secondary); padding-block: 24px; }
/* Lane markings drift along each network's lane while it carries bytes. */
@keyframes ml-flow { to { stroke-dashoffset: -12; } }
.ml-flow { animation: ml-flow 1s linear infinite; }
.ml-still { animation: none; }
@media (prefers-reduced-motion: reduce) {
  .ml-flow { animation: none; }
}
/* While the theme changes, colours ease for 220ms instead of jumping (no movement, so reduced motion keeps it). */
:root.ml-theme-fade, :root.ml-theme-fade *, :root.ml-theme-fade *::before, :root.ml-theme-fade *::after {
  transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, fill 220ms ease, stroke 220ms ease, box-shadow 220ms ease !important;
}
</style>

(function () {

  function decl(m) {
    if (!m.sidebarInk) m.sidebarInk = m.text;
    var out = '';
    for (var k in NAMES) if (m[k]) out += NAMES[k] + ':' + m[k] + ';';

    out += '--sidebar-thumb-mix:' + (m.sidebarDark ? '62%' : '0%') + ';';

  var css = '';

    var d = decl(t.dark);
    css += sel + '{' + decl(t.light) + '}';

    css += sel + '[data-theme="dark"]{' + d + '}';
  });

  el.textContent = css;

  var root = document.documentElement;

  try { p = localStorage.getItem('mergelane-redesign-palette') || 'porcelain'; } catch (e) {}
  if (!window.ML_THEMES.some(function (x) { return x.id === p; })) p = 'porcelain';
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);

<style>
/* ── Liquid Glass (macOS 27) ────────────────────────────────────────────────────────────────
   Soft, layered glass, built the way the reference canvas builds it:
   • a living desktop behind everything: a pastel wash, slow-drifting blurred colour ribbons, a veil and fine grain;
   • glass = a thin translucent fill + backdrop blur/saturation (+ SVG refraction in Chromium, i.e. Electron),
     a 1px conic rim that is bright where the light hits (the light angle follows the pointer), an inner glow,
     a top sheen and a specular spot that tracks the pointer;
   • layers: desktop → window (no backdrop filter, so the glass inside it still sees the desktop) → sidebar and
     content pane (glass) → cards, toolbar controls and sheets (glass on glass, each a little thicker);
   • glass buttons swell when pressed; content buttons press in.
   Soft, low-glare colours; every text pair still meets WCAG AA. Scoped to [data-palette="liquid"]: other themes
   are untouched. Reduce Transparency (system or in-app) makes every layer solid; Increase Contrast thickens fills
   and rims; Reduce Motion stops the drift and the springs. */
@property --la { syntax: '<angle>'; inherits: true; initial-value: 135deg; }

.ml-wallpaper, .ml-fx { display: none; }

:root[data-palette="liquid"] {
  --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --la: 135deg;
  transition: --la 600ms cubic-bezier(0.22, 1, 0.36, 1);
  /* desktop */
  /* Crystal: a bright, clear desktop; colour passes through the glass instead of clouding it */
  --wp0: #F7FAFF; --wp1: #FBF8FF; --wp2: #F1FBFA;
  --ra1: #7D8BFF; --ra2: #C08BFF; --rb1: #5AA2FF; --rb2: #4FE0E6; --rc1: #FFB08A; --rc2: #FF8FC0; --rd1: #8FD0FF; --rd2: #B8F2FF;
  --ribbon-a: 0.46; --veil: rgb(255 255 255 / 0); --grain-a: 0.05;
  /* glass fills, thinnest to thickest (reference: clear .04, regular .22, thick .62) */
  --g-window: rgb(255 255 255 / 0.12);
  --g-reg: rgb(255 255 255 / 0.3);
  --g-side: rgb(255 255 255 / 0.28);
  --g-pane: rgb(255 255 255 / 0.42);
  --g-card: rgb(255 255 255 / 0.5);
  --g-thick: rgb(255 255 255 / 0.64);
  --g-solid-1: #F7F8FB; --g-solid-2: #FFFFFF;
  /* light on the material */
  --rim-hi: rgb(255 255 255 / 1); --rim-mid: rgb(255 255 255 / 0.75); --rim-lo: rgb(255 255 255 / 0.28);
  --sheen: rgb(255 255 255 / 0.5); --spec: rgb(255 255 255 / 0.85);
  --g-shadow: inset 0 1px 1px rgb(255 255 255 / 0.8), inset 0 -1px 1px rgb(255 255 255 / 0.3), inset 0 0 20px -6px rgb(255 255 255 / 0.5), 0 1px 2px rgb(20 24 50 / 0.06), 0 8px 26px -10px rgb(20 24 50 / 0.24);
  --g-lift: inset 0 1px 1px rgb(255 255 255 / 0.85), inset 0 0 24px -6px rgb(255 255 255 / 0.5), 0 2px 6px rgb(20 24 50 / 0.08), 0 30px 70px -22px rgb(20 24 50 / 0.42);
  --card-sh: inset 0 1px 1px rgb(255 255 255 / 0.75), inset 0 0 16px -8px rgb(255 255 255 / 0.55), 0 1px 1px rgb(20 24 50 / 0.04), 0 4px 18px -8px rgb(20 24 50 / 0.14);
  /* Apple-style fills and separators, translucent so the glass shows through */
  --card: var(--g-card);
  --border: rgb(60 60 67 / 0.13); --border-subtle: rgb(60 60 67 / 0.08); --border-strong: rgb(60 60 67 / 0.26);
  --sunken: rgb(118 118 128 / 0.08); --bg-tertiary: rgb(118 118 128 / 0.08); --input-bg: rgb(255 255 255 / 0.55);
  --track-bg: rgb(118 118 128 / 0.12); --hover: rgb(127 127 127 / 0.08);
  --selected: color-mix(in oklab, var(--color-accent) 14%, rgb(255 255 255 / 0.5));
  --switch-off: rgb(118 118 128 / 0.16); --switch-thumb-off: #FFFFFF;
  --fill-hover: rgb(127 127 127 / 0.1); --fill-selected: rgb(127 127 127 / 0.16); --track-glass: rgb(118 118 128 / 0.12);
  --scrim: rgb(40 48 80 / 0.12);
  --shadow-sheet: var(--g-lift);
  --bf-pane: blur(14px) saturate(2) brightness(1.08);
  --bf-sheet: blur(18px) saturate(1.9) brightness(1.06);
  /* charts: gradient fills from the network colours (defs in the .ml-fx svg), glass tooltips, quiet grids */
  --chart-wifi: url(#ml-g-wifi); --chart-usb: url(#ml-g-usb); --chart-ethernet: url(#ml-g-ethernet);
  --spark-wifi: url(#ml-s-wifi); --spark-usb: url(#ml-s-usb); --spark-ethernet: url(#ml-s-ethernet); --spark-a: 1;
  --spark-ink: url(#ml-s-ink); --spark-ink-line: var(--color-accent-ink);
  --lane-wifi: url(#ml-l-wifi); --lane-usb: url(#ml-l-usb); --lane-ethernet: url(#ml-l-ethernet); --lane-tint: #FFFFFF;
  --lane-start-wifi: color-mix(in oklab, var(--color-wifi) 62%, var(--lane-tint));
  --lane-start-usb: color-mix(in oklab, var(--color-usb) 62%, var(--lane-tint));
  --lane-start-ethernet: color-mix(in oklab, var(--color-ethernet) 62%, var(--lane-tint));
  --chart-grid: rgb(60 60 67 / 0.12); --chart-sep: rgb(255 255 255 / 0.9); --chart-total: #1E2233; --chart-glow: rgb(255 255 255 / 0.9);
}
/* The sidebar's tokens follow the glass too, not its seed colours. */
:root[data-palette="liquid"] .ml-surface {
  --card: var(--g-card); --border: rgb(60 60 67 / 0.13); --border-subtle: rgb(60 60 67 / 0.08); --border-strong: rgb(60 60 67 / 0.26);
  --sunken: rgb(118 118 128 / 0.08); --track-bg: rgb(118 118 128 / 0.12); --hover: rgb(127 127 127 / 0.08);
  --selected: color-mix(in oklab, var(--color-accent) 14%, rgb(255 255 255 / 0.5)); --switch-off: rgb(118 118 128 / 0.16); --switch-thumb-off: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root[data-palette="liquid"]:not([data-theme="light"]), :root[data-palette="liquid"]:not([data-theme="light"]) .ml-surface {
    --wp0: #05070E; --wp1: #0B0920; --wp2: #03121A;

                    <animateMotion dur="0.9s" begin={`${n * 0.3 + k * 0.15}s`} repeatCount="indefinite" path={d} rotate="auto" />
                    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="0.9s" begin={`${n * 0.3 + k * 0.15}s`} repeatCount="indefinite" />
                  </rect>
                ))}
              </g>
            );
          })}
          </g>
        </svg>
        {!stacked && totalBlock}
      </div>
    </div>
  );
}

function rowMeta(d, now) {

  if (d.status === 'expired') return [`Link expired at ${pct}%`, 'Paste a fresh link to carry on'];

const GROUPS = [
  ['expired', 'Needs attention'],
  ['downloading', 'Downloading'],
  ['queued', 'Waiting'],
  ['paused', 'Paused'],
  ['finished', 'Finished'],
];
const IN_PROGRESS = ['downloading', 'queued', 'paused'];

/* Chunk, piece or segment map: rows of capsule dashes like lane markings, each in the colour of the
   network that fetched it. Point at one, or focus the map and use the arrow keys. */
function buildCells(d, links, N, route) {
  const p = received(d) / d.size;
  const shares = links.filter((l) => (d.bytesByLink[l.id] || 0) > 0).map((l) => ({ l, w: d.bytesByLink[l.id] }));
  const W = shares.reduce((a, s) => a + s.w, 0) || 1;
  const pick = (r) => { let acc = 0; for (const s of shares) { acc += s.w / W; if (r <= acc) return s.l; } return shares.length ? shares[shares.length - 1].l : links[0]; };
  const lanes = [];
  const routed = (d.status !== 'finished' && route) || d.uses;
  for (const l of links) if (routed.includes(l.id) && l.state === 'up') for (let k = 0; k < Math.min(3, d.streams[l.id] || 1); k++) lanes.push(l);
  const activeN = d.status === 'downloading' || d.status === 'paused' ? Math.min(lanes.length, N) : 0;
  const exact = d.status === 'finished' ? N : p * N;
  const doneN = d.status === 'finished' ? N : clamp(Math.floor(exact - activeN * 0.5), 0, N);
  const order = Array.from({ length: N }, (_, i) => i);
  if (d.kind === 'torrent') order.sort((a, b) => hash01(a, 3) - hash01(b, 3));
  const cells = new Array(N);
  order.forEach((idx, rank) => {
    if (rank < doneN) cells[idx] = { state: 'done', link: pick(hash01(idx, d.id.length * 7)) };
    else if (rank < doneN + activeN) {
      const j = rank - doneN;
      cells[idx] = { state: 'active', link: lanes[j % lanes.length], fill: clamp(((exact - doneN) / Math.max(1, activeN)) * (1.7 - (j * 1.4) / Math.max(1, activeN)), 0.08, 0.92) };
    } else cells[idx] = { state: 'pending' };
  });
  return cells;
}

function LaneMap({ d, links }) {
  const N = clamp(Math.round(d.size / d.chunk), 8, 160);
  const word = d.kind === 'torrent' ? 'piece' : d.kind === 'video' ? 'segment' : 'chunk';
  const Word = word[0].toUpperCase() + word.slice(1);
  const bucket = Math.floor((received(d) / d.size) * N * 3);
  const route = useApp((s) => s.route);
  const cells = useMemo(() => buildCells(d, links, N, route), [d.id, bucket, d.status, N, links.map((l) => l.state).join(), String(route)]);
  const [cursor, setCursor] = useState(null);
  const [ref, w] = useWidth();
  const cols = Math.max(8, Math.floor((w + 4) / 18));
  const readoutId = useId();
  const used = links.filter((l) => d.uses.includes(l.id) || (route || []).includes(l.id) || (d.bytesByLink[l.id] || 0) > 0);
  const cell = cursor !== null ? cells[cursor] : null;
  const readout = cell
    ? `${Word} ${cursor + 1} of ${N}: ${cell.state === 'done' ? `fetched over ${cell.link.name} (${cell.link.id})` : cell.state === 'active' ? `in progress over ${cell.link.name} (${cell.link.id})` : 'not fetched yet'}`
    : `${N} ${word}s of about ${fmtBytes(d.chunk)}. Point at one, or focus the map and use the arrow keys.`;
  const onKeyDown = (e) => {
    const moves = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols };
    if (e.key in moves) { e.preventDefault(); setCursor((c) => clamp((c ?? -1) + (c === null ? 1 : moves[e.key]), 0, N - 1)); }
    else if (e.key === 'Home') { e.preventDefault(); setCursor(0); }
    else if (e.key === 'End') { e.preventDefault(); setCursor(N - 1); }
    else if (e.key === 'Escape') setCursor(null);
  };
  return (
    <section aria-label={`${Word}s`} className="flex flex-col gap-2.5">
      <SectionTitle aside={<span className="flex flex-wrap items-center gap-x-3 gap-y-1">{used.map((l) => <span key={l.id} className="inline-flex items-center gap-1.5 text-[12px] text-ink-2"><Swatch kind={l.kind} />{l.name}</span>)}</span>}>
        {Word}s
      </SectionTitle>
      <div
        ref={ref}
        tabIndex={0}
        role="group"
        aria-label={`${Word} map`}
        aria-describedby={readoutId}
        onKeyDown={onKeyDown}
        onBlur={() => setCursor(null)}
        onPointerLeave={() => setCursor(null)}
        className="grid gap-x-1 rounded-md outline-none focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ring"
        style={{ gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))` }}
      >
        {cells.map((c, i) => {
          const color = c.link ? `var(--color-${c.link.kind})` : null;
          return (
            <span key={i} onPointerEnter={() => setCursor(i)} className="flex h-3.5 items-center">
              <span
                className="relative h-1.5 w-full overflow-hidden rounded-full"
                style={{
                  background: c.state === 'done' ? color : 'var(--track-bg)',
                  boxShadow: c.state === 'active' ? `0 0 0 1px ${color}` : undefined,
                  outline: cursor === i ? '2px solid var(--focus)' : undefined,
                  outlineOffset: 2,
                  opacity: c.state === 'active' && d.status === 'paused' ? 0.5 : 1,
                }}
              >
                {c.state === 'active' && <span className="absolute inset-y-0 left-0" style={{ width: `${c.fill * 100}%`, background: color }} />}
              </span>
            </span>
          );
        })}
      </div>
      <p id={readoutId} aria-live="polite" className="min-h-[1.5em] text-[12px] leading-snug text-ink-2">{readout}</p>
    </section>
  );
}

function Inspector({ d, onBack }) {
  const links = useApp((s) => s.links);
  const unit = useApp((s) => s.unit);
  const now = useApp((s) => s.now);
  const toggle = useApp((s) => s.toggleDownload);
  const remove = useApp((s) => s.removeDownload);
  const [confirming, setConfirming] = useState(false);
  useEffect(() => setConfirming(false), [d.id]);
  const route = useApp((s) => s.route);
  const limits = useApp((s) => s.limits);
  // Networks it can use now (the download route overrides the download's own choice), plus any that already carried part of it.
  const routed = d.status !== 'finished' && route ? route : d.uses;
  const used = links.filter((l) => routed.includes(l.id) || (d.bytesByLink[l.id] || 0) > 0);
  const got = received(d);
  const sp = speedOf(d);
  const up = sum(d.upByLink);
  const running = d.status === 'downloading';
  const pct = Math.floor((got / d.size) * 100);
  const lanes = used.map((l) => ({ id: l.id, name: l.name, kind: l.kind, speed: (d.speedByLink && d.speedByLink[l.id]) || 0, down: l.state === 'down', on: running && l.enabled && routed.includes(l.id), limited: running && routed.includes(l.id) && l.atLimit && l.atLimit.down, note: l.planOff && d.status !== 'finished' ? 'Not in plan' : d.status !== 'finished' && !routed.includes(l.id) ? 'Not used' : null }));
  const statusWord = { downloading: 'Speed', paused: 'Paused', queued: d.startAt ? `Starts at ${d.startAt}` : 'Waiting for a turn', finished: 'Finished', expired: 'Link expired' }[d.status];
  const handover = useApp((s) => s.handover);
  const setFiles = useApp((s) => s.setTorrentFiles);
  const saved = timeSavedSec(d);
  const linkNoun = d.kind === 'torrent' ? 'peers' : d.kind === 'video' ? 'streams' : 'streams';
  return (
    <div className="flex flex-col gap-6 p-4 @container">
      {onBack && (
        <Button variant="ghost" size="sm" className="-ml-2 self-start" onClick={onBack}><ChevronLeft />Downloads</Button>
      )}
      <header className="flex items-start gap-3">
        <FileGlyph d={d} size={40} />
        <div className="flex min-w-0 flex-1 flex-col gap-1.5">
          <h3 className="text-[15px] leading-snug font-[650] tracking-[-0.01em] break-words">{d.name}</h3>
          <div className="flex flex-wrap items-center gap-1.5">
            <KindTags d={d} />
            {d.host && <span className="font-mono text-[11.5px] text-ink-2">{d.host}</span>}
          </div>
          <p className="text-[12px] text-ink-3">Saving to <SavedFolder /><SavedAgo d={d} /></p>
        </div>
      </header>

      {d.status === 'expired' && <FreshLinkPanel d={d} />}

      {d.status !== 'finished' && (
        <Confluence compact lanes={lanes} unit={unit} idle={!running} label={statusWord} handover={handover && (d.uses.includes(handover.from) || (d.bytesByLink[handover.from] || 0) > 0) ? handover : null} caption={running && sp > 0 ? `${fmtEta((d.size - got) / sp)} left` : null} />
      )}

      <dl className="grid grid-cols-2 gap-x-4 gap-y-3 @sm:grid-cols-4">
        <Stat label="Done">{d.status === 'finished' ? '100%' : `${pct}%`}</Stat>
        {d.status === 'finished' && saved > 30 ? <Stat label="Saved by merging">{fmtLong(saved)}</Stat> : <Stat label="Received">{fmtBytes(got)}</Stat>}
        <Stat label={d.kind === 'torrent' ? 'Peers' : d.kind === 'video' ? 'Quality' : 'Size'}>{d.kind === 'torrent' ? d.peers : d.kind === 'video' ? d.quality : fmtBytes(d.size)}</Stat>
        <Stat label={d.kind === 'torrent' && running ? 'Uploading' : 'Peak'}>{d.kind === 'torrent' && running ? fmtSpeedText(up, unit) : d.peak ? fmtSpeedText(d.peak, unit) : '—'}</Stat>
      </dl>

      <section aria-label="By network" className="flex flex-col gap-1">
        <SectionTitle>By network</SectionTitle>
        <ul className="flex flex-col">
          {used.map((l) => {
            const b = d.bytesByLink[l.id] || 0;
            const share = got > 0 ? Math.round((b / got) * 100) : 0;
            const s = (d.speedByLink && d.speedByLink[l.id]) || 0;
            return (
              <li key={l.id} className="grid grid-cols-[auto_minmax(0,1fr)_3.25rem_minmax(5.5rem,auto)] items-center gap-x-3 border-b border-rule py-2 last:border-b-0">
                <LinkTile kind={l.kind} size={22} dim={l.state === 'down'} />
                <div className="min-w-0">
                  <p className="flex items-center gap-1.5 text-[13px] leading-tight font-[600]"><span className="truncate">{l.name}</span><span className="font-mono text-[11px] font-normal text-ink-3"><IfName id={l.id} name={l.name} /></span></p>
                  <p className="truncate text-[12px] text-ink-3">
                    {l.state === 'down' ? <span className="text-destructive">Dropped, its {linkNoun} moved to the others</span>
                      : d.status !== 'finished' && !routed.includes(l.id) ? `${fmtBytes(b)}, not used now`
                      : [`${fmtBytes(b)}, ${d.streams[l.id] || 1} ${linkNoun}`,
                         running && isFinite(limitFor({ ...useApp.getState(), limits }, l.id, 'down')) ? `limit ${fmtSpeedText(limitFor({ ...useApp.getState(), limits }, l.id, 'down'), unit)}` : null,
                         d.kind === 'torrent' && running && (d.upByLink || {})[l.id] ? `↑ ${fmtSpeedText(d.upByLink[l.id], unit)}` : null].filter(Boolean).join(', ')}
                  </p>
                </div>
                <span className="figures text-right text-[14px] font-[600]">{share}%</span>
                <Speed bps={s} unit={unit} dash={!running || l.state === 'down' || !routed.includes(l.id)} className="text-right text-[14px] font-[600]" />
              </li>
            );
          })}
        </ul>
      </section>

      {d.kind === 'torrent' && d.files && d.files.length > 1 && (
        <section aria-label="Files" className="flex flex-col gap-2">
          <SectionTitle aside={<span className="text-[12px] text-ink-3">Change any time</span>}>Files</SectionTitle>
          <TorrentFiles compact files={d.files} onChange={(f) => { if (f.some((x) => x.on)) setFiles(d.id, f); }} progress={() => (d.status === 'finished' ? 1 : Math.min(1, got / d.size))} />
          <p className="text-[12px] leading-snug text-ink-3">A skipped file isn’t downloaded. Pieces it shares with a chosen file are, so a few MB of it can appear until the torrent finishes.</p>
        </section>
      )}

      <LaneMap d={d} links={links} />

      <div className="flex flex-wrap items-center gap-2 border-t border-rule pt-4">
        {d.status !== 'finished' && d.status !== 'expired' && (
          <Button variant="secondary" size="sm" onClick={() => toggle(d.id)}>
            {running ? <><Pause />Pause</> : <><Play />{d.status === 'queued' ? 'Start now' : 'Resume'}</>}
          </Button>
        )}
        {!confirming ? (
          <Button variant="ghost" size="sm" onClick={() => setConfirming(true)}><Trash2 />Remove from list</Button>
        ) : (
          <div role="group" aria-label="Confirm removal" className="flex flex-wrap items-center gap-2">
            <span className="text-[12.5px] text-ink-2">Remove it from the list? The file stays on disk and in History.</span>
            <Button variant="destructive" size="sm" onClick={() => remove(d.id)}>Remove</Button>
            <Button variant="ghost" size="sm" onClick={() => setConfirming(false)}>Keep</Button>
          </div>
        )}
      </div>
    </div>
  );
}

function FilterPanel({ list, shownCount }) {
  const filters = useApp((s) => s.filters);
  const now = useApp((s) => s.now);
  const setFilters = useApp((s) => s.setFilters);
  const clearFilters = useApp((s) => s.clearFilters);
  const bad = customInvalid(filters);
  // Counts for each choice, given the other filter as it stands.
  const byDate = (id) => list.filter((d) => matchesFilters(d, { ...filters, date: id }, now)).length;
  const byType = (id) => list.filter((d) => matchesFilters(d, { ...filters, types: [] }, now) && fileTypeOf(d) === id).length;
  const today = dayInput(now);
  return (
    <div id="download-filters" role="group" aria-label="Filters" className="mx-1.5 flex flex-col gap-4 rounded-[14px] bg-card p-3.5 shadow-[inset_0_0_0_1px_var(--border)]">
      <fieldset className="flex flex-col gap-2">
        <legend className="mb-2 flex items-center gap-1.5 text-[12.5px] font-[650] text-ink-2"><CalendarDays className="size-3.5" />Date added</legend>
        <div className="flex flex-wrap gap-1.5">
          {DATE_RANGES.map((r) => (
            <Chip key={r.id} pressed={filters.date === r.id} count={r.id === 'any' || r.id === 'custom' ? undefined : byDate(r.id)}
              onClick={() => setFilters(r.id === 'custom' && !filters.from && !filters.to ? { date: r.id, from: dayInput(now - 6 * DAY), to: today } : { date: r.id })}>
              {r.label}
            </Chip>
          ))}
        </div>
        {filters.date === 'custom' && (
          <div className="flex flex-wrap items-center gap-2 pt-1">
            {[['from', 'From'], ['to', 'To']].map(([k, label]) => (
              <label key={k} className="flex h-8 items-center gap-2 rounded-full bg-[var(--input-bg)] pr-2 pl-3 text-[12.5px] text-ink-2 shadow-[inset_0_0_0_1px_var(--control)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-ring">
                {label}
                <input type="date" value={filters[k]} max={today} aria-invalid={bad || undefined} onChange={(e) => setFilters({ [k]: e.target.value })} className="figures bg-transparent text-[13.5px] text-foreground outline-none" />
              </label>
            ))}
            {bad
              ? <span role="alert" className="inline-flex items-center gap-1.5 text-[12px] text-destructive"><TriangleAlert className="size-3.5" />The start date is after the end date.</span>
              : <span className="text-[12px] text-ink-3">Both days included.</span>}
          </div>
        )}
      </fieldset>
      <fieldset className="flex flex-col">
        <legend className="mb-2 text-[12.5px] font-[650] text-ink-2">File type</legend>
        <div className="flex flex-wrap gap-1.5">
          <Chip pressed={filters.types.length === 0} onClick={() => setFilters({ types: [] })}>Any type</Chip>
          {FILE_TYPE_DEFS.map((t) => {
            const on = filters.types.includes(t.id);
            return (
              <Chip key={t.id} pressed={on} count={byType(t.id)} onClick={() => setFilters({ types: on ? filters.types.filter((x) => x !== t.id) : [...filters.types, t.id] })}>
                <t.icon />{t.label}
              </Chip>
            );
          })}
        </div>
      </fieldset>
      <div className="flex flex-wrap items-center gap-2 border-t border-rule pt-3">
        <p className="text-[12.5px] text-ink-2" aria-live="polite">Showing <span className="figures font-[640] text-foreground">{shownCount}</span> of {list.length} downloads</p>
        <Button size="sm" variant="ghost" className="ml-auto" disabled={!filtersActive(filters)} onClick={clearFilters}>Clear filters</Button>
        <Button size="sm" onClick={() => useApp.setState({ filtersOpen: false })}>Done</Button>
      </div>
    </div>
  );
}

function ActiveFilterChips() {

  const etaSecs = (() => { const left = active.reduce((a, d) => a + d.size - received(d), 0); const sp = active.reduce((a, d) => a + speedOf(d), 0); return sp > 0 ? left / sp : Infinity; })();

          <label className="ml-field relative flex h-8 min-w-0 flex-1 items-center rounded-full bg-sunken shadow-[inset_0_0_0_1px_var(--border)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-ring sm:w-52 sm:flex-none">
            <Search className="pointer-events-none absolute left-2.5 size-3.5 text-ink-3" />
            <span className="sr-only">Search downloads</span>
            <input

              placeholder="Search"
              className="h-full w-full min-w-0 rounded-full bg-transparent pr-3 pl-8 text-[13px] outline-none placeholder:text-ink-3"
            />

          <NewDownloadButton compact={compact} />

              <RecoveredBanner />
              <div className="px-1.5">
                <Confluence lanes={lanes} unit={unit} label="Download speed" handover={handover} idle={active.length === 0} caption={active.length ? `${active.length} downloading, about ${fmtEta(etaSecs)} left` : 'Nothing running'} />
              </div>
              <div className="flex flex-wrap items-center gap-2 px-1.5">
                <div className="min-w-0 overflow-x-auto [scrollbar-width:none]">
                  <Segmented
                    label="Show"
                    value={filter}
                    onChange={(v) => useApp.setState({ filter: v })}
                    options={[
                      { value: 'all', label: 'All', count: counts.all },
                      { value: 'progress', label: 'In progress', count: counts.progress },
                      { value: 'finished', label: 'Finished', count: counts.finished },
                      { value: 'attention', label: 'Needs attention', count: counts.attention },

                </div>
                <Button

                  variant={filtersOpen ? 'primary' : 'secondary'}

                  onClick={() => useApp.setState({ filtersOpen: !filtersOpen })}
                >
                  <ListFilter />Filters{anyFilter && <span className="figures ml-0.5 rounded-full bg-[var(--color-accent-soft)] px-1.5 text-[11.5px] text-[var(--color-accent-ink)]">{(filters.date !== 'any' ? 1 : 0) + filters.types.length}</span>}
                </Button>
              </div>
              {filtersOpen && <FilterPanel list={list} shownCount={narrowed.length} />}
              {!filtersOpen && anyFilter && <ActiveFilterChips />}
              {shown.length === 0 ? (
                <div role="status" className="flex flex-col items-start gap-2 px-2.5 py-6">
                  <p className="text-[14px] font-[620]">{q ? `No downloads match “${query.trim()}”` : anyFilter && narrowed.length === 0 ? 'No downloads match these filters' : filter === 'attention' ? 'Nothing needs attention' : 'Nothing here'}</p>

                GROUPS.map(([key, label]) => {
                  const items = shown.filter((d) => d.status === key);
                  if (!items.length) return null;
                  return (
                    <section key={key} aria-labelledby={`group-${key}`}>

          <Inspector d={selected} />
        </aside>
      )}
    </div>
  );
}

function ThroughputChart({ links, unit }) {
  const [ref, w] = useWidth();
  const [hover, setHover] = useState(null);
  const n = 60;
  const H = 156;
  const W = Math.max(w, 100);
  const totals = Array.from({ length: n }, (_, i) => links.reduce((a, l) => a + (l.history[i] || 0), 0));
  const { top, ticks } = speedTicks(Math.max(...totals, 1e6), unit);
  const x = (i) => (i / (n - 1)) * W;
  const y = (v) => H - (v / top) * H;
  let cum = new Array(n).fill(0);
  const layers = links.map((l) => {
    const lower = cum;
    const upper = cum.map((c, i) => c + (l.history[i] || 0));
    cum = upper;
    return { l, upper, lower };
  });
  const pts = (arr) => arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const onMove = (e) => { const r = e.currentTarget.getBoundingClientRect(); setHover(clamp(Math.round(((e.clientX - r.left) / r.width) * (n - 1)), 0, n - 1)); };
  const onKey = (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); setHover((h) => clamp((h ?? n - 1) - 1, 0, n - 1)); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setHover((h) => clamp((h ?? n - 1) + 1, 0, n - 1)); }
    else if (e.key === 'Escape') setHover(null);
  };
  const ago = hover === null ? 0 : n - 1 - hover;
  const latest = totals[n - 1];
  return (
    <div className="flex flex-col gap-3">
      <ul className="flex flex-wrap items-center gap-x-5 gap-y-1.5" aria-label="Legend">
        {links.map((l) => (
          <li key={l.id} className="flex items-center gap-2 text-[12.5px]">
            <Swatch kind={l.kind} className="h-2 w-3.5" />
            <span className="font-[580]">{l.name}</span>
            <Speed bps={l.speed} unit={unit} className="text-[13px] font-[600] text-ink-2" />
          </li>
        ))}
      </ul>
      <div className="flex gap-2">
        <div className={cn('relative shrink-0', unit === 'kb' ? 'w-[4.75rem]' : 'w-[3.75rem]')} style={{ height: H }} aria-hidden>
          {ticks.map((t) => (
            <span key={t.value} className="figures absolute right-0 -translate-y-1/2 text-[11.5px] whitespace-nowrap text-ink-3" style={{ top: y(t.value) }}>{t.label}</span>
          ))}
        </div>
        <div className="min-w-0 flex-1">
          <div
            ref={ref}
            tabIndex={0}
            role="img"
            aria-label={`Merged throughput over the last minute, split by network. Now ${fmtSpeedText(latest, unit)}. Focus and use the left and right arrow keys to read each second.`}
            onPointerMove={onMove}
            onPointerLeave={() => setHover(null)}
            onKeyDown={onKey}
            onBlur={() => setHover(null)}
            className="relative rounded-[4px] outline-none focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ring"
            style={{ height: H }}
          >
            <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} aria-hidden className="block overflow-visible">
              {ticks.map((t) => <line key={t.value} className="ml-grid" x1={0} x2={W} y1={y(t.value)} y2={y(t.value)} stroke="var(--border)" strokeWidth={1} />)}
              {layers.map(({ l, upper, lower }) => (
                <polygon key={l.id} points={`${pts(upper)} ${lower.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).reverse().join(' ')}`} fill={`var(--color-${l.kind})`} style={{ fill: `var(--chart-${l.kind}, var(--color-${l.kind}))` }} />
              ))}
              {layers.slice(0, -1).map(({ l, upper }) => <polyline key={l.id} className="ml-chart-sep" points={pts(upper)} fill="none" stroke="var(--bg)" strokeWidth={2} strokeLinejoin="round" />)}
              <polyline className="ml-chart-total" points={pts(totals)} fill="none" stroke="var(--text)" strokeWidth={1.5} strokeLinejoin="round" />
              {hover !== null && <line className="ml-chart-cursor" x1={x(hover)} x2={x(hover)} y1={0} y2={H} stroke="var(--text)" strokeWidth={1} strokeDasharray="3 3" />}
            </svg>
            {hover !== null && (
              <div
                className="ml-tooltip pointer-events-none absolute top-1 z-10 flex min-w-[11rem] flex-col gap-1 rounded-[10px] bg-popover px-3 py-2 text-[12px] shadow-[var(--shadow-sheet)]"
                style={hover > (n - 1) / 2 ? { right: `calc(${100 - (hover / (n - 1)) * 100}% + 10px)` } : { left: `calc(${(hover / (n - 1)) * 100}% + 10px)` }}
              >
                <span className="text-[11.5px] text-ink-3">{ago === 0 ? 'Now' : `${ago} s ago`}</span>
                {links.map((l) => (
                  <span key={l.id} className="flex items-center gap-2"><Swatch kind={l.kind} /><span className="flex-1">{l.name}</span><Speed bps={l.history[hover] || 0} unit={unit} className="text-[13px] font-[600]" /></span>
                ))}
                <span className="flex items-center gap-2 border-t border-rule pt-1"><span className="flex-1 font-[600]">Merged</span><Speed bps={totals[hover]} unit={unit} className="text-[13px] font-[650]" /></span>
              </div>
            )}
          </div>
          <div className="mt-1.5 flex justify-between text-[11.5px] text-ink-3"><span>60 s ago</span><span>Now</span></div>
        </div>
      </div>
    </div>
  );
}

function DashboardScreen() {
  const route = useApp((s) => s.route);
  const links = useApp((s) => s.links);
  const downloads = useApp((s) => s.downloads);
  const unit = useApp((s) => s.unit);
  const today = useApp((s) => s.today);
  const peak = useApp((s) => s.peak);
  const events = useApp((s) => s.events);
  const empty = useApp((s) => s.empty);
  const select = useApp((s) => s.select);
  const list = empty ? [] : downloads;
  const active = list.filter((d) => IN_PROGRESS.includes(d.status));
  const running = list.filter((d) => d.status === 'downloading');
  const lanes = links.map((l) => ({ id: l.id, name: l.name, kind: l.kind, speed: l.speed, down: l.state === 'down', on: l.enabled && l.speed > 0, limited: l.speed > 0 && l.atLimit && l.atLimit.down, note: l.planOff ? 'Not in plan' : route && !route.includes(l.id) && l.enabled && l.state === 'up' ? 'Not used' : null }));
  const todayTotal = sum(today);
  const left = running.reduce((a, d) => a + d.size - received(d), 0);
  const sp = running.reduce((a, d) => a + speedOf(d), 0);
  const recent = events.filter((e) => Date.now() - e.at < 24 * 3600e3);
  // Total speed: every byte crossing each network, in and out, from every app on the Mac, Mergelane's downloads
  // and uploads included. It keeps moving when nothing is downloading. The Downloads view shows download speed alone.
  const sysOf = (l) => (l.state === 'up' && l.enabled ? l.speed + (l.up || 0) + (l.bg ? l.bg.rx + l.bg.tx : 0) : 0);
  const sysLanes = links.map((l) => ({ id: l.id, name: l.name, kind: l.kind, speed: sysOf(l), down: l.state === 'down', on: sysOf(l) > 0, limited: false, note: l.planOff ? 'Not in plan' : null }));
  const dlNow = links.reduce((a, l) => a + l.speed, 0);
  return (
    <div className="flex min-h-0 flex-1 flex-col">
      <Toolbar title="Dashboard" subtitle="Every download and network at a glance" />
      <div className="ml-scroll min-h-0 flex-1 @container md:overflow-y-auto">
        <div className="flex flex-col gap-8 px-4 pt-5 pb-8">
          <Confluence lanes={sysLanes} unit={unit} handover={useApp.getState().handover} label="Total speed, all apps" caption={running.length ? `Includes ${fmtSpeedText(dlNow, unit)} of downloads` : 'No downloads running. This is other apps.'} />
          <section aria-labelledby="dash-minute" className="flex flex-col gap-3">
            <SectionTitle id="dash-minute">Last minute</SectionTitle>
            <ThroughputChart links={links} unit={unit} />
          </section>
          <div className="grid gap-8 @3xl:grid-cols-2">
            <section aria-labelledby="dash-today" className="flex flex-col gap-3">
              <SectionTitle id="dash-today">Today</SectionTitle>
              <p className="flex items-baseline gap-2"><span className="figures text-[34px] leading-none font-[700] tracking-[-0.02em]">{fmtBytes(todayTotal)}</span><span className="text-[13px] text-ink-2">downloaded</span></p>
              <div className="flex h-2 w-full gap-[2px] overflow-hidden rounded-full bg-track" aria-hidden>
                {links.map((l) => <span key={l.id} className="h-full first:rounded-l-full last:rounded-r-full" style={{ width: `${(today[l.id] / todayTotal) * 100}%`, background: `var(--color-${l.kind})` }} />)}
              </div>
              <ul className="flex flex-col">
                {links.map((l) => (
                  <li key={l.id} className="flex items-center gap-2.5 border-b border-rule py-1.5 text-[13px] last:border-b-0">
                    <Swatch kind={l.kind} />
                    <span className="flex-1 font-[560]">{l.name}</span>
                    <span className="figures text-[14px] font-[600]">{fmtBytes(today[l.id])}</span>
                    <span className="figures w-10 text-right text-[13px] text-ink-3">{Math.round((today[l.id] / todayTotal) * 100)}%</span>
                  </li>
                ))}
              </ul>
              <dl className="grid grid-cols-2 gap-4 pt-1">
                <Stat label="Fastest merged speed">{fmtSpeedText(peak, unit)}</Stat>
                <Stat label="Network dropouts">{`${recent.length}${recent.every((e) => e.backAt) ? ', all back' : ''}`}</Stat>
              </dl>
            </section>
            <section aria-labelledby="dash-active" className="flex flex-col gap-2">
              <SectionTitle id="dash-active" aside={<span className="text-[12px] text-ink-3">{active.length} in progress</span>}>Downloading</SectionTitle>
              {active.length === 0 ? (
                <div className="flex flex-col items-start gap-2 py-2">
                  <p className="text-[13px] leading-[1.6] text-ink-2">Nothing downloading. Each download shows here with its speed on every network.</p>
                  <Button variant="primary" size="sm" onClick={(e) => openSheet(e.currentTarget)}><Plus />New download</Button>
                </div>
              ) : (
                <ul className="flex flex-col gap-0.5">
                  {active.map((d) => (
                    <li key={d.id} className="relative flex flex-col gap-1.5 rounded-[10px] px-2 py-2 transition-colors duration-100 hover:bg-hover active:bg-selected">
                      <div className="flex items-center gap-3">
                        <button type="button" onClick={() => { useApp.setState({ screen: 'downloads' }); select(d.id); }} className="min-w-0 truncate text-left text-[13px] font-[580] outline-none after:absolute after:inset-0 after:rounded-[10px] focus-visible:after:outline-2 focus-visible:after:-outline-offset-2 focus-visible:after:outline-ring">{d.name}</button>
                        <span className="ml-auto shrink-0 text-[12.5px] text-ink-2">
                          {d.status === 'downloading' ? <Speed bps={speedOf(d)} unit={unit} className="text-[14px] font-[620] text-foreground" /> : d.status === 'paused' ? 'Paused' : 'Waiting'}

function Sparkline({ values, kind, color, label, height = 30 }) {
  const Wd = 160, Ht = height, n = values.length;
  const top = Math.max(...values, 1);
  const stroke = color || `var(--color-${kind})`;
  const p = values.map((v, i) => `${((i / (n - 1)) * Wd).toFixed(1)},${(Ht - 1 - (v / top) * (Ht - 3)).toFixed(1)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${Wd} ${Ht}`} preserveAspectRatio="none" className="block w-full" style={{ height: Ht }} role="img" aria-label={label}>
      <line className="ml-grid" x1={0} x2={Wd} y1={Ht - 0.5} y2={Ht - 0.5} stroke="var(--border)" strokeWidth={1} vectorEffect="non-scaling-stroke" />
      <polygon points={`0,${Ht} ${p} ${Wd},${Ht}`} fill={stroke} fillOpacity={color ? 0.08 : 0.16} style={kind && !color ? { fill: `var(--spark-${kind}, ${stroke})`, fillOpacity: 'var(--spark-a, 0.16)' } : { fill: `var(--spark-ink, ${stroke})`, fillOpacity: 'var(--spark-a, 0.08)' }} />
      <polyline className="ml-spark-line" points={p} fill="none" stroke={stroke} strokeWidth={2} strokeLinejoin="round" vectorEffect="non-scaling-stroke" style={color ? { stroke: `var(--spark-ink-line, ${stroke})` } : undefined} />
    </svg>
  );
}

const fmtMem = (b) => (b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : `${Math.round(b / 1e6)} MB`);
const fmtCpu = (c) => `${c < 10 ? c.toFixed(1) : Math.round(c)}%`;

/* A speed limit you can switch on or off without losing the number. Typed in the units chosen in Settings. */
function LimitField({ target, dir, entry, unit, label }) {
  const setEntry = useApp((s) => s.setLimitEntry);
  const div = UNIT_DIV[unit];
  const shown = String(+(entry.bps / div).toFixed(unit === 'kb' ? 0 : 2));
  const [text, setText] = useState(shown);
  const [bad, setBad] = useState(false);
  useEffect(() => { setText(shown); setBad(false); }, [shown]);
  const commit = () => {
    const v = parseFloat(text.replace(',', '.').replace(/[^\d.]/g, ''));
    if (!isFinite(v) || v <= 0) { setBad(true); return; }
    const bps = Math.max(10e3, v * div);
    setBad(false);
    setEntry(target, dir, { bps, on: true });
    setText(String(+(bps / div).toFixed(unit === 'kb' ? 0 : 2)));
  };
  const switchId = useId();
  const word = dir === 'down' ? 'Download' : 'Upload';
  return (
    <div className="flex items-center gap-2">
      <label htmlFor={switchId} className="sr-only">{label}: {word.toLowerCase()} limit on</label>
      <Switch id={switchId} checked={entry.on} onCheckedChange={(v) => setEntry(target, dir, { on: v })} />
      <span className={cn('flex h-8 items-center gap-1.5 rounded-full bg-[var(--input-bg)] pr-3 pl-3 shadow-[inset_0_0_0_1px_var(--control)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-ring', !entry.on && 'opacity-50', bad && 'shadow-[inset_0_0_0_1.5px_var(--color-danger)]')}>
        {dir === 'down' ? <ArrowDown className="size-3.5 text-ink-3" /> : <ArrowUp className="size-3.5 text-ink-3" />}
        <input
          type="text"
          inputMode="decimal"
          value={text}
          aria-label={`${label}: ${word.toLowerCase()} limit in ${UNIT_LABEL[unit]}`}
          aria-invalid={bad || undefined}
          onChange={(e) => setText(e.target.value)}
          onBlur={commit}
          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') { setText(shown); setBad(false); } }}
          className="figures w-[4.5rem] bg-transparent text-right text-[14px] font-[600] outline-none"
        />
        <span className="text-[12px] font-[540] text-ink-3">{UNIT_LABEL[unit]}</span>
      </span>
    </div>
  );
}

let returnFocusTo = null;
function openSheet(trigger) { returnFocusTo = trigger || document.activeElement; useApp.setState({ sheetOpen: true }); }
function closeSheet() { useApp.setState({ sheetOpen: false }); }

const EXAMPLES = [
  { label: 'Video', icon: Film, url: 'https://www.youtube.com/watch?v=example' },
  { label: 'File', icon: FileArchive, url: 'https://cdn.example.org/assets/texture-pack-8k.zip' },
  { label: 'Torrent', icon: Magnet, url: 'magnet:?xt=urn:btih:example&dn=open-film-pack' },
  { label: 'One you have', icon: Copy, url: 'https://mirror.example.net/tdf/26.2/LibreOffice_26.2_MacOS_aarch64.dmg' },
];
const QUALITIES = [
  { id: '2160p', size: 3.8e9 },
  { id: '1440p', size: 2.2e9 },
  { id: '1080p60', size: 1.42e9 },
  { id: '720p', size: 0.61e9 },
  { id: 'Audio only', size: 0.088e9 },
];
function detect(raw) {
  const u = raw.trim();
  if (!u) return null;
  if (/open-film-pack/i.test(u)) return { kind: 'torrent', name: 'open-film-pack', size: FILM_PACK.reduce((a, f) => a + f.size, 0), note: `${FILM_PACK.length} files, 63 peers found`, glyph: 'Magnet', files: FILM_PACK };
  if (/^magnet:/i.test(u) || /\.torrent$/i.test(u)) return { kind: 'torrent', name: 'debian-13.2.0-arm64-netinst.iso', size: 0.68e9, note: '41 peers found', glyph: 'Magnet' };
  if (/youtube\.com|youtu\.be|\.m3u8|\.mpd/i.test(u)) return { kind: 'video', name: 'Rebuilding a 1970s tape deck', source: /\.m3u8|\.mpd/i.test(u) ? 'HLS' : 'YouTube', note: '38 min video', glyph: 'Film' };
  if (/^https?:\/\/[^\s/]+\.[^\s/]+/i.test(u)) {
    const file = decodeURIComponent(u.split(/[?#]/)[0].split('/').filter(Boolean).pop() || 'download');
    const known = historyOf(useApp.getState()).find((h) => h.name === file);
    return { kind: 'http', name: file, host: u.split('/')[2], size: known ? known.size : 2.4e9, note: 'The server allows split downloads', glyph: known ? known.glyph : /\.zip$/i.test(file) ? 'FileArchive' : 'Package' };
  }
  return { kind: 'invalid' };
}

  const ent = useEnt();
  const plans = useApp((s) => s.plans);
  const routeLock = useApp((s) => (s.routing.down !== 'all' && canDo(s, 'net.routing') ? (s.links.find((l) => l.id === s.routing.down) || {}).name : null));
  const reduced = useReducedMotion();
  const [phase, setPhase] = useState('closed');
  const panelRef = useRef(null);
  const inputRef = useRef(null);
  const [url, setUrl] = useState('');
  const [quality, setQuality] = useState('2160p');
  const [chosen, setChosen] = useState(['en0', 'en7', 'en5']);
  const [streams, setStreams] = useState('auto');
  const [when, setWhen] = useState('now');
  const [time, setTime] = useState('01:00');
  const [folder, setFolder] = useState('~/Downloads');
  const [files, setFiles] = useState(null);
  useEffect(() => { const f = detect(url); setFiles(f && f.files ? f.files.map((x) => ({ ...x, on: !/\.txt$/i.test(x.path) })) : null); }, [url]);

  useEffect(() => {
    if (open) {
      const { prefs } = useApp.getState();
      setUrl(''); setQuality('2160p'); setWhen('now'); setStreams(prefs.defaultStreams); setFolder(prefs.folder);
      setPhase('enter');
      const r = requestAnimationFrame(() => requestAnimationFrame(() => setPhase('open')));
      return () => cancelAnimationFrame(r);
    }
    if (phase === 'closed') return undefined;
    setPhase('leave');
    const t = setTimeout(() => {
      setPhase('closed');
      if (returnFocusTo && document.contains(returnFocusTo)) returnFocusTo.focus();
    }, reduced ? 140 : 220);
    return () => clearTimeout(t);
  }, [open]);
  useEffect(() => { if (phase === 'open') inputRef.current?.focus(); }, [phase]);

  if (phase === 'closed') return null;
  const shown = phase === 'open';
  const found = detect(url);

  const size = found?.kind === 'video' ? QUALITIES.find((q) => q.id === quality).size : files ? pickedSize(files) : found?.size;
  const dup = valid ? findDuplicate(useApp.getState(), found, url) : null;
  const kindLock = found && ((found.kind === 'torrent' && !ent.f['downloads.torrent']) ? 'downloads.torrent' : (found.kind === 'video' && !ent.f['downloads.video']) ? 'downloads.video' : null);
  const videoCap = ent.q['downloads.video_per_day'];

  const canSubmit = valid && chosen.length > 0 && !kindLock && !videoOver && (!files || files.some((f) => f.on));
  const connCap = ent.q['conn.max_per_link'] ?? Infinity;

  const action = when === 'now' ? (dup ? 'Download again' : 'Download') : when === 'queue' ? 'Add to queue' : `Start at ${time}`;

  const submit = (e) => {
    e.preventDefault();
    if (!canSubmit) return;
    const id = `n${Date.now()}`;
    const per = Math.min(streams === 'auto' ? 2 : Number(streams), connCap);
    if (found.kind === 'video') useApp.setState((st) => ({ meter: { ...st.meter, videosToday: st.meter.videosToday + 1 } }));
    addDownload({
      id, kind: found.kind, name: found.kind === 'video' ? `${found.name}.mp4` : found.name, host: found.host, source: found.kind === 'torrent' ? 'Torrent' : found.source,
      quality: found.kind === 'video' ? quality : undefined, glyph: found.glyph, size, chunk: found.kind === 'torrent' ? 8e6 : found.kind === 'video' ? 6e6 : 32e6,
      uses: chosen, streams: Object.fromEntries(chosen.map((c) => [c, found.kind === 'torrent' ? 9 : per])), peers: found.kind === 'torrent' ? 41 : undefined, url: url.trim(), files: files || undefined,
      addedAt: Date.now(), bytesByLink: {}, speedByLink: {}, status: when === 'now' ? 'downloading' : 'queued', startAt: when === 'later' ? time : null, weight: 0.8, peak: 0,
    });
  };
  const onKeyDown = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key !== 'Tab') return;
    const f = [...panelRef.current.querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex="0"]')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  };

  const name = (id) => (links.find((l) => l.id === id) || {}).name;
  const hint = [
    !limits.on ? 'Limits are off.' : set.length ? `Limits: ${set.join(', ')}.` : 'No limits set.',

  const open = () => {

    <SettingRow label="Speed limits and routing, per network" hint={hint}>

/* Browser extensions */
function BrowserRow({ b }) {
  const st = useApp((s) => s.ext.browsers[b.id]);
  const installExt = useApp((s) => s.installExt);
  const updateExt = useApp((s) => s.updateExt);
  const uninstallExt = useApp((s) => s.uninstallExt);
  const patchBrowser = useApp((s) => s.patchBrowser);
  const [confirming, setConfirming] = useState(false);
  const id = useId();
  const Icon = b.icon;
  const ent = useEnt();
  const plans = useApp((s) => s.plans);
  const browsersAll = useApp((s) => s.ext.browsers);
  const cap = ent.q['ext.max_browsers'] ?? Infinity;
  const activeIds = BROWSERS.filter((x) => browsersAll[x.id].installed && browsersAll[x.id].enabled).map((x) => x.id);
  const overCap = st.installed && st.enabled && activeIds.indexOf(b.id) >= cap;
  const atCap = activeIds.length >= cap && !(st.installed && st.enabled);
  const capPlan = planForQuota(plans, 'ext.max_browsers', activeIds.length + 1);
  const needMore = () => askUpgrade({ quota: 'ext.max_browsers', need: activeIds.length + 1 });
  let status;
  const win = useApp.getState().os === 'windows';
  if (b.unsupported) status = win ? 'Not supported yet. Chrome-based browsers are.' : 'Not supported yet. Chrome-based browsers and Safari are.';
  else if (!st.found) status = `Not on this ${win ? 'PC' : 'Mac'}. Install it, then scan again.`;
  else if (st.busy === 'installing') status = b.id === 'safari' ? 'Turning it on in Safari Settings › Extensions…' : `Confirm “Add extension” in ${b.short}…`;
  else if (st.busy === 'updating') status = `Updating to ${st.update}…`;
  else if (st.busy === 'removing') status = `Removing from ${b.short}…`;
  else if (!st.installed) status = b.id === 'safari' ? 'Not turned on. It comes inside Mergelane.' : 'Not installed';
  else if (st.update) status = `Version ${st.version}. Version ${st.update} is ready.`;
  else if (overCap) status = `Version ${st.version}. Paused: ${ent.plan.name} includes ${cap} browser${cap === 1 ? '' : 's'}.`;
  else status = st.enabled ? `Version ${st.version}, sending downloads to Mergelane` : `Version ${st.version}, turned off`;
  const dim = b.unsupported || !st.found;
  return (
    <li className="flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-rule py-3 last:border-b-0">
      <span aria-hidden className={cn('inline-flex size-9 shrink-0 items-center justify-center rounded-[10px] bg-sunken text-ink-2 shadow-[inset_0_0_0_1px_var(--border)]', dim && 'opacity-55')}><Icon className="size-[18px]" strokeWidth={1.75} /></span>
      <div className="flex min-w-0 flex-1 basis-48 flex-col gap-0.5">
        <p className="flex flex-wrap items-center gap-2 text-[13.5px] font-[620]">
          {b.name}
          {st.installed && st.update && !st.busy && <span className="rounded-full bg-[var(--color-accent-soft)] px-2 py-px text-[11px] font-[620] text-[var(--color-accent-ink)]">Update</span>}
        </p>
        <p className={cn('flex items-center gap-1.5 text-[12.5px] leading-snug', dim ? 'text-ink-3' : 'text-ink-2')} role="status">{st.busy && <Spinner className="size-3 shrink-0" />}{status}</p>
      </div>
      {!dim && !st.busy && (
        <div className="flex flex-wrap items-center gap-2">
          {!st.installed ? (
            atCap
              ? <Button size="sm" onClick={needMore}><Lock />{capPlan ? `${b.id === 'safari' ? 'Turn on' : 'Install'} with ${capPlan.name}` : 'At your limit'}</Button>
              : <Button variant="primary" size="sm" onClick={() => installExt(b.id)}><Download />{b.id === 'safari' ? 'Turn on' : 'Install'}</Button>
          ) : confirming ? (
            <div role="group" aria-label={`Confirm removing from ${b.short}`} className="flex flex-wrap items-center gap-2">
              <span className="text-[12.5px] text-ink-2">Remove from {b.short}?</span>
              <Button variant="destructive" size="sm" onClick={() => { setConfirming(false); uninstallExt(b.id); }}>Uninstall</Button>
              <Button variant="ghost" size="sm" onClick={() => setConfirming(false)}>Keep</Button>
            </div>
          ) : (
            <>
              {st.update && <Button size="sm" onClick={() => updateExt(b.id)}><RefreshCw />Update</Button>}
              <Button variant="ghost" size="icon-sm" aria-label={`Uninstall from ${b.short}`} title="Uninstall" onClick={() => setConfirming(true)}><Trash2 /></Button>
              <label htmlFor={id} className="sr-only">Use the extension in {b.short}</label>
              <Switch id={id} checked={st.enabled && !overCap} onCheckedChange={(v) => (v && atCap ? needMore() : patchBrowser(b.id, { enabled: v }))} />
            </>
          )}
        </div>
      )}
    </li>
  );
}

function ExtensionSettings() {

  return (
    <>
      <SettingsGroup
        title={`Browsers on this ${win ? 'PC' : 'Mac'}`}

          <Button size="sm" disabled={ext.scanning} onClick={scanBrowsers}>
            {ext.scanning ? <><Spinner />Looking…</> : <><Search />Scan again</>}
          </Button>
        }

        <ul aria-label={`Browsers on this ${win ? 'PC' : 'Mac'}`} className="flex flex-col">

        <SettingRow label="Only files larger than" hint="Smaller files stay with the browser." muted={off}>
          <Segmented label="Only files larger than" value={ext.minSize} onChange={(v) => !off && setExt({ minSize: v })} options={[{ value: 'any', label: 'Any size' }, { value: '1mb', label: '1 MB' }, { value: '10mb', label: '10 MB' }, { value: '100mb', label: '100 MB' }]} />
        </SettingRow>
        <SettingRow label="File types" hint="Mergelane takes only the types you pick." stack muted={off}>
          <div role="group" aria-label="File types" className="flex flex-wrap gap-1.5">

                >

/* Updates */
function UpdateSettings() {
  useEnt();
  const u = useApp((s) => s.update);
  const now = useApp((s) => s.now);
  const a = useApp.getState();
  const r = u.latest;
  const busy = ['checking', 'downloading', 'verifying', 'restarting'].includes(u.status);
  const pct = Math.round(u.progress * 100);
  let title, body, actions = null, tone = 'plain';
  switch (u.status) {
    case 'checking':
      title = 'Checking for updates…'; body = 'Asking GitHub for the newest release.'; break;
    case 'available':
      tone = 'accent';
      title = `Mergelane ${r.version} is available`;
      body = `You have ${u.version}. Released ${r.date}, ${fmtBytes(r.size)}.`;
      actions = (<><Button variant="primary" size="sm" onClick={a.installUpdate}><Download />Download and install</Button><Button variant="ghost" size="sm" onClick={a.skipUpdate}>Skip this version</Button></>);
      break;
    case 'downloading':
      tone = 'accent';
      title = `Downloading ${r.version}…`; body = `${fmtBytes(r.size * u.progress)} of ${fmtBytes(r.size)}`;
      actions = <Button variant="ghost" size="sm" onClick={a.cancelUpdate}>Cancel</Button>;
      break;
    case 'verifying':
      tone = 'accent';
      title = 'Checking the download…'; body = 'Comparing it with the SHA-256 published with the release.'; break;
    case 'ready':
      tone = 'accent';
      title = `${r.version} is ready to install`;
      body = 'Mergelane restarts to finish. Running downloads pause and pick up where they left off.';
      actions = <Button variant="primary" size="sm" onClick={a.restartToUpdate}><RotateCw />Restart and update</Button>;
      break;
    case 'restarting':
      title = 'Restarting…'; body = `Installing ${r.version}.`; break;
    case 'current':
      title = 'Mergelane is up to date'; body = u.note || `${u.version} is the newest ${u.channel} version.`; break;
    default:
      title = `Last checked ${fmtAgo(now - u.lastChecked)}`; body = u.note || 'Mergelane checks once a day while it runs.';
  }
  const canCheck = !busy && !['available', 'ready'].includes(u.status);
  return (
    <>
      <section aria-labelledby="upd-title" className="flex flex-col gap-4 rounded-[14px] bg-card p-4 shadow-[inset_0_0_0_1px_var(--border)]">
        <div className="flex flex-wrap items-center gap-x-4 gap-y-3">
          <AppIcon size={56} className="-m-1" />
          <div className="flex min-w-0 flex-1 basis-48 flex-col">
            <Wordmark className="text-[18px]" />
            <p className="text-[12.5px] text-ink-2">Version <span className="figures text-[13.5px] font-[620] text-foreground">{u.version}</span> <span className="text-ink-3">({u.build})</span>, {u.channel === 'beta' ? 'beta' : 'stable'} channel</p>
          </div>
          <Button size="sm" disabled={!canCheck} onClick={a.checkForUpdates}>
            {u.status === 'checking' ? <><Spinner />Checking…</> : <><RefreshCw />Check for updates</>}
          </Button>
        </div>
        <div role="status" aria-live="polite" className={cn('flex flex-col gap-2.5 rounded-[11px] p-3', tone === 'accent' ? 'bg-[var(--color-accent-soft)] shadow-[inset_0_0_0_1px_color-mix(in_oklab,var(--color-accent)_30%,transparent)]' : 'bg-sunken shadow-[inset_0_0_0_1px_var(--border-subtle)]')}>
          <div className="flex items-start gap-2.5">
            {u.status === 'current' ? <CircleCheck className="mt-0.5 size-4 shrink-0 text-ink-2" /> : busy ? <Spinner className="mt-0.5 size-4 shrink-0 text-ink-2" /> : tone === 'accent' ? <Sparkles className="mt-0.5 size-4 shrink-0 text-[var(--color-accent-ink)]" /> : <Clock className="mt-0.5 size-4 shrink-0 text-ink-2" />}
            <div className="flex min-w-0 flex-col gap-0.5">
              <p id="upd-title" className="text-[13.5px] font-[640]">{title}</p>
              <p className="text-[12.5px] leading-[1.5] text-ink-2">{body}</p>
            </div>
          </div>
          {u.status === 'downloading' && (
            <div role="progressbar" aria-label={`Downloading ${r.version}`} aria-valuemin={0} aria-valuemax={100} aria-valuenow={pct} className="h-1.5 w-full overflow-hidden rounded-full bg-track">
              <span className="block h-full rounded-full bg-primary motion-safe:transition-[width] motion-safe:duration-150" style={{ width: `${pct}%` }} />
            </div>
          )}
          {r && ['available', 'downloading', 'verifying', 'ready'].includes(u.status) && (
            <div className="flex flex-col gap-1 border-t border-rule pt-2.5">
              <p className="text-[12.5px] font-[620]">What’s new in {r.version}</p>
              <ul className="flex flex-col gap-1">
                {r.notes.map((n) => <li key={n} className="flex gap-2 text-[12.5px] leading-[1.5] text-ink-2"><span aria-hidden className="mt-[0.55em] size-1 shrink-0 rounded-full bg-[var(--text-tertiary)]" />{n}</li>)}
              </ul>
            </div>
          )}
          {actions && <div className="flex flex-wrap items-center gap-2">{actions}</div>}
        </div>
      </section>

      <SettingsGroup title="Automatic updates">
        <PrefSwitch label="Check for updates automatically" hint="Once a day. Mergelane tells you in the sidebar when one is out." checked={u.auto} onChange={(v) => a.setUpdate({ auto: v })} />
        <PrefSwitch label="Download updates in the background" hint="Only the download happens by itself. Installing always waits for you." checked={u.background} disabled={!u.auto} onChange={(v) => a.setUpdate({ background: v })} />
        <SettingRow label="Channel" hint={u.channel === 'beta' ? 'Beta versions arrive a few weeks early and may have rough edges.' : 'Tested releases only.'}>
          <Segmented label="Update channel" value={u.channel} onChange={a.setChannel} options={[{ value: 'stable', label: 'Stable' }, entOf(a).f['updates.beta'] ? { value: 'beta', label: 'Beta' } : { value: 'beta', label: 'Beta', locked: (planForFeature(a.plans, 'updates.beta') || {}).name || 'another plan', onLocked: () => askUpgrade({ feature: 'updates.beta' }) }]} />
        </SettingRow>
      </SettingsGroup>

      <aside className="flex gap-3 rounded-[14px] bg-sunken p-4 shadow-[inset_0_0_0_1px_var(--border-subtle)]">
        <ShieldCheck className="mt-0.5 size-4 shrink-0 text-ink-2" />
        <p className="max-w-[64ch] text-[12.5px] leading-[1.6] text-ink-2">Updates come from Mergelane’s GitHub releases, and each one is checked against its published SHA-256 before it’s installed. {useApp.getState().os === 'windows' ? 'Mergelane isn’t code-signed on Windows yet, so SmartScreen may warn the first time an update runs. Choose More info, then Run anyway.' : 'Mergelane isn’t signed by Apple yet, so the first time it opens after an update macOS may ask you to confirm in System Settings › Privacy & Security.'}</p>
      </aside>
    </>
  );
}

        {side ? (
          <nav aria-label="Settings sections" className="flex w-[200px] shrink-0 flex-col gap-0.5 border-r border-rule p-2">

          <div className="overflow-x-auto border-b border-rule px-3 py-2 [scrollbar-width:none]">

        <div className="ml-scroll min-h-0 min-w-0 flex-1 @container md:overflow-y-auto">
          <div className="flex max-w-[780px] flex-col gap-7 px-4 pt-5 pb-10 sm:px-5">

  const section = useApp((s) => s.settingsSection);

/* ── Plans in the app: entitlement hook, locks, the upgrade dialog, the toast ───────────────────── */
function useEnt() {
  const licenses = useApp((s) => s.licenses);
  const plans = useApp((s) => s.plans);
  const myLicenseId = useApp((s) => s.myLicenseId);
  const trial = useApp((s) => s.trial);
  return useMemo(() => entOf({ licenses, plans, myLicenseId, trial }), [licenses, plans, myLicenseId, trial]);
}
const askUpgrade = (opts) => useApp.setState({ upsell: opts });
const fmtDate = (t) => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

function PlanBadge({ plan, className }) {
  if (!plan) return null;
  return (
    <span className={cn('inline-flex h-5 shrink-0 items-center gap-1 rounded-full bg-[var(--color-accent-soft)] px-2 text-[11px] font-[640] whitespace-nowrap text-[var(--color-accent-ink)]', className)}>
      <Lock className="size-3" aria-hidden />{plan.name}
    </span>
  );
}

/* A banner over a locked panel: what is locked, which plan unlocks it, and the way there. */
function PlanLock({ feature, quota, need, title, body }) {
  const plans = useApp((s) => s.plans);
  const p = feature ? planForFeature(plans, feature) : planForQuota(plans, quota, need);
  const name = feature ? FEATURE_BY_KEY[feature].label : QUOTA_BY_KEY[quota].label;
  return (
    <div role="note" className="flex flex-wrap items-center gap-x-3 gap-y-2 rounded-[12px] bg-[var(--color-accent-soft)] p-3 shadow-[inset_0_0_0_1px_color-mix(in_oklab,var(--color-accent)_28%,transparent)]">
      <LockKeyhole className="size-4 shrink-0 text-[var(--color-accent-ink)]" aria-hidden />
      <div className="flex min-w-0 flex-1 basis-56 flex-col gap-0.5">
        <p className="text-[13px] font-[640]">{title || (p ? `${name} ${/s$/.test(name) ? 'are' : 'is'} in ${p.name}` : `${name} isn’t in any plan on sale`)}</p>
        {body && <p className="text-[12.5px] leading-[1.5] text-ink-2">{body}</p>}
      </div>
      <Button variant="primary" size="sm" onClick={() => askUpgrade({ feature, quota, need })}>{p ? `Upgrade to ${p.name}` : 'See plans'}</Button>
    </div>
  );
}

function UpsellDialog() {
  const upsell = useApp((s) => s.upsell);
  const plans = useApp((s) => s.plans);
  const trial = useApp((s) => s.trial);
  const buyPlan = useApp((s) => s.buyPlan);
  const startTrial = useApp((s) => s.startTrial);
  const openSettings = useApp((s) => s.openSettings);
  const ent = useEnt();
  const panelRef = useRef(null);
  useEffect(() => { if (upsell && panelRef.current) panelRef.current.querySelector('button.ml-btn-primary, button')?.focus(); }, [upsell]);
  if (!upsell) return null;
  const close = () => useApp.setState({ upsell: null });
  const { feature, quota, need } = upsell;
  const min = feature ? planForFeature(plans, feature) : planForQuota(plans, quota, need);
  const what = feature ? FEATURE_BY_KEY[feature].label : quota === 'merge.max_links' ? `Merging ${need} networks` : quota === 'queue.max_active' ? `${need} downloads at once` : quota === 'conn.max_per_link' ? `${need} connections per network` : quota === 'ext.max_browsers' ? `The extension in ${need} browsers` : QUOTA_BY_KEY[quota].label;
  const startAt = min ? PLAN_ORDER.indexOf(min.id) : 1;
  const offer = PLAN_ORDER.slice(startAt).map((id) => planById(plans, id)).filter((p) => p.visibility === 'public' && (p.id !== 'team' || min?.id === 'team') && PLAN_ORDER.indexOf(p.id) > PLAN_ORDER.indexOf(ent.planId));
  const trialOk = !trial.used && ent.planId !== 'pro' && ent.planId !== 'team' && offer.some((p) => p.id === 'pro');
  const adds = (p) => {
    const v = latestVersion(p);
    const f = FEATURE_DEFS.filter((d) => v.features[d.key] && !ent.f[d.key]).map((d) => d.label);
    const q = QUOTA_DEFS.filter((d) => (v.quotas[d.key] ?? Infinity) > (ent.q[d.key] ?? Infinity) && d.key !== 'downloads.video_per_day').map((d) => `${d.label}: ${fmtQuota(d.key, v.quotas[d.key])}`);
    return [...q, ...f].slice(0, 5);
  };
  return (
    <div className="absolute inset-0 z-40" onKeyDown={(e) => { if (e.key === 'Escape') { e.preventDefault(); close(); } }}>
      <div aria-hidden onClick={close} className="absolute inset-0 bg-[var(--scrim)]" />
      <div ref={panelRef} role="dialog" aria-modal="true" aria-labelledby="upsell-title" data-shown="true" className="ml-sheet absolute top-[64px] left-1/2 flex max-h-[calc(100%-80px)] w-[min(640px,calc(100%-32px))] -translate-x-1/2 flex-col overflow-hidden rounded-[16px] bg-popover shadow-[var(--shadow-sheet)] @container">
        <div className="flex items-start gap-3 border-b border-rule px-5 py-4">
          <span aria-hidden className="mt-0.5 grid size-9 shrink-0 place-items-center rounded-[10px] bg-[var(--color-accent-soft)] text-[var(--color-accent-ink)]"><LockKeyhole className="size-[18px]" /></span>
          <div className="flex min-w-0 flex-1 flex-col gap-0.5">
            <h2 id="upsell-title" className="text-[16px] font-[680] tracking-[-0.01em]">{min ? `${what} ${/s$/.test(what) && feature ? 'are' : 'is'} in ${min.name}` : `${what} isn’t available`}</h2>
            <p className="text-[12.5px] leading-[1.5] text-ink-2">You’re on {ent.plan.name}{ent.source === 'trial' ? ' (trial)' : ''}. Upgrading unlocks it straight away on this Mac; nothing you’ve set up is lost.</p>
          </div>
          <Button variant="ghost" size="icon-sm" aria-label="Close" onClick={close}><X /></Button>
        </div>
        <div className="flex min-h-0 flex-col gap-3 overflow-y-auto px-5 py-4">
          <div className={cn('grid gap-3', offer.length > 1 && '@md:grid-cols-2')}>
            {offer.map((p, i) => (
              <div key={p.id} className={cn('flex flex-col gap-3 rounded-[14px] bg-card p-4', i === 0 ? 'shadow-[inset_0_0_0_2px_var(--color-accent)]' : 'shadow-[inset_0_0_0_1px_var(--border)]')}>
                <div className="flex items-baseline gap-2">
                  <span className="text-[15px] font-[680]">{p.name}</span>
                  {i === 0 && <span className="rounded-full bg-[var(--color-accent-soft)] px-2 py-px text-[11px] font-[640] text-[var(--color-accent-ink)]">Unlocks this</span>}
                  <span className="figures ml-auto text-[13.5px] font-[640]">{fmtPrice(p, 'y')}</span>
                </div>
                <ul className="flex flex-col gap-1.5">
                  {adds(p).map((a) => <li key={a} className="flex gap-2 text-[12.5px] leading-snug text-ink-2"><Check className="mt-px size-3.5 shrink-0 text-[var(--color-accent-ink)]" aria-hidden />{a}</li>)}
                </ul>
                <Button variant={i === 0 ? 'primary' : 'secondary'} size="sm" className="mt-auto self-start" onClick={() => { close(); buyPlan(p.id); }}>Choose {p.name}</Button>
              </div>
            ))}
          </div>
          {offer.length === 0 && <p className="text-[13px] text-ink-2">No plan on sale includes this yet.</p>}
        </div>
        <div className="ml-sheet-footer flex flex-wrap items-center gap-2 border-t border-rule bg-popover px-5 py-3">
          <Button variant="ghost" size="sm" onClick={() => { close(); openSettings('plan'); }}>Compare all plans</Button>
          <span className="flex-1" />
          {trialOk && <Button size="sm" onClick={() => { close(); startTrial(); }}><Sparkles />Try Pro free for 14 days</Button>}
          <Button variant="ghost" size="sm" onClick={close}>Not now</Button>
        </div>
      </div>
    </div>
  );
}

function Toast() {
  const toast = useApp((s) => s.toast);
  useEffect(() => {
    if (!toast) return undefined;
    const t = setTimeout(() => useApp.setState((s) => (s.toast === toast ? { toast: null } : null)), 3800);
    return () => clearTimeout(t);
  }, [toast]);
  return (
    <div aria-live="polite" className="pointer-events-none absolute inset-x-0 bottom-4 z-50 flex justify-center px-4">
      {toast && (

/* The sidebar's plan line: the plan, and the month's merged data where the plan caps it. */
function SidebarPlan() {
  const ent = useEnt();
  const meter = useApp((s) => s.meter);
  const openSettings = useApp((s) => s.openSettings);

  const win = useWin();

    <button type="button" onClick={() => openSettings('plan')} className={cn('flex flex-col gap-1.5 py-1.5 text-left', win ? 'rounded-[4px] px-3' : 'rounded-[10px] px-2', 'transition-colors duration-100 hover:bg-hover focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ring')}>
      <span className="flex items-center gap-2 text-[12.5px] font-[620]">

          <span className="text-[11.5px] leading-tight text-ink-3"><span className="figures">{used.toFixed(1)}</span> of {gb} GB merged this month{pct >= 1 ? ', one network until the 1st' : ''}</span>

/* ── Settings › Plan & license ── */
function Meter({ label, used, limit, fmt, note }) {
  const unlimited = !isFinite(limit);
  const pct = unlimited ? 0 : Math.min(1, used / Math.max(limit, 1e-9));
  const tone = used > limit ? 'var(--color-danger)' : pct >= 0.85 ? 'var(--color-warning)' : 'var(--color-accent)';
  return (
    <div className="flex flex-col gap-1.5 border-b border-rule py-3 last:border-b-0">
      <div className="flex flex-wrap items-baseline gap-x-3">
        <span className="flex-1 text-[13.5px] font-[600]">{label}</span>
        <span className="figures text-[13px] text-ink-2"><span className="font-[640] text-foreground">{fmt(used)}</span>{unlimited ? ', unlimited' : ` of ${fmt(limit)}`}</span>
      </div>
      {!unlimited && (
        <div role="meter" aria-label={label} aria-valuemin={0} aria-valuemax={limit} aria-valuenow={Math.min(used, limit)} className="h-1.5 overflow-hidden rounded-full bg-track">
          <span className="block h-full rounded-full transition-[width] duration-300" style={{ width: `${pct * 100}%`, background: tone }} />
        </div>
      )}
      {note && <p className="text-[12px] leading-snug text-ink-2">{note}</p>}
    </div>
  );
}

      <PlanCompare />

/* ── The owner portal ────────────────────────────────────────────────────────────────────── */
const PORTAL_NAV = [
  { id: 'overview', label: 'Overview', icon: ChartColumn },
  { id: 'plans', label: 'Plans', icon: Crown },
  { id: 'licenses', label: 'Licenses', icon: KeyRound },
  { id: 'audit', label: 'Audit log', icon: ScrollText },
];
const priceOfLicense = (plans, l) => {
  const p = planById(plans, l.planId);
  const v = p.versions.find((x) => x.v === l.planVersion) || latestVersion(p);
  return (l.billing === 'm' ? v.prices.m : v.prices.y / 12) * (p.seat ? l.seats : 1);
};
const macLimitOf = (plans, l) => {
  const p = planById(plans, l.planId);
  const v = p.versions.find((x) => x.v === l.planVersion) || latestVersion(p);
  const base = l.overrides && l.overrides['license.max_devices'] != null ? l.overrides['license.max_devices'] : v.quotas['license.max_devices'];
  return base == null ? Infinity : base * (p.seat ? l.seats : 1);
};
const STATE_TONE = { active: 'good', trialing: 'good', past_due: 'warn', canceled: 'quiet', expired: 'quiet', suspended: 'warn', revoked: 'bad' };
function StateTag({ state }) {
  const tone = STATE_TONE[state];
  return (
    <span className={cn('inline-flex h-5 items-center gap-1.5 rounded-full px-2 text-[11.5px] font-[620] whitespace-nowrap',
      tone === 'good' ? 'bg-[var(--color-accent-soft)] text-[var(--color-accent-ink)]' : tone === 'warn' ? 'bg-caution-soft text-caution' : tone === 'bad' ? 'bg-destructive-soft text-destructive' : 'bg-sunken text-ink-2')}>
      <span aria-hidden className="size-1.5 rounded-full bg-current" />{STATE_LABEL[state]}
    </span>
  );
}
const fieldCls = 'h-8 min-w-0 rounded-full bg-[var(--input-bg)] px-3 text-[13px] shadow-[inset_0_0_0_1px_var(--control)] outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring disabled:opacity-50';

              {byPlan.map(({ p, n, mrr: m }) => (

function PortalPlans() {
  const plans = useApp((s) => s.plans);
  const licenses = useApp((s) => s.licenses);
  const publishPlan = useApp((s) => s.publishPlan);
  const [sel, setSel] = useState('pro');
  const plan = planById(plans, sel);
  const cur = latestVersion(plan);
  const fresh = () => ({ name: plan.name, tagline: plan.tagline, visibility: plan.visibility, prices: { ...cur.prices }, features: { ...cur.features }, quotas: { ...cur.quotas } });
  const [draft, setDraft] = useState(fresh);
  const [applyTo, setApplyTo] = useState('new');
  useEffect(() => { setDraft(fresh()); setApplyTo('new'); }, [sel, cur.v]);
  const on = licenses.filter((l) => l.planId === sel && l.state !== 'revoked');
  const diffs = [
