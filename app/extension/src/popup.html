<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mergelane</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 340px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 0.5px solid var(--border);
      }
      header img {
        width: 22px;
        height: 22px;
      }
      header strong {
        flex: 1;
        font-size: 14px;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 6px;
        font: 11px var(--mono);
        color: var(--text2);
      }
      #site-host {
        font: 500 12.5px var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #closed {
        padding: 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-bottom: 0.5px solid var(--border);
      }
      #media {
        padding: 12px 14px 6px;
        border-bottom: 0.5px solid var(--border);
      }
      #media h2 {
        margin: 0 0 4px;
      }
      #media-list {
        list-style: none;
        margin: 0;
        padding: 0;
        /* About four and a half rows, so a longer list shows that it scrolls. */
        max-height: 236px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      #media-list li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
      }
      #media-list li + li {
        border-top: 0.5px solid var(--border);
      }
      #media-list .grow {
        gap: 1px;
      }
      .kind {
        flex-shrink: 0;
        min-width: 40px;
        height: 20px;
        padding: 0 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0.5px solid var(--strong);
        border-radius: 5px;
        font: 600 10.5px var(--mono);
        letter-spacing: 0.02em;
        color: var(--text2);
      }
      .media-host,
      .media-path {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .media-host {
        font: 500 12.5px var(--mono);
      }
      .media-path {
        font: 11.5px var(--mono);
      }
      .media-send {
        flex-shrink: 0;
        /* Download, Sending… and Sent all fit, so the row never shifts. */
        min-width: 88px;
        transition: transform 0.1s ease-out;
      }
      /* Answers the press itself, not its release. */
      .media-send:active:not([aria-disabled='true']) {
        transform: scale(0.97);
      }
      .media-send[aria-disabled='true'] {
        cursor: default;
      }
      .media-send[aria-busy='true'] {
        color: var(--text2);
      }
      .media-send.sent {
        border-color: transparent;
        background: transparent;
        color: var(--on);
      }
      #media-status {
        margin: 0;
        font-size: 12px;
      }
      #media-status:not(:empty) {
        margin: 2px 0 6px;
      }
      @media (prefers-reduced-motion: reduce) {
        .media-send {
          transition: none;
        }
        .media-send:active:not([aria-disabled='true']) {
          transform: none;
          opacity: 0.75;
        }
      }
      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 6px 6px 14px;
        background: var(--bg2);
        font-size: 11.5px;
        color: var(--text3);
      }
      footer span {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" alt="" />
      <strong>Mergelane</strong>
      <div id="status" role="status">
        <span class="dot" id="status-dot"></span><span id="status-text">…</span>
      </div>
    </header>

    <div class="notice" id="access" hidden>
      Mergelane needs access to websites to send your sign-in with each download and to find videos
      on pages.
      <button type="button" class="primary" id="grant">Allow access</button>
    </div>

    <div id="closed" hidden>
      <div class="title">Mergelane isn’t open</div>
      <div class="muted">Downloads stay in the browser until it is.</div>
      <div style="display: flex; align-items: center; gap: 12px">
        <button type="button" id="open-mergelane">Open Mergelane</button>
        <a href="https://github.com/ZahidNoor7/mergelane" target="_blank" rel="noreferrer"
          >Get Mergelane</a
        >
      </div>
    </div>

    <section id="media" aria-labelledby="media-title" hidden>
      <h2 class="title" id="media-title">Videos on this page</h2>
      <ul id="media-list"></ul>
      <p class="muted" id="media-status" role="status" aria-atomic="true"></p>
    </section>

    <label class="row" for="capture">
      <span class="grow">
        <span class="title">Capture downloads</span>
        <span class="muted" id="capture-hint"></span>
      </span>
      <input type="checkbox" role="switch" class="switch" id="capture" />
    </label>

    <label class="row" for="site" id="site-row" hidden>
      <span class="grow">
        <span id="site-host"></span>
        <span class="muted" id="site-hint"></span>
      </span>
      <input type="checkbox" role="switch" class="switch" id="site" />
    </label>

    <footer>
      <span>Right-click any link › Download with Mergelane</span>
      <button type="button" class="ghost" id="options">Options</button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
