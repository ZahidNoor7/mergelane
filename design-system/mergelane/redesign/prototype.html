const EXAMPLES = [
  { label: 'Video', icon: Film, url: 'https://www.youtube.com/watch?v=example' },
  { label: 'File', icon: FileArchive, url: 'https://cdn.example.org/assets/texture-pack-8k.zip' },
  { label: 'Torrent', icon: Magnet, url: 'magnet:?xt=urn:btih:example&dn=debian-13.2.0-arm64-netinst.iso' },
];
const QUALITIES = [
  { id: '2160p', size: 3.8e9 },
  { id: '1440p', size: 2.2e9 },
  { id: '1080p60', size: 1.42e9 },
  { id: '720p', size: 0.61e9 },
  { id: 'Audio only', size: 0.088e9 },
];
function detect(raw) {
  const u = raw.trim();
  if (!u) return null;
  if (/^magnet:/i.test(u) || /\.torrent$/i.test(u)) return { kind: 'torrent', name: 'debian-13.2.0-arm64-netinst.iso', size: 0.68e9, note: '41 peers found', glyph: 'Magnet' };
  if (/youtube\.com|youtu\.be|\.m3u8|\.mpd/i.test(u)) return { kind: 'video', name: 'Rebuilding a 1970s tape deck', source: /\.m3u8|\.mpd/i.test(u) ? 'HLS' : 'YouTube', note: '38 min video', glyph: 'Film' };
  if (/^https?:\/\/[^\s/]+\.[^\s/]+/i.test(u)) {
    const file = decodeURIComponent(u.split(/[?#]/)[0].split('/').filter(Boolean).pop() || 'download');
    return { kind: 'http', name: file, host: u.split('/')[2], size: 2.4e9, note: 'The server allows split downloads', glyph: /\.zip$/i.test(file) ? 'FileArchive' : 'Package' };
  }
  return { kind: 'invalid' };
}

function NewDownloadSheet({ mobile }) {
  const open = useApp((s) => s.sheetOpen);
  const links = useApp((s) => s.links);
  const unit = useApp((s) => s.unit);
  const addDownload = useApp((s) => s.addDownload);
  const routeLock = useApp((s) => (s.routing.down !== 'all' ? (s.links.find((l) => l.id === s.routing.down) || {}).name : null));
  const reduced = useReducedMotion();
  const [phase, setPhase] = useState('closed');
  const panelRef = useRef(null);
  const inputRef = useRef(null);
  const [url, setUrl] = useState('');
  const [quality, setQuality] = useState('2160p');
  const [chosen, setChosen] = useState(['en0', 'en7', 'en5']);
  const [streams, setStreams] = useState('auto');
  const [when, setWhen] = useState('now');
  const [time, setTime] = useState('01:00');
  const [folder, setFolder] = useState('~/Downloads');

  useEffect(() => {
    if (open) {
      const { prefs } = useApp.getState();
      setUrl(''); setQuality('2160p'); setWhen('now'); setStreams(prefs.defaultStreams); setFolder(prefs.folder);
      setPhase('enter');
      const r = requestAnimationFrame(() => requestAnimationFrame(() => setPhase('open')));
      return () => cancelAnimationFrame(r);
    }
    if (phase === 'closed') return undefined;
    setPhase('leave');
    const t = setTimeout(() => {
      setPhase('closed');
      if (returnFocusTo && document.contains(returnFocusTo)) returnFocusTo.focus();
    }, reduced ? 140 : 220);
    return () => clearTimeout(t);
  }, [open]);
  useEffect(() => { if (phase === 'open') inputRef.current?.focus(); }, [phase]);

  if (phase === 'closed') return null;
  const shown = phase === 'open';
  const found = detect(url);
  const valid = found && found.kind !== 'invalid';
  const size = found?.kind === 'video' ? QUALITIES.find((q) => q.id === quality).size : found?.size;
  const canSubmit = valid && chosen.length > 0;
  const action = when === 'now' ? 'Download' : when === 'queue' ? 'Add to queue' : `Start at ${time}`;

  const submit = (e) => {
    e.preventDefault();
    if (!canSubmit) return;
    const id = `n${Date.now()}`;
    const per = streams === 'auto' ? 2 : Number(streams);
    addDownload({
      id, kind: found.kind, name: found.kind === 'video' ? `${found.name}.mp4` : found.name, host: found.host, source: found.kind === 'torrent' ? 'Torrent' : found.source,
      quality: found.kind === 'video' ? quality : undefined, glyph: found.glyph, size, chunk: found.kind === 'torrent' ? 8e6 : found.kind === 'video' ? 6e6 : 32e6,
      uses: chosen, streams: Object.fromEntries(chosen.map((c) => [c, found.kind === 'torrent' ? 9 : per])), peers: found.kind === 'torrent' ? 41 : undefined,
      addedAt: Date.now(), bytesByLink: {}, speedByLink: {}, status: when === 'now' ? 'downloading' : 'queued', startAt: when === 'later' ? time : null, weight: 0.8, peak: 0,
    });
  };
  const onKeyDown = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key !== 'Tab') return;
    const f = [...panelRef.current.querySelectorAll('button:not([disabled]), input:not([disabled]), [tabindex="0"]')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

        className={cn(
          'ml-sheet absolute flex flex-col overflow-hidden bg-popover shadow-[var(--shadow-sheet)] @container',

                      <span className="font-mono text-[11px] text-ink-3">{l.id}</span>

              <p className="text-[12px] leading-snug text-ink-3">{chosen.includes('en7') ? 'iPhone USB uses your phone’s data plan.' : chosen.length === 0 ? 'Choose at least one network.' : `Speed now: about ${fmtSpeedText(links.filter((l) => chosen.includes(l.id)).reduce((a, l) => a + l.base, 0), unit)} across ${chosen.length} network${chosen.length > 1 ? 's' : ''}.`}</p>

          <div className={row}>
            <span className={fieldLabel} id="nd-streams-label">Connections</span>
            <div className="flex flex-wrap items-center gap-2">

              <span className="text-[12px] text-ink-3">per network</span>
            </div>
          </div>

          <fieldset className={row}>
            <legend className="sr-only">When</legend>
            <span aria-hidden className={fieldLabel}>When</span>
            <div className="flex flex-wrap items-center gap-2">
              <Segmented label="When to start" value={when} onChange={setWhen} options={[{ value: 'now', label: 'Now' }, { value: 'queue', label: 'Add to queue' }, { value: 'later', label: 'At a time', icon: <Clock /> }]} />
              {when === 'later' && (
                <label className="flex h-8 items-center gap-2 rounded-full bg-[var(--input-bg)] px-3 text-[13px] shadow-[inset_0_0_0_1px_var(--control)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-ring">
                  <span className="sr-only">Start time</span>
                  <input type="time" value={time} onChange={(e) => setTime(e.target.value || '01:00')} className="figures bg-transparent text-[14px] outline-none" />
                </label>
              )}
            </div>
          </fieldset>

          <div className={row}>
            <span className={fieldLabel}>Save to</span>
            <div className="flex min-w-0 items-center gap-2">
              <HardDrive className="size-3.5 shrink-0 text-ink-3" />
              <span className="min-w-0 truncate font-mono text-[12.5px]">{folder}</span>
              <Button size="sm" className="ml-auto" onClick={() => setFolder((f) => nextFolder(f))}>Change…</Button>
            </div>
          </div>
        </div>
        <div className="ml-sheet-footer flex items-center justify-end gap-2 border-t border-rule bg-popover px-5 py-3">
          <Button variant="ghost" onClick={closeSheet}>Cancel</Button>
          <Button type="submit" variant="primary" disabled={!canSubmit}>{when === 'later' ? <Clock /> : null}{action}</Button>
        </div>
      </form>
    </div>
  );
}
function CheckMark() { return <svg viewBox="0 0 12 12" className="size-2.5" aria-hidden><path d="M2.5 6.2 5 8.5 9.5 3.5" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" /></svg>; }

/* ── Settings: every preference in one place (⌘,) ─────────────────────────────────────────── */
const FOLDERS = ['~/Downloads', '~/Downloads/Mergelane', '~/Movies'];
const nextFolder = (f) => FOLDERS[(FOLDERS.indexOf(f) + 1) % FOLDERS.length];
const SETTINGS_SECTIONS = [
  { id: 'general', label: 'General', short: 'General', icon: SlidersHorizontal },
  { id: 'appearance', label: 'Appearance', short: 'Appearance', icon: Palette },
  { id: 'downloads', label: 'Downloads', short: 'Downloads', icon: ArrowDownToLine },
  { id: 'extensions', label: 'Browser extensions', short: 'Extensions', icon: Puzzle },
  { id: 'updates', label: 'Updates', short: 'Updates', icon: RefreshCw },
];
const hasUpdate = (u) => ['available', 'downloading', 'verifying', 'ready'].includes(u.status);

function SettingsGroup({ title, description, aside, children }) {
  return (
    <section className="flex flex-col gap-2">

}

function SettingRow({ label, hint, htmlFor, children, stack = false, muted = false }) {
  const Label = htmlFor ? 'label' : 'span';
  return (
    <div className={cn('flex gap-x-4 gap-y-2.5 border-b border-rule py-3 last:border-b-0', stack ? 'flex-col' : 'flex-wrap items-center', muted && 'opacity-55')}>
      <div className="flex min-w-0 flex-1 basis-56 flex-col gap-0.5">

function PrefSwitch({ label, hint, checked, onChange, disabled }) {
  const id = useId();
  return (
    <SettingRow label={label} hint={hint} htmlFor={id} muted={disabled}>
      <Switch id={id} checked={checked} onCheckedChange={onChange} disabled={disabled} />
    </SettingRow>

}

function Spinner({ className }) { return <RotateCw aria-hidden className={cn('motion-safe:animate-spin', className)} />; }

/* General */
function GeneralSettings() {
  const unit = useApp((s) => s.unit);
  const setUnit = useApp((s) => s.setUnit);
  const links = useApp((s) => s.links);
  const slowMode = useApp((s) => s.slowMode);
  const prefs = useApp((s) => s.prefs);
  const setPref = useApp((s) => s.setPref);
  const total = links.reduce((a, l) => a + l.speed, 0);
  const wifi = links.find((l) => l.id === 'en0');
  const unitHint = {
    kb: 'Every speed in kilobytes per second, however fast. 1 KB is 1,000 bytes, as macOS counts.',
    bytes: 'Megabytes per second, dropping to KB/s below 1 MB/s. Matches the sizes Finder shows.',
    bits: 'Megabits per second, the way internet providers quote speeds. 8 Mbps is 1 MB/s.',
  }[unit];
  return (
    <>
      <SettingsGroup title="Speeds" description="Used everywhere a speed appears: the sidebar, every download, the charts and their axes, and limits.">
        <SettingRow label="Show speeds in" hint={unitHint}>
          <Segmented label="Show speeds in" value={unit} onChange={setUnit} options={UNIT_OPTIONS} />
        </SettingRow>
        <div className="flex flex-wrap items-baseline gap-x-6 gap-y-1 border-b border-rule py-3 last:border-b-0" aria-live="polite">
          <span className="text-[12.5px] text-ink-3">Right now</span>
          <span className="flex items-baseline gap-2 text-[12.5px] text-ink-2"><Swatch kind="wifi" />Wi-Fi <Speed bps={wifi.speed} unit={unit} dash={wifi.speed === 0} className="text-[15px] font-[640] text-foreground" /></span>
          <span className="flex items-baseline gap-2 text-[12.5px] text-ink-2">Merged <Speed bps={total} unit={unit} dash={total === 0} className="text-[15px] font-[640] text-foreground" /></span>
        </div>
        <PrefSwitch
          label="Slow mode"
          hint={`Caps all of Mergelane’s downloads at ${fmtSpeedText(SLOW_CAP, unit)} in total, so calls and streaming stay smooth. Also in the sidebar.`}
          checked={slowMode}
          onChange={(v) => useApp.setState((s) => ({ slowMode: v, ...advance({ ...s, slowMode: v }, 0) }))}
        />
      </SettingsGroup>
      <SettingsGroup title="On this Mac">
        <PrefSwitch label="Open at login" hint="Starts in the menu bar, so scheduled downloads begin on time." checked={prefs.launchAtLogin} onChange={(v) => setPref('launchAtLogin', v)} />
        <PrefSwitch label="Show the merged speed in the menu bar" checked={prefs.menuBar} onChange={(v) => setPref('menuBar', v)} />
        <PrefSwitch label="Notify me when a download finishes" hint="Uses macOS notifications. You can change their style in System Settings › Notifications." checked={prefs.notifyDone} onChange={(v) => setPref('notifyDone', v)} />
      </SettingsGroup>
    </>
  );
}

function NetworkLimitsRow() {
  const limits = useApp((s) => s.limits);
  const routing = useApp((s) => s.routing);
  const unit = useApp((s) => s.unit);
  const links = useApp((s) => s.links);
  const set = links.flatMap((l) => ['down', 'up'].filter((dir) => isFinite(limitFor({ limits }, l.id, dir))).map((dir) => `${l.name} ${dir === 'down' ? '↓' : '↑'} ${fmtSpeedText(limitFor({ limits }, l.id, dir), unit)}`));
  const name = (id) => (links.find((l) => l.id === id) || {}).name;
  const hint = [
    !limits.on ? 'Limits are off.' : set.length ? `Limits: ${set.join(', ')}.` : 'No limits set.',
    routing.down !== 'all' || routing.up !== 'all' ? `Downloads use ${routing.down === 'all' ? 'all networks' : name(routing.down)}, uploads ${routing.up === 'all' ? 'all networks' : name(routing.up)}.` : null,
  ].filter(Boolean).join(' ');
  const open = () => {
    useApp.getState().setScreen('networks');
    setTimeout(() => { const el = document.getElementById('limits'); if (el) { el.scrollIntoView({ block: 'start', behavior: 'smooth' }); el.querySelector('[role="switch"]')?.focus({ preventScroll: true }); } }, 60);
  };
  return (
    <SettingRow label="Speed limits and routing, per network" hint={hint}>
      <Button size="sm" onClick={open}><Gauge />Open in Networks</Button>
    </SettingRow>
  );
}

/* Browser extensions */
function BrowserRow({ b }) {
  const st = useApp((s) => s.ext.browsers[b.id]);
  const installExt = useApp((s) => s.installExt);
  const updateExt = useApp((s) => s.updateExt);
  const uninstallExt = useApp((s) => s.uninstallExt);
  const patchBrowser = useApp((s) => s.patchBrowser);
  const [confirming, setConfirming] = useState(false);
  const id = useId();
  const Icon = b.icon;
  let status;
  if (b.unsupported) status = 'Not supported yet. Chrome-based browsers and Safari are.';
  else if (!st.found) status = 'Not on this Mac. Install it, then scan again.';
  else if (st.busy === 'installing') status = b.id === 'safari' ? 'Turning it on in Safari Settings › Extensions…' : `Confirm “Add extension” in ${b.short}…`;
  else if (st.busy === 'updating') status = `Updating to ${st.update}…`;
  else if (st.busy === 'removing') status = `Removing from ${b.short}…`;
  else if (!st.installed) status = b.id === 'safari' ? 'Not turned on. It comes inside Mergelane.' : 'Not installed';
  else if (st.update) status = `Version ${st.version}. Version ${st.update} is ready.`;
  else status = st.enabled ? `Version ${st.version}, sending downloads to Mergelane` : `Version ${st.version}, turned off`;
  const dim = b.unsupported || !st.found;
  return (
    <li className="flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-rule py-3 last:border-b-0">
      <span aria-hidden className={cn('inline-flex size-9 shrink-0 items-center justify-center rounded-[10px] bg-sunken text-ink-2 shadow-[inset_0_0_0_1px_var(--border)]', dim && 'opacity-55')}><Icon className="size-[18px]" strokeWidth={1.75} /></span>
      <div className="flex min-w-0 flex-1 basis-48 flex-col gap-0.5">
        <p className="flex flex-wrap items-center gap-2 text-[13.5px] font-[620]">
          {b.name}
          {st.installed && st.update && !st.busy && <span className="rounded-full bg-[var(--color-accent-soft)] px-2 py-px text-[11px] font-[620] text-[var(--color-accent-ink)]">Update</span>}
        </p>
        <p className={cn('flex items-center gap-1.5 text-[12.5px] leading-snug', dim ? 'text-ink-3' : 'text-ink-2')} role="status">{st.busy && <Spinner className="size-3 shrink-0" />}{status}</p>
      </div>
      {!dim && !st.busy && (
        <div className="flex flex-wrap items-center gap-2">
          {!st.installed ? (
            <Button variant="primary" size="sm" onClick={() => installExt(b.id)}><Download />{b.id === 'safari' ? 'Turn on' : 'Install'}</Button>
          ) : confirming ? (
            <div role="group" aria-label={`Confirm removing from ${b.short}`} className="flex flex-wrap items-center gap-2">
              <span className="text-[12.5px] text-ink-2">Remove from {b.short}?</span>
              <Button variant="destructive" size="sm" onClick={() => { setConfirming(false); uninstallExt(b.id); }}>Uninstall</Button>
              <Button variant="ghost" size="sm" onClick={() => setConfirming(false)}>Keep</Button>
            </div>
          ) : (
            <>
              {st.update && <Button size="sm" onClick={() => updateExt(b.id)}><RefreshCw />Update</Button>}
              <Button variant="ghost" size="icon-sm" aria-label={`Uninstall from ${b.short}`} title="Uninstall" onClick={() => setConfirming(true)}><Trash2 /></Button>
              <label htmlFor={id} className="sr-only">Use the extension in {b.short}</label>
              <Switch id={id} checked={st.enabled} onCheckedChange={(v) => patchBrowser(b.id, { enabled: v })} />
            </>
          )}
        </div>
      )}
    </li>
  );
}

function ExtensionSettings() {

      <SettingsGroup

        <SettingRow label="Only files larger than" hint="Smaller files stay with the browser." muted={off}>

        </SettingRow>
        <SettingRow label="File types" hint="Mergelane takes only the types you pick." stack muted={off}>
          <div role="group" aria-label="File types" className="flex flex-wrap gap-1.5">
            {FILE_TYPES.map(([k, label]) => {

                  key={k}

                >

/* Updates */
function UpdateSettings() {
  const u = useApp((s) => s.update);
  const now = useApp((s) => s.now);
  const a = useApp.getState();
  const r = u.latest;
  const busy = ['checking', 'downloading', 'verifying', 'restarting'].includes(u.status);
  const pct = Math.round(u.progress * 100);
  let title, body, actions = null, tone = 'plain';
  switch (u.status) {
    case 'checking':
      title = 'Checking for updates…'; body = 'Asking GitHub for the newest release.'; break;
    case 'available':
      tone = 'accent';
      title = `Mergelane ${r.version} is available`;
      body = `You have ${u.version}. Released ${r.date}, ${fmtBytes(r.size)}.`;
      actions = (<><Button variant="primary" size="sm" onClick={a.installUpdate}><Download />Download and install</Button><Button variant="ghost" size="sm" onClick={a.skipUpdate}>Skip this version</Button></>);
      break;
    case 'downloading':
      tone = 'accent';
      title = `Downloading ${r.version}…`; body = `${fmtBytes(r.size * u.progress)} of ${fmtBytes(r.size)}`;
      actions = <Button variant="ghost" size="sm" onClick={a.cancelUpdate}>Cancel</Button>;
      break;
    case 'verifying':
      tone = 'accent';
      title = 'Checking the download…'; body = 'Comparing it with the SHA-256 published with the release.'; break;
    case 'ready':
      tone = 'accent';
      title = `${r.version} is ready to install`;
      body = 'Mergelane restarts to finish. Running downloads pause and pick up where they left off.';
      actions = <Button variant="primary" size="sm" onClick={a.restartToUpdate}><RotateCw />Restart and update</Button>;
      break;
    case 'restarting':
      title = 'Restarting…'; body = `Installing ${r.version}.`; break;
    case 'current':
      title = 'Mergelane is up to date'; body = u.note || `${u.version} is the newest ${u.channel} version.`; break;
    default:
      title = `Last checked ${fmtAgo(now - u.lastChecked)}`; body = u.note || 'Mergelane checks once a day while it runs.';
  }
  const canCheck = !busy && !['available', 'ready'].includes(u.status);
  return (
    <>
      <section aria-labelledby="upd-title" className="flex flex-col gap-4 rounded-[14px] bg-card p-4 shadow-[inset_0_0_0_1px_var(--border)]">
        <div className="flex flex-wrap items-center gap-x-4 gap-y-3">
          <AppIcon size={56} className="-m-1" />
          <div className="flex min-w-0 flex-1 basis-48 flex-col">
            <Wordmark className="text-[18px]" />
            <p className="text-[12.5px] text-ink-2">Version <span className="figures text-[13.5px] font-[620] text-foreground">{u.version}</span> <span className="text-ink-3">({u.build})</span>, {u.channel === 'beta' ? 'beta' : 'stable'} channel</p>
          </div>
          <Button size="sm" disabled={!canCheck} onClick={a.checkForUpdates}>
            {u.status === 'checking' ? <><Spinner />Checking…</> : <><RefreshCw />Check for updates</>}
          </Button>
        </div>
        <div role="status" aria-live="polite" className={cn('flex flex-col gap-2.5 rounded-[11px] p-3', tone === 'accent' ? 'bg-[var(--color-accent-soft)] shadow-[inset_0_0_0_1px_color-mix(in_oklab,var(--color-accent)_30%,transparent)]' : 'bg-sunken shadow-[inset_0_0_0_1px_var(--border-subtle)]')}>
          <div className="flex items-start gap-2.5">
            {u.status === 'current' ? <CircleCheck className="mt-0.5 size-4 shrink-0 text-ink-2" /> : busy ? <Spinner className="mt-0.5 size-4 shrink-0 text-ink-2" /> : tone === 'accent' ? <Sparkles className="mt-0.5 size-4 shrink-0 text-[var(--color-accent-ink)]" /> : <Clock className="mt-0.5 size-4 shrink-0 text-ink-2" />}
            <div className="flex min-w-0 flex-col gap-0.5">
              <p id="upd-title" className="text-[13.5px] font-[640]">{title}</p>
              <p className="text-[12.5px] leading-[1.5] text-ink-2">{body}</p>
            </div>
          </div>
          {u.status === 'downloading' && (
            <div role="progressbar" aria-label={`Downloading ${r.version}`} aria-valuemin={0} aria-valuemax={100} aria-valuenow={pct} className="h-1.5 w-full overflow-hidden rounded-full bg-track">
              <span className="block h-full rounded-full bg-primary motion-safe:transition-[width] motion-safe:duration-150" style={{ width: `${pct}%` }} />
            </div>
          )}
          {r && ['available', 'downloading', 'verifying', 'ready'].includes(u.status) && (
            <div className="flex flex-col gap-1 border-t border-rule pt-2.5">
              <p className="text-[12.5px] font-[620]">What’s new in {r.version}</p>
              <ul className="flex flex-col gap-1">
                {r.notes.map((n) => <li key={n} className="flex gap-2 text-[12.5px] leading-[1.5] text-ink-2"><span aria-hidden className="mt-[0.55em] size-1 shrink-0 rounded-full bg-[var(--text-tertiary)]" />{n}</li>)}
              </ul>
            </div>
          )}
          {actions && <div className="flex flex-wrap items-center gap-2">{actions}</div>}
        </div>
      </section>

      <SettingsGroup title="Automatic updates">
        <PrefSwitch label="Check for updates automatically" hint="Once a day. Mergelane tells you in the sidebar when one is out." checked={u.auto} onChange={(v) => a.setUpdate({ auto: v })} />
        <PrefSwitch label="Download updates in the background" hint="Only the download happens by itself. Installing always waits for you." checked={u.background} disabled={!u.auto} onChange={(v) => a.setUpdate({ background: v })} />
        <SettingRow label="Channel" hint={u.channel === 'beta' ? 'Beta versions arrive a few weeks early and may have rough edges.' : 'Tested releases only.'}>
          <Segmented label="Update channel" value={u.channel} onChange={a.setChannel} options={[{ value: 'stable', label: 'Stable' }, { value: 'beta', label: 'Beta' }]} />
        </SettingRow>
      </SettingsGroup>

      <aside className="flex gap-3 rounded-[14px] bg-sunken p-4 shadow-[inset_0_0_0_1px_var(--border-subtle)]">
        <ShieldCheck className="mt-0.5 size-4 shrink-0 text-ink-2" />
        <p className="max-w-[64ch] text-[12.5px] leading-[1.6] text-ink-2">Updates come from Mergelane’s GitHub releases, and each one is checked against its published SHA-256 before it’s installed. Mergelane isn’t signed by Apple yet, so the first time it opens after an update macOS may ask you to confirm in System Settings › Privacy & Security.</p>
      </aside>
    </>
  );
}

function AppWindow() {
  const [ref, w] = useWidth();
  const screen = useApp((s) => s.screen);
  const sheetOpen = useApp((s) => s.sheetOpen);
  const contentRef = useRef(null);
  const sidebar = w >= 760;
  const split = w - (sidebar ? 236 : 0) >= 860;
  const compact = w < 520;
  const mobileSheet = w < 640;
  useEffect(() => { if (contentRef.current) contentRef.current.inert = sheetOpen; }, [sheetOpen]);
  // ⌘, opens Settings, as in every Mac app.
  useEffect(() => {
    const onKey = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); useApp.getState().openSettings(); } };

    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return (
    <div
      ref={ref}
      className="ml-window relative mt-4 flex overflow-hidden rounded-[14px] bg-window text-foreground shadow-[var(--shadow-window)] md:h-[800px] [&_button]:cursor-default [&_label]:cursor-default"

/* ── identity ─────────────────────────────────────────────────────────────────────────
   The owner's design: a solid blue M on a charcoal tile, in four parts split by thin gaps (a wave leg, an oval under
   its crest, a band that wraps under the oval and rises into an arrow, and a wedge leg). Many connections, one faster lane. The icon is a file (brand/svg, brand/png), so the Dock,
   the About box and this page all show the same pixels. In the app: build/icon.icns and resources/trayTemplate*.png. */
function useIsDark() {
  const mode = useApp((s) => s.mode);
  const sys = useMedia('(prefers-color-scheme: dark)');
  return mode === 'dark' || (mode !== 'light' && sys);
}
/* The app icon at any size: vector above 64 px, pixel-fitted PNGs (at 2x) below. */
function AppIcon({ size = 64, variant = 'default', className, alt = '' }) {
  const v = variant;
  const src = size <= 64 ? `brand/png/icon-${v}-${size <= 16 ? 32 : size <= 32 ? 64 : 128}.png` : `brand/svg/icon-${v}.svg`;
  return <img src={src} width={size} height={size} alt={alt} aria-hidden={alt ? undefined : true} draggable={false} className={cn('shrink-0 select-none', className)} />;

function Root() {
  const tick = useApp((s) => s.tick);
  useEffect(() => { const t = setInterval(tick, 1000); return () => clearInterval(t); }, [tick]);
  // Liquid Glass light. The rim's light angle turns toward the pointer while it's over the window, and a specular
  // spot follows it on whichever glass surfaces it is over. Paint only, once per frame at most; other themes skip it.
  useEffect(() => {
    const root = document.documentElement;
    // Refraction needs SVG filters inside backdrop-filter, which only Chromium (so Electron) draws.
    try { if (navigator.userAgentData && navigator.userAgentData.brands.some((b) => /Chromium/.test(b.brand))) root.setAttribute('data-refract', ''); } catch (e) {}
    const HOSTS = '.ml-window, .ml-surface, .ml-content, .ml-sheet, .bg-card, .ml-btn, .ml-field, .ml-notice';
    let raf = 0, last = null;
    const frame = () => {
      raf = 0;
      const e = last;
      if (!e || root.getAttribute('data-palette') !== 'liquid') return;
      const win = document.querySelector('.ml-window');
      if (win) {
        const r = win.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        const ang = inside ? Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI + 90 : 135;
        root.style.setProperty('--la', `${ang.toFixed(1)}deg`);
      }
      let el = e.target instanceof Element ? e.target.closest(HOSTS) : null;
      while (el) {
        const r = el.getBoundingClientRect();
        el.style.setProperty('--mx', `${(e.clientX - r.left).toFixed(0)}px`);
        el.style.setProperty('--my', `${(e.clientY - r.top).toFixed(0)}px`);
        el = el.parentElement ? el.parentElement.closest(HOSTS) : null;
      }
    };
    const onMove = (e) => { last = e; if (!raf) raf = requestAnimationFrame(frame); };
    document.addEventListener('pointermove', onMove, { passive: true });
    return () => { document.removeEventListener('pointermove', onMove); cancelAnimationFrame(raf); };
  }, []);
  // The daily automatic check, brought forward to a few seconds after opening so the notice can be seen.
  useEffect(() => { const t = setTimeout(() => { const s = useApp.getState(); if (s.update.auto && s.update.status === 'idle') s.checkForUpdates(); }, 5000); return () => clearTimeout(t); }, []);
  return (
    <>
      {/* Liquid Glass's desktop and refraction filter; display: none in every other theme. */}
      <div className="ml-wallpaper" aria-hidden="true">
        <span className="rb r1" /><span className="rb r2" /><span className="rb r3" /><span className="rb r4" />
        <span className="veil" /><span className="grain" />
      </div>
      <svg className="ml-fx" aria-hidden="true" focusable="false" width="0" height="0">
        <defs>
          <filter id="mlRefract" x="-10%" y="-10%" width="120%" height="120%" colorInterpolationFilters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="11" result="noise" />
            <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
            <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <linearGradient id="ml-g-wifi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-wifi)', stopOpacity: 0.95 }} /><stop offset="1" style={{ stopColor: 'var(--color-wifi)', stopOpacity: 0.5 }} /></linearGradient>
          <linearGradient id="ml-s-wifi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-wifi)', stopOpacity: 0.38 }} /><stop offset="1" style={{ stopColor: 'var(--color-wifi)', stopOpacity: 0 }} /></linearGradient>
          <linearGradient id="ml-l-wifi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style={{ stopColor: 'color-mix(in oklab, var(--color-wifi) 62%, var(--lane-tint))' }} /><stop offset="0.6" style={{ stopColor: 'var(--color-wifi)' }} /><stop offset="1" style={{ stopColor: 'var(--color-wifi)' }} /></linearGradient>
          <linearGradient id="ml-g-usb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-usb)', stopOpacity: 0.95 }} /><stop offset="1" style={{ stopColor: 'var(--color-usb)', stopOpacity: 0.5 }} /></linearGradient>
          <linearGradient id="ml-s-usb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-usb)', stopOpacity: 0.38 }} /><stop offset="1" style={{ stopColor: 'var(--color-usb)', stopOpacity: 0 }} /></linearGradient>
          <linearGradient id="ml-l-usb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style={{ stopColor: 'color-mix(in oklab, var(--color-usb) 62%, var(--lane-tint))' }} /><stop offset="0.6" style={{ stopColor: 'var(--color-usb)' }} /><stop offset="1" style={{ stopColor: 'var(--color-usb)' }} /></linearGradient>
