/* ── History ───────────────────────────────────────────────────────────────────────────────
   Everything Mergelane has downloaded, including what was removed from the list. Search reads names, sites and links.
   A file that was moved or deleted says so, and can be fetched again from its saved link. */
const HISTORY_SHOW = [
  { value: 'all', label: 'All' },
  { value: 'onDisk', label: 'On disk' },
  { value: 'removed', label: 'Not in the list' },
  { value: 'missing', label: 'File missing' },
];
function historyBucket(t, now) {
  const t0 = startOfDay(now);
  if (t >= t0) return 'Today';
  if (t >= t0 - DAY) return 'Yesterday';
  if (t >= t0 - 6 * DAY) return 'Earlier this week';
  if (t >= t0 - 29 * DAY) return 'Earlier this month';
  return 'Older';
}
function HistoryStatus({ h }) {
  if (h.inList && h.status !== 'finished') {
    const pct = Math.floor((received(h) / h.size) * 100);

function ReportChart({ bars, unit }) {
  const [ref, w] = useWidth();
  const [hover, setHover] = useState(null);
  const H = 150;
  const W = Math.max(w, 100);
  const top = Math.max(...bars.map((b) => b.total), 1);
  const step = [1, 2, 5, 10, 20, 50, 100, 200, 500].map((x) => x * 1e9).find((s) => s * 3 >= top) || 1e12;
  const yTop = step * Math.ceil(top / step);
  const ticks = Array.from({ length: Math.round(yTop / step) + 1 }, (_, i) => i * step);
  const pitch = W / bars.length;
  const bw = Math.min(56, pitch - (bars.length > 20 ? 2 : 8));
  const y = (v) => H - (v / yTop) * H;
  const onKey = (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); setHover((h) => clamp((h ?? bars.length) - 1, 0, bars.length - 1)); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setHover((h) => clamp((h ?? -1) + 1, 0, bars.length - 1)); }
    else if (e.key === 'Escape') setHover(null);
  };
  const b = hover !== null ? bars[hover] : null;
  return (
    <div className="flex gap-2">
      <div className="relative w-[3.5rem] shrink-0" style={{ height: H }} aria-hidden>
        {ticks.map((t) => <span key={t} className="figures absolute right-0 -translate-y-1/2 text-[11.5px] whitespace-nowrap text-ink-3" style={{ top: y(t) }}>{t === 0 ? '0' : fmtBytes(t)}</span>)}
      </div>
      <div className="min-w-0 flex-1">
        <div ref={ref} tabIndex={0} role="img" onKeyDown={onKey} onBlur={() => setHover(null)} onPointerLeave={() => setHover(null)}
          aria-label={`Downloaded per ${bars.length > 20 && bars[0].week ? 'week' : 'day'}, split by network. Focus and use the left and right arrow keys to read each bar.`}
          className="relative rounded-[4px] outline-none focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ring" style={{ height: H }}>
          <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} aria-hidden className="block overflow-visible">
            {ticks.map((t) => <line key={t} className="ml-grid" x1={0} x2={W} y1={y(t)} y2={y(t)} stroke="var(--border)" strokeWidth={1} />)}
            {bars.map((bar, i) => {
              let acc = 0;
              const x = i * pitch + (pitch - bw) / 2;
              return (
                <g key={i} onPointerEnter={() => setHover(i)} opacity={hover !== null && hover !== i ? 0.45 : 1} style={{ transition: 'opacity 120ms' }}>
                  <rect x={i * pitch} y={0} width={pitch} height={H} fill="transparent" />
                  {['en0', 'en7', 'en5'].map((id, k) => {
                    const v = bar[id];
                    const h = (v / yTop) * H;
                    const yy = H - acc - h;
                    acc += h;
                    const kind = LINK_DEFS[[0, 1, 2][k]].kind;
                    return <rect key={id} x={x} y={yy} width={Math.max(1, bw)} height={Math.max(0, h - (k < 2 ? 1 : 0))} rx={k === 2 ? Math.min(3, bw / 3) : 0} fill={`var(--color-${kind})`} style={{ fill: `var(--chart-${kind}, var(--color-${kind}))` }} />;
                  })}

            })}
          </svg>
          {b && (

              style={hover >= bars.length / 2 ? { right: `calc(${100 - (hover / bars.length) * 100}% + 6px)` } : { left: `calc(${((hover + 1) / bars.length) * 100}% + 6px)` }}>
              <span className="text-[11.5px] text-ink-3">{b.label}</span>
              {LINK_DEFS.map((l) => <span key={l.id} className="flex items-center gap-2"><Swatch kind={l.kind} /><span className="flex-1">{useApp.getState().links.find((x) => x.id === l.id).name}</span><span className="figures font-[600]">{fmtBytes(b[l.id])}</span></span>)}

            </div>

        )}
      </div>
    </div>
  );

  return (
    <svg viewBox={`-1 -1 ${N + 2} ${N + 2}`} className="size-[132px] shrink-0 rounded-[10px] bg-white p-1.5 text-[#111]" role="img" aria-label="Pairing code to scan with the iPhone">
      {cells.map((on, i) => on && <rect key={i} x={i % N} y={Math.floor(i / N)} width={1.02} height={1.02} fill="currentColor" />)}
      <Finder x={0} y={0} /><Finder x={N - 7} y={0} /><Finder x={0} y={N - 7} />
    </svg>
  );
}

/* ── New download: duplicates and torrent files ─────────────────────────────────────────────── */
function DuplicateNotice({ dup }) {

    <div role="status" className="flex items-start gap-3 rounded-[12px] bg-caution-soft p-3 shadow-[inset_0_0_0_1px_var(--color-warning-border)]">
      <Copy className="mt-0.5 size-4 shrink-0 text-caution" />
      <div className="flex min-w-0 flex-1 flex-col gap-1.5">
        <p className="text-[13px] font-[640]">{live ? 'This is already downloading' : 'You already have this file'}</p>
        <p className="text-[12.5px] leading-[1.5] text-ink-2">
          {live ? `It’s in your list, ${pct}% done.` : `Downloaded ${fmtAgo(Date.now() - (h.completedAt || h.addedAt))} to ${folderName('~/Downloads', win)}, ${fmtBytes(h.size)}.`}{' '}
          {dup.how === 'link' ? 'Same link.' : `Same file from ${h.host}: the name and size match, and so does the SHA-256 this site publishes.`}

}
function Tick({ checked, mixed, onChange, label, className }) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.indeterminate = !!mixed; }, [mixed]);
  return <input ref={ref} type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} aria-label={label} className={cn('size-4 shrink-0 accent-[var(--color-accent)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring', className)} />;
}
function TorrentFiles({ files, onChange, progress, compact }) {
  const all = files.every((f) => f.on), none = files.every((f) => !f.on);
  const set = (pred, on) => onChange(files.map((f, i) => (pred(f, i) ? { ...f, on } : f)));
  const picked = files.filter((f) => f.on);
  const tree = fileTree(files);
  const onlyVideo = () => onChange(files.map((f) => ({ ...f, on: /\.(mkv|mp4|mov|webm)$/i.test(f.path) })));
  return (
    <div className="flex flex-col rounded-[12px] shadow-[inset_0_0_0_1px_var(--border)]">
      <div className="flex flex-wrap items-center gap-x-3 gap-y-1.5 border-b border-rule px-3 py-2">
        <label className="flex items-center gap-2 text-[12.5px] font-[620]"><Tick checked={all} mixed={!all && !none} onChange={(v) => set(() => true, v)} label="All files" />All files</label>
        <span className="figures text-[12px] text-ink-2" aria-live="polite">{picked.length} of {files.length} files, {fmtBytes(pickedSize(files))}</span>
        <Button size="sm" variant="ghost" className="ml-auto h-6 px-2 text-[12px]" onClick={onlyVideo}>Videos only</Button>
      </div>
      <ul className={cn('flex flex-col overflow-y-auto py-1', compact ? 'max-h-[220px]' : 'max-h-[260px]')} aria-label="Files in this torrent">
        {tree.map(([dir, items]) => {
          const dirAll = items.every((f) => f.on), dirNone = items.every((f) => !f.on);
          return (
            <Fragment key={dir || 'root'}>
              {dir && (
                <li className="flex items-center gap-2 px-3 py-1 text-[12.5px] font-[600] text-ink-2">
                  <Tick checked={dirAll} mixed={!dirAll && !dirNone} onChange={(v) => set((f, i) => items.some((x) => x.i === i), v)} label={`Folder ${dir}`} />
                  <Folder className="size-3.5" />{dir}
                </li>
              )}
              {items.map((f) => {
                const p = progress ? progress(f) : null;
                return (
                  <li key={f.i} className={cn('grid grid-cols-[auto_auto_minmax(0,1fr)_auto] items-center gap-2 py-1 pr-3 text-[12.5px]', dir ? 'pl-8' : 'pl-3', !f.on && 'text-ink-3')}>
                    <Tick checked={f.on} onChange={(v) => set((x, i) => i === f.i, v)} label={f.base} />
                    <File className="size-3.5 text-ink-3" />

                      <span className="truncate">{f.base}</span>
                      {p !== null && f.on && <span className="mt-0.5 h-1 overflow-hidden rounded-full bg-track"><span className="block h-full rounded-full bg-[var(--color-accent)]" style={{ width: `${p * 100}%` }} /></span>}
                    </span>
                    <span className="figures text-right text-ink-2">{!f.on ? 'Skipped' : p !== null ? `${Math.floor(p * 100)}%` : fmtBytes(f.size)}</span>
                  </li>
                );
              })}
            </Fragment>
          );
        })}
      </ul>
      {none && <p role="alert" className="border-t border-rule px-3 py-2 text-[12px] text-destructive">Choose at least one file.</p>}
    </div>
  );
}

/* ── Inspector: a link that expired, and crash-safe progress ──────────────────────────────── */
function FreshLinkPanel({ d }) {
  const resume = useApp((s) => s.resumeWithLink);
  const showToast = useApp((s) => s.showToast);
  const [url, setUrl] = useState('');
  const [state, setState] = useState('idle');
  const [err, setErr] = useState('');
  useEffect(() => { setUrl(''); setState('idle'); setErr(''); }, [d.id]);
  const pct = Math.floor((received(d) / d.size) * 100);
  const helpId = useId();
  const go = (e) => {
    e && e.preventDefault();
    const u = url.trim();
    if (!/^https?:\/\/[^\s/]+\.[^\s/]+/i.test(u)) { setErr('That isn’t a link. Paste an address that starts with https://'); return; }
    const file = decodeURIComponent(u.split(/[?#]/)[0].split('/').filter(Boolean).pop() || '');
    if (file !== d.name) { setErr(`That link is for ${file || 'another file'}, not this download. Add it as a new download instead.`); return; }
    setErr(''); setState('checking');
    setTimeout(() => { setState('idle'); resume(d.id, u); }, 1300);
  };
  return (
    <form onSubmit={go} className="flex flex-col gap-3 rounded-[12px] bg-caution-soft p-3.5 shadow-[inset_0_0_0_1px_var(--color-warning-border)]">
      <div className="flex items-start gap-2.5">
        <Link2 className="mt-0.5 size-4 shrink-0 text-caution" />
        <div className="flex min-w-0 flex-col gap-1">
          <p className="text-[13.5px] font-[640]">The link expired at {pct}%</p>
          <p className="text-[12.5px] leading-[1.5] text-ink-2">Links from {d.host} are signed and stop working after a while. Get a fresh one and Mergelane carries on from {fmtBytes(received(d))}. It checks the size and the server’s file tag first, so nothing is fetched twice.</p>
        </div>
      </div>
      <div className="flex min-w-0 flex-wrap items-center gap-2">
        <span className={cn('flex h-8 min-w-0 flex-1 basis-56 items-center gap-2 rounded-full bg-[var(--input-bg)] px-3 shadow-[inset_0_0_0_1px_var(--control)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-ring', err && 'shadow-[inset_0_0_0_1.5px_var(--color-danger)]')}>
          <Link className="size-3.5 shrink-0 text-ink-3" />
          <input value={url} onChange={(e) => { setUrl(e.target.value); setErr(''); }} placeholder="Paste the fresh link" aria-label="Fresh link" aria-describedby={helpId} aria-invalid={!!err || undefined} spellCheck={false} className="h-full min-w-0 flex-1 bg-transparent font-mono text-[12px] outline-none placeholder:font-sans placeholder:text-[12.5px] placeholder:text-ink-3" />
        </span>
        <Button type="submit" size="sm" variant="primary" disabled={!url.trim() || state === 'checking'}>{state === 'checking' ? <><Spinner />Checking…</> : 'Continue'}</Button>
      </div>
      {err && <p role="alert" className="flex items-start gap-1.5 text-[12px] text-destructive"><TriangleAlert className="mt-px size-3.5 shrink-0" />{err}</p>}
      <div id={helpId} className="flex flex-wrap items-center gap-x-3 gap-y-1.5 text-[12px] text-ink-2">
        {(<>
          <button type="button" onClick={() => showToast('Opened in Chrome. Click the download there and the extension hands the fresh link to this download.')} className="inline-flex items-center gap-1 font-[600] text-[var(--color-accent-ink)] underline-offset-2 hover:underline focus-visible:outline-2 focus-visible:outline-ring"><ExternalLink className="size-3.5" />Open the download page</button>
          <span className="text-ink-3">or</span>
          <button type="button" onClick={() => setUrl(`https://${d.host}/s/${Math.random().toString(36).slice(2, 6)}/${d.name}?expires=${Math.floor(Date.now() / 1000) + 86400}&sig=fresh`)} className="font-[600] text-[var(--color-accent-ink)] underline-offset-2 hover:underline focus-visible:outline-2 focus-visible:outline-ring">paste an example fresh link</button>
        </>)}
      </div>
    </form>
  );
}
function SavedAgo({ d }) {
  const now = useApp((s) => s.now);
  if (d.status !== 'downloading' || !d.savedAt) return null;
  const s = Math.max(1, Math.round((now - d.savedAt) / 1000));
  return <span title="Progress is saved every 2 seconds, so a crash, a force quit or a power cut loses at most a few seconds."> · progress saved {s} s ago</span>;
}

/* Windows 11 title bar: 32px, the 16px window icon 16px from the left edge, the title 16px after it in caption text,
   then minimise, maximise and close. In the app Electron draws the real caption buttons (titleBarStyle 'hidden' with
   titleBarOverlay), so snap layouts work; these are drawings. */
function CaptionGlyph({ k }) {
  return (
    <svg viewBox="0 0 10 10" className="size-2.5" aria-hidden fill="none" stroke="currentColor" strokeWidth="1">
      {k === 'min' && <path d="M0 5.5h10" />}
      {k === 'max' && <rect x="0.5" y="0.5" width="9" height="9" rx="1.5" />}
      {k === 'close' && <path d="M.6.6l8.8 8.8M9.4.6.6 9.4" />}
    </svg>
  );
}
function WinTitleBar() {
  return (
    <div className="ml-titlebar flex h-8 shrink-0 items-center select-none">
      <span className="flex pl-4"><AppIcon size={16} /></span>
      <span className="truncate pl-4 text-[12px] text-foreground">Mergelane</span>
      <span className="min-w-6 flex-1" />
      <div aria-hidden className="flex self-stretch">
        {[['min', 'Minimise'], ['max', 'Maximise'], ['close', 'Close']].map(([k, label]) => (
          <span key={k} title={label} className={cn('ml-cap grid w-[46px] place-items-center text-foreground', k === 'close' && 'ml-cap-close')}><CaptionGlyph k={k} /></span>
        ))}
      </div>
    </div>
  );
}

function AppWindow() {
  const [ref, w] = useWidth();
  const screen = useApp((s) => s.screen);
  const sheetOpen = useApp((s) => s.sheetOpen);
  const win = useWin();
  const contentRef = useRef(null);
  const sidebar = w >= 760;
  const split = w - (sidebar ? (win ? 248 : 236) : 0) >= 860;
  const compact = w < 520;
  const mobileSheet = w < 640;
  const upsell = useApp((s) => s.upsell);
  useEffect(() => { if (contentRef.current) contentRef.current.inert = sheetOpen || !!upsell; }, [sheetOpen, upsell]);
  // ⌘, (Ctrl+, on Windows) opens Settings, as in most desktop apps.
  useEffect(() => {
    const onKey = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === ',') { e.preventDefault(); useApp.getState().openSettings(); } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  return (
    <div
      ref={ref}
      className={cn('ml-window relative mt-4 flex overflow-hidden rounded-[14px] bg-window text-foreground shadow-[var(--shadow-window)] md:h-[800px] [&_button]:cursor-default [&_label]:cursor-default', win && 'flex-col')}
      aria-label={win ? 'Mergelane app window on Windows 11 (prototype)' : 'Mergelane app window (prototype)'}
      role="region"
    >
      {win && <WinTitleBar />}
      <div ref={contentRef} className={cn('flex min-w-0 flex-1', win && 'min-h-0')}>
        {sidebar && <Sidebar />}
        <div className={cn('ml-content flex min-w-0 flex-1 flex-col bg-background', win ? cn('ml-layer border-t border-[var(--border-subtle)]', sidebar && 'rounded-tl-[8px] border-l') : sidebar && 'ml-content-side rounded-l-[2px]')}>
          {!sidebar && <CompactBar />}
          {screen === 'downloads' && <DownloadsScreen split={split} compact={compact} />}
          {screen === 'dashboard' && <DashboardScreen />}
          {screen === 'history' && <HistoryScreen />}
          {screen === 'networks' && <NetworksScreen />}
          {screen === 'settings' && <SettingsScreen />}
        </div>
      </div>
      <NewDownloadSheet mobile={mobileSheet} />
      <QueueDoneNotice />
      <CrashOverlay />
      <UpsellDialog />
      <Toast />
    </div>
  );
}

/* ── identity ─────────────────────────────────────────────────────────────────────────
   The owner's design: a solid blue M on a charcoal tile, in four parts split by thin gaps (a wave leg, an oval under
   its crest, a band that wraps under the oval and rises into an arrow, and a wedge leg). Many connections, one faster lane. The icon is a file (brand/svg, brand/png), so the Dock,
   the About box and this page all show the same pixels. In the app: build/icon.icns and resources/trayTemplate*.png. */
function useIsDark() {
  const mode = useApp((s) => s.mode);
  const sys = useMedia('(prefers-color-scheme: dark)');
  return mode === 'dark' || (mode !== 'light' && sys);
}
/* The app icon at any size: vector above 64 px, pixel-fitted PNGs (at 2x) below. */
function AppIcon({ size = 64, variant = 'default', className, alt = '' }) {
  const v = variant;
  const src = size <= 64 ? `brand/png/icon-${v}-${size <= 16 ? 32 : size <= 32 ? 64 : 128}.png` : `brand/svg/icon-${v}.svg`;
  return <img src={src} width={size} height={size} alt={alt} aria-hidden={alt ? undefined : true} draggable={false} className={cn('shrink-0 select-none', className)} />;
}
function Wordmark({ className, style }) {
  return <span className={cn('leading-none font-[600] tracking-[-0.01em]', className)} style={{ fontFamily: "'Saira', 'Archivo', -apple-system, sans-serif", ...style }}>Mergelane</span>;
}

function Root() {
  const tick = useApp((s) => s.tick);
  const os = useApp((s) => s.os);
  const win = os === 'windows';
  const view = useApp((s) => s.view);
  // A theme the plan doesn't include shows as Porcelain; the choice itself is kept for when the plan comes back.
  const palette = useApp((s) => s.palette);
  const mode = useApp((s) => s.mode);
  const themesOk = useEnt().f['ui.premium_themes'];
  useEffect(() => {
    const effective = themesOk || FREE_THEMES.includes(palette) ? palette : 'porcelain';
    if (document.documentElement.getAttribute('data-palette') !== effective) applyAppearance(mode, effective, os);
  }, [themesOk, palette, mode, os]);
  useEffect(() => { const t = setInterval(tick, 1000); return () => clearInterval(t); }, [tick]);
  // Liquid Glass light. The rim's light angle turns toward the pointer while it's over the window, and a specular
  // spot follows it on whichever glass surfaces it is over. Paint only, once per frame at most; other themes skip it.
  useEffect(() => {
    const root = document.documentElement;
    // Refraction needs SVG filters inside backdrop-filter, which only Chromium (so Electron) draws.
    try { if (navigator.userAgentData && navigator.userAgentData.brands.some((b) => /Chromium/.test(b.brand))) root.setAttribute('data-refract', ''); } catch (e) {}
    const HOSTS = '.ml-window, .ml-surface, .ml-content, .ml-sheet, .bg-card, .ml-btn, .ml-field, .ml-notice';
    let raf = 0, last = null;
    const frame = () => {
      raf = 0;
      const e = last;
      if (!e || root.getAttribute('data-palette') !== 'liquid') return;
      const win = document.querySelector('.ml-window');
      if (win) {
        const r = win.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        const ang = inside ? Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI + 90 : 135;
        root.style.setProperty('--la', `${ang.toFixed(1)}deg`);
      }
      let el = e.target instanceof Element ? e.target.closest(HOSTS) : null;
      while (el) {
        const r = el.getBoundingClientRect();
        el.style.setProperty('--mx', `${(e.clientX - r.left).toFixed(0)}px`);
        el.style.setProperty('--my', `${(e.clientY - r.top).toFixed(0)}px`);
        el = el.parentElement ? el.parentElement.closest(HOSTS) : null;
      }
    };
    const onMove = (e) => { last = e; if (!raf) raf = requestAnimationFrame(frame); };
    document.addEventListener('pointermove', onMove, { passive: true });
    return () => { document.removeEventListener('pointermove', onMove); cancelAnimationFrame(raf); };
  }, []);
  // The daily automatic check, brought forward to a few seconds after opening so the notice can be seen.
  useEffect(() => { const t = setTimeout(() => { const s = useApp.getState(); if (s.update.auto && s.update.status === 'idle') s.checkForUpdates(); }, 5000); return () => clearTimeout(t); }, []);
  return (
    <>
      {/* Liquid Glass's desktop and refraction filter; display: none in every other theme. */}
      <div className="ml-wallpaper" aria-hidden="true">
        <span className="rb r1" /><span className="rb r2" /><span className="rb r3" /><span className="rb r4" />
        <span className="veil" /><span className="grain" />
      </div>
      <svg className="ml-fx" aria-hidden="true" focusable="false" width="0" height="0">
        <defs>
          <filter id="mlRefract" x="-10%" y="-10%" width="120%" height="120%" colorInterpolationFilters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.006 0.011" numOctaves="2" seed="11" result="noise" />
            <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
            <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G" />
          </filter>
          <linearGradient id="ml-g-wifi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-wifi)', stopOpacity: 0.95 }} /><stop offset="1" style={{ stopColor: 'var(--color-wifi)', stopOpacity: 0.5 }} /></linearGradient>
          <linearGradient id="ml-s-wifi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-wifi)', stopOpacity: 0.38 }} /><stop offset="1" style={{ stopColor: 'var(--color-wifi)', stopOpacity: 0 }} /></linearGradient>
          <linearGradient id="ml-l-wifi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style={{ stopColor: 'color-mix(in oklab, var(--color-wifi) 62%, var(--lane-tint))' }} /><stop offset="0.6" style={{ stopColor: 'var(--color-wifi)' }} /><stop offset="1" style={{ stopColor: 'var(--color-wifi)' }} /></linearGradient>
          <linearGradient id="ml-g-usb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-usb)', stopOpacity: 0.95 }} /><stop offset="1" style={{ stopColor: 'var(--color-usb)', stopOpacity: 0.5 }} /></linearGradient>
          <linearGradient id="ml-s-usb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-usb)', stopOpacity: 0.38 }} /><stop offset="1" style={{ stopColor: 'var(--color-usb)', stopOpacity: 0 }} /></linearGradient>
          <linearGradient id="ml-l-usb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style={{ stopColor: 'color-mix(in oklab, var(--color-usb) 62%, var(--lane-tint))' }} /><stop offset="0.6" style={{ stopColor: 'var(--color-usb)' }} /><stop offset="1" style={{ stopColor: 'var(--color-usb)' }} /></linearGradient>
          <linearGradient id="ml-g-ethernet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-ethernet)', stopOpacity: 0.95 }} /><stop offset="1" style={{ stopColor: 'var(--color-ethernet)', stopOpacity: 0.5 }} /></linearGradient>
          <linearGradient id="ml-s-ethernet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-ethernet)', stopOpacity: 0.38 }} /><stop offset="1" style={{ stopColor: 'var(--color-ethernet)', stopOpacity: 0 }} /></linearGradient>
          <linearGradient id="ml-l-ethernet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style={{ stopColor: 'color-mix(in oklab, var(--color-ethernet) 62%, var(--lane-tint))' }} /><stop offset="0.6" style={{ stopColor: 'var(--color-ethernet)' }} /><stop offset="1" style={{ stopColor: 'var(--color-ethernet)' }} /></linearGradient>
          <linearGradient id="ml-s-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style={{ stopColor: 'var(--color-accent-ink)', stopOpacity: 0.3 }} /><stop offset="1" style={{ stopColor: 'var(--color-accent-ink)', stopOpacity: 0 }} /></linearGradient>
        </defs>
      </svg>
      <header className="flex flex-col gap-2 pb-5">
        <div className="flex items-center gap-3"><AppIcon size={60} className="-my-1.5 -ml-1.5" /><h1 className="text-[34px] leading-[1.02] font-[720] tracking-[-0.025em] text-balance [font-stretch:86%]">Mergelane redesign</h1></div>
        <p className="max-w-[66ch] text-[14.5px] leading-[1.6] text-ink-2">A working prototype of a new look for Mergelane, written in the app’s own stack: React function components, Tailwind CSS v4 tokens and lucide icons. Switch between macOS and Windows 11 above the window. Click around: select downloads, filter them by date and type, add one, set speed limits and routes under Networks, drop the iPhone link, or open Settings at the bottom of the sidebar ({KEY(win, ',')}) to change the theme, the speed units, the browser extensions or check for an update. Switch this Mac’s plan above the window to see features unlock, or open the owner portal to edit plans and manage license keys. The buttons above the window also take Wi-Fi away, make a link expire, crash the app and finish the queue, so you can watch each one recover.</p>
      </header>
      <PrototypeControls />
      {view === 'portal' ? <PortalWindow /> : (<>
        {win && <WindowsNote />}
        <AppWindow key={os} />
      </>)}
      {view !== 'portal' && <BrandSection />}
      <ChangeList />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>

</body></html>
