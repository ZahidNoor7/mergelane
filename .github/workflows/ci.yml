name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every macOS job runs on xcode-27 (macOS 27, arm64): see docs/DECISIONS.md ADR-0004.
# Jobs for the app, daemon, packaging and simulated networks are added by their milestones.
jobs:
  repo-checks:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the repository checks
        run: bash scripts/ci/check-repo.test.sh
      - name: Check this repository
        run: bash scripts/ci/check-repo.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test the CI scripts
        run: node --test --experimental-test-coverage scripts/ci/*.test.mjs

  app-checks:
    runs-on: xcode-27
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Linting and typechecking need only the packages: skip the Electron download and native
      # rebuild that postinstall does.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  app-e2e-smoke:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:e2e:smoke
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14

  # Phase 1 acceptance criterion 1: build the DMG, audit it, install it like a user, reach ready.
  package:
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build the arm64 DMG (ad-hoc signed)
        # electron-builder skips signing on pull requests unless told otherwise. Ad-hoc signing uses
        # no secrets, so forcing it is safe on any pull request, including forks.
        env:
          CSC_FOR_PULL_REQUEST: 'true'
        run: npx electron-vite build && npx electron-builder --mac --publish never
      - name: Audit Electron fuses with REA
        run: node ../scripts/ci/audit-fuses.mjs dist/mac-arm64/Mergelane.app
      - name: Install from the DMG and reach the ready state
        run: |
          version=$(node -p "require('./package.json').version")
          bash ../scripts/ci/package-test.sh "dist/Mergelane-$version-arm64.dmg" "$version"
      - name: Upload the DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mergelane-dmg
          path: app/dist/Mergelane-*-arm64.dmg
          retention-days: 7
