appId: io.github.zahidnoor7.mergelane
productName: Mergelane
# Shown in the macOS About window and Finder's Get Info.
copyright: Copyright © 2026 Mergelane contributors
afterPack: scripts/check-torrent-package.mjs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # koffi ships prebuilds for every OS; each build keeps only the one it loads (network/deviceBinding.ts pins
  # per-link sockets with IP_BOUND_IF on macOS, IP_UNICAST_IF on Windows). ${os} is "mac" or "win", so the
  # second name is win32_x64 or win32_arm64 on Windows and matches nothing on macOS, which keeps
  # darwin_arm64 alone. electron-builder.win.yml drops darwin_arm64 from Windows builds.
  - '!node_modules/koffi/{src,vendor,doc}/**'
  - '!node_modules/koffi/build/koffi/!(darwin_arm64|${os}32_${arch})/**'
  # Mergelane uses TCP peers only. simple-peer is patched to use browser globals instead of loading
  # the native WebRTC polyfill; don't ship its unused native binaries.
  - '!node_modules/node-datachannel/**'
  - '!node_modules/webrtc-polyfill/**'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # yt-dlp, FFmpeg and Deno ship through extraResources below, not inside app.asar.
  - '!resources/bin/**'
  - '!resources/bin-win/**'
asarUnpack:
  - resources/**
# Licences ship inside the bundle (Contents/Resources), as CLAUDE.md requires.
extraResources:
  - from: ../LICENSE
    to: LICENSE
  - from: ../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  # The browser extension itself, built by `npm run build:extension` before packaging. Settings ›
  # Browser extensions copies it into Mergelane's folder for the user to load (ADR-0038).
  - from: extension/dist/chrome
    to: browser-extension/chrome
  - from: extension/dist/firefox
    to: browser-extension/firefox
mac:
  extraResources:
    # The system-wide merge helper, built from ../daemon before packaging (see the CI package job).
    # The app installs it once as a LaunchDaemon through an admin prompt (main/daemon/daemon.ts).
    - from: ../daemon/bin/mergelane-daemon
      to: mergelane-daemon
    # The browser extension's native messaging host (docs/BROWSER-BRIDGE.md, ADR-0021).
    - from: ../daemon/bin/mergelane-nmhost
      to: mergelane-nmhost
    # yt-dlp and FFmpeg, put in resources/bin by ../scripts/media-tools/fetch.mjs before packaging
    # (docs/MEDIA-TOOLS.md), with their licence texts. yt-dlp is a folder, its unpacked macOS build
    # (ADR-0031): yt-dlp_macos and its _internal files, copied whole (links kept) to
    # Contents/Resources/yt-dlp/, where every Mach-O file inside is re-signed. FFmpeg is Mergelane's
    # own LGPL build from FFmpeg's pinned source release (ADR-0028).
    - from: resources/bin/yt-dlp
      to: yt-dlp
    - from: resources/bin/ffmpeg
      to: ffmpeg
    # Deno, the JavaScript runtime yt-dlp runs YouTube's player challenges in (ADR-0026). Fetched the
    # same way; the app itself can't act as Node (ADR-0016). Re-signed with the hardened runtime and
    # entitlementsInherit, whose allow-jit V8 needs.
    - from: resources/bin/deno
      to: deno
    - from: resources/bin/licenses
      to: licenses
  # Only the zips go by this name: the dmg has its own (dmg.artifactName).
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  minimumSystemVersion: '27.0'
  # Ad-hoc signature ("-"): no Apple Developer ID yet (docs/DECISIONS.md ADR-0003). Every nested
  # binary is signed too, which Apple silicon requires before anything can run.
  # To switch to Developer ID later: set identity to the certificate name (or remove it and set
  # CSC_LINK/CSC_KEY_PASSWORD), and set notarize: true with the APPLE_API_* secrets.
  identity: '-'
  hardenedRuntime: true
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDownloadsFolderUsageDescription: Mergelane saves downloaded files to your Downloads folder.
    # Magnet links, .torrent and .nzb files can be opened with Mergelane, as one choice among
    # others: it's never made the default over a client the user already has (LSHandlerRank).
    # mergelane:// is Mergelane's own scheme, so registering it takes nothing from another app.
    - CFBundleURLTypes:
        - CFBundleURLName: Magnet link
          CFBundleURLSchemes: [magnet]
        - CFBundleURLName: Mergelane
          CFBundleURLSchemes: [mergelane]
      CFBundleDocumentTypes:
        - CFBundleTypeName: Torrent
          CFBundleTypeRole: Viewer
          LSHandlerRank: Alternate
          CFBundleTypeExtensions: [torrent]
          LSItemContentTypes: [org.bittorrent.torrent]
        - CFBundleTypeName: NZB
          CFBundleTypeRole: Viewer
          LSHandlerRank: Alternate
          CFBundleTypeExtensions: [nzb]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
# Windows 10 and 11, x64 and arm64 (ADR-0053), built on the Mac with electron-builder.win.yml, which adds the
# Windows-only file rules (docs/WINDOWS-PLAN.md). Unsigned for now: free signing is switched on later by config
# only.
win:
  executableName: Mergelane
  target:
    - target: nsis
      arch: [x64, arm64]
  extraResources:
    # Built by scripts/windows/build-helpers.mjs for each chip.
    - from: ../daemon/bin/win-${arch}/mergelane-daemon.exe
      to: mergelane-daemon.exe
    - from: ../daemon/bin/win-${arch}/mergelane-nmhost.exe
      to: mergelane-nmhost.exe
    # The Windows media tools for this chip, from scripts/media-tools/tools-windows-${arch}.json (W3, ADR-0057):
    # yt-dlp's unpacked Windows build (yt-dlp.exe beside _internal), Mergelane's own LGPL FFmpeg built on the
    # Mac with llvm-mingw, Deno, and their licence texts. app/src/main/media/mux/tools.ts WINDOWS_TOOL_PROGRAM
    # names them.
    - from: resources/bin-win/${arch}/yt-dlp
      to: yt-dlp
    - from: resources/bin-win/${arch}/ffmpeg.exe
      to: ffmpeg.exe
    - from: resources/bin-win/${arch}/deno.exe
      to: deno.exe
    - from: resources/bin-win/${arch}/licenses
      to: licenses
npmRebuild: false
# Electron fuses, flipped at package time, before signing. An REA audit of the first build found them
# all at Electron's defaults; with runAsNode on, anyone could run the signed app as a plain Node.js
# interpreter. The app never forks Node processes. It loads its UI with loadFile (file://), so
# grantFileProtocolExtraPrivileges stays at its default.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# The repository releases go to: scripts/release/local-release.mjs reads it. Builds never publish
# themselves (--publish never), and the app's update check doesn't use it (ADR-0036).
publish:
  provider: github
  owner: ZahidNoor7
  repo: mergelane
