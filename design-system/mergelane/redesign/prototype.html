<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mergelane Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one page column. Prototype controls, then a macOS window (sidebar | list | inspector), then the change list.
   Colour: a theme is a handful of seeds (ML_THEMES, below): window and sidebar grounds, ink, one accent and the three
   network colours, for light and for dark. Every other colour token is derived from those seeds right here, so a
   theme change reaches every surface, line, control, selection, focus ring and chart without per-component work.
   Type: Archivo for words and, at a condensed width, for every figure. Fragment Mono only for interface names and links. */
:root {
  --traffic-close: #FF5F57;
  --traffic-min: #FEBC2E;
  --traffic-max: #28C840;
  /* states keep their meaning in every theme */
  --color-danger: #BB2F28;
  --color-danger-bg: #FCEDEC;
  --color-danger-border: #F2C4C0;
  --color-warning: #8F5300;
  --color-warning-bg: #FBF1DF;
  --color-warning-border: #EED7A8;
  --lane-mark: rgb(255 255 255 / 0.6);
  --scrim: rgb(16 20 28 / 0.24);
  --shadow-window: 0 0 0 1px rgb(16 20 28 / 0.10), 0 2px 6px rgb(16 20 28 / 0.06), 0 32px 80px -28px rgb(16 20 28 / 0.40);
  --shadow-sheet: 0 0 0 1px rgb(16 20 28 / 0.10), 0 24px 60px -18px rgb(16 20 28 / 0.45);
  --shadow-raise: 0 1px 2px rgb(16 20 28 / 0.14), 0 0 0 0.5px rgb(16 20 28 / 0.10);
  /* how strongly ink shows through for lines and secondary text; High contrast raises these */
  --line: 14%; --line-subtle: 8%; --line-strong: 34%; --ink-2: 76%; --ink-3: 63%;
  --thumb-mix: 0%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-danger: #FF8B82; --color-danger-bg: #3A1D1C; --color-danger-border: #5C2C2A;
    --color-warning: #F0B35E; --color-warning-bg: #33260F; --color-warning-border: #5A4219;
    --lane-mark: rgb(0 0 0 / 0.38); --scrim: rgb(0 0 0 / 0.5);
    --shadow-window: 0 0 0 1px rgb(255 255 255 / 0.07), 0 32px 80px -24px rgb(0 0 0 / 0.75);
    --shadow-sheet: 0 0 0 1px rgb(255 255 255 / 0.08), 0 24px 60px -18px rgb(0 0 0 / 0.70);
    --shadow-raise: 0 1px 2px rgb(0 0 0 / 0.50), 0 0 0 0.5px rgb(255 255 255 / 0.08);
    --thumb-mix: 62%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-danger: #FF8B82; --color-danger-bg: #3A1D1C; --color-danger-border: #5C2C2A;
  --color-warning: #F0B35E; --color-warning-bg: #33260F; --color-warning-border: #5A4219;
  --lane-mark: rgb(0 0 0 / 0.38); --scrim: rgb(0 0 0 / 0.5);
  --shadow-window: 0 0 0 1px rgb(255 255 255 / 0.07), 0 32px 80px -24px rgb(0 0 0 / 0.75);
  --shadow-sheet: 0 0 0 1px rgb(255 255 255 / 0.08), 0 24px 60px -18px rgb(0 0 0 / 0.70);
  --shadow-raise: 0 1px 2px rgb(0 0 0 / 0.50), 0 0 0 0.5px rgb(255 255 255 / 0.08);
  --thumb-mix: 62%;
  color-scheme: dark;
}
/* Derived tokens. Declared again on .ml-surface, which re-grounds a region (the sidebar) on the theme's sidebar
   colours, so a dark sidebar in a light theme gets its own hovers, lines, ink and controls. */
:root, .ml-surface {
  --bg-secondary: var(--card);
  --bg-tertiary: color-mix(in oklab, var(--text) 5%, var(--bg));
  --sunken: color-mix(in oklab, var(--text) 4.5%, var(--bg));
  --input-bg: var(--card);
  --track-bg: color-mix(in oklab, var(--text) 10%, var(--bg));
  --hover: color-mix(in oklab, var(--color-accent) 6%, color-mix(in oklab, var(--text) 3%, var(--bg)));
  --selected: color-mix(in oklab, var(--color-accent) 15%, var(--bg));
  --text-secondary: color-mix(in oklab, var(--text) var(--ink-2), var(--bg));
  --text-tertiary: color-mix(in oklab, var(--text) var(--ink-3), var(--bg));
  --border: color-mix(in oklab, var(--text) var(--line), var(--bg));
  --border-subtle: color-mix(in oklab, var(--text) var(--line-subtle), var(--bg));
  --border-strong: color-mix(in oklab, var(--text) var(--line-strong), var(--bg));
  --control: color-mix(in oklab, var(--text) 52%, var(--bg));
  --focus: var(--color-accent);
  --icon-muted: color-mix(in oklab, var(--text) 24%, var(--bg));
  --scrollbar-thumb: color-mix(in oklab, var(--text) 22%, var(--bg));
  --switch-off: color-mix(in oklab, var(--text) 13%, var(--bg));
  --switch-on: var(--color-accent);
  --switch-thumb-on: var(--color-accent-onsolid);
  --switch-thumb-off: color-mix(in oklab, var(--text) var(--thumb-mix), var(--card));
  --color-accent-soft: color-mix(in oklab, var(--color-accent) 13%, var(--bg));
  --color-accent-ink: var(--accent-ink, var(--color-accent));
  --color-wifi-bg: color-mix(in oklab, var(--color-wifi) 14%, var(--bg));
  --color-usb-bg: color-mix(in oklab, var(--color-usb) 14%, var(--bg));
  --color-ethernet-bg: color-mix(in oklab, var(--color-ethernet) 14%, var(--bg));
}
.ml-surface { --bg: var(--sidebar); --text: var(--sidebar-ink); --card: var(--sidebar-card); --thumb-mix: var(--sidebar-thumb-mix); color: var(--text); }
html, body { background: var(--desk); color: var(--text); }
body {
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.page {
  box-sizing: border-box;
  width: 100%;
  max-width: 1280px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.boot { font-size: 14px; color: var(--text-secondary); padding-block: 24px; }
/* Lane markings drift along each network's lane while it carries bytes. */
@keyframes ml-flow { to { stroke-dashoffset: -12; } }
.ml-flow { animation: ml-flow 1s linear infinite; }
.ml-still { animation: none; }
@media (prefers-reduced-motion: reduce) {
  .ml-flow { animation: none; }
}
/* While the theme changes, colours ease for 220ms instead of jumping (no movement, so reduced motion keeps it). */
:root.ml-theme-fade, :root.ml-theme-fade *, :root.ml-theme-fade *::before, :root.ml-theme-fade *::after {
  transition: background-color 220ms ease, color 220ms ease, border-color 220ms ease, fill 220ms ease, stroke 220ms ease, box-shadow 220ms ease !important;
}
</style>

    dark: { desk: '#05070E', window: '#0C0F18', sidebar: '#141824', sidebarCard: '#1A1F2C', bg: '#0F131C', card: '#161B26', text: '#E4E7EE', accent: '#2F6FDB', accentOn: '#FFFFFF', accentInk: '#7FB0FF', wifi: '#9C8CFF', usb: '#36D6BC', ethernet: '#FF8A5C', netOn: '#0A0C14', ink2: '82%', ink3: '70%',

];
(function () {
  var NAMES = { desk: '--desk', window: '--window', sidebar: '--sidebar', sidebarInk: '--sidebar-ink', sidebarCard: '--sidebar-card', bg: '--bg', card: '--card', text: '--text',

    line: '--line', lineSubtle: '--line-subtle', lineStrong: '--line-strong', ink2: '--ink-2', ink3: '--ink-3' };
  function decl(m) {
    if (!m.sidebarInk) m.sidebarInk = m.text;
    var out = '';
    for (var k in NAMES) if (m[k]) out += NAMES[k] + ':' + m[k] + ';';
    out += '--color-wifi-onsolid:' + m.netOn + ';--color-usb-onsolid:' + m.netOn + ';--color-ethernet-onsolid:' + m.netOn + ';';
    out += '--sidebar-thumb-mix:' + (m.sidebarDark ? '62%' : '0%') + ';';
    return out;
  }
  var css = '';
  window.ML_THEMES.forEach(function (t) {
    var sel = ':root[data-palette="' + t.id + '"]';
    t.dark.sidebarDark = true;
    var d = decl(t.dark);
    css += sel + '{' + decl(t.light) + '}';
    css += '@media (prefers-color-scheme: dark){' + sel + ':not([data-theme="light"]){' + d + '}}';
    css += sel + '[data-theme="dark"]{' + d + '}';
  });
  var el = document.createElement('style');
  el.id = 'ml-themes';
  el.textContent = css;
  document.currentScript.after(el);
  // Theme before first paint: the viewer's saved choice, if any (prototype convenience only).
  var root = document.documentElement;
  var t = 'system', p = 'porcelain';
  try { t = localStorage.getItem('mergelane-redesign-theme') || 'system'; } catch (e) {}
  try { p = localStorage.getItem('mergelane-redesign-palette') || 'porcelain'; } catch (e) {}
  if (!window.ML_THEMES.some(function (x) { return x.id === p; })) p = 'porcelain';
  if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  root.setAttribute('data-palette', p);
  try { if (localStorage.getItem('mergelane-redesign-glass') === 'tinted') root.setAttribute('data-glass', 'tinted'); } catch (e) {}
  try { if (localStorage.getItem('mergelane-redesign-solid') === '1') root.setAttribute('data-solid', ''); } catch (e) {}
})();

<style>
/* ── Liquid Glass (macOS 27) ────────────────────────────────────────────────────────────────
   Soft, layered glass, built the way the reference canvas builds it:
   • a living desktop behind everything: a pastel wash, slow-drifting blurred colour ribbons, a veil and fine grain;
   • glass = a thin translucent fill + backdrop blur/saturation (+ SVG refraction in Chromium, i.e. Electron),
     a 1px conic rim that is bright where the light hits (the light angle follows the pointer), an inner glow,
     a top sheen and a specular spot that tracks the pointer;
   • layers: desktop → window (no backdrop filter, so the glass inside it still sees the desktop) → sidebar and
     content pane (glass) → cards, toolbar controls and sheets (glass on glass, each a little thicker);
   • glass buttons swell when pressed; content buttons press in.
   Soft, low-glare colours; every text pair still meets WCAG AA. Scoped to [data-palette="liquid"]: other themes
   are untouched. Reduce Transparency (system or in-app) makes every layer solid; Increase Contrast thickens fills
   and rims; Reduce Motion stops the drift and the springs. */
@property --la { syntax: '<angle>'; inherits: true; initial-value: 135deg; }

.ml-wallpaper, .ml-fx { display: none; }

:root[data-palette="liquid"] {
  --font-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', system-ui, 'Helvetica Neue', Arial, sans-serif;
  --la: 135deg;
  transition: --la 600ms cubic-bezier(0.22, 1, 0.36, 1);
  /* desktop */
  /* Crystal: a bright, clear desktop; colour passes through the glass instead of clouding it */
  --wp0: #F7FAFF; --wp1: #FBF8FF; --wp2: #F1FBFA;
  --ra1: #7D8BFF; --ra2: #C08BFF; --rb1: #5AA2FF; --rb2: #4FE0E6; --rc1: #FFB08A; --rc2: #FF8FC0; --rd1: #8FD0FF; --rd2: #B8F2FF;
  --ribbon-a: 0.46; --veil: rgb(255 255 255 / 0); --grain-a: 0.05;
  /* glass fills, thinnest to thickest (reference: clear .04, regular .22, thick .62) */
  --g-window: rgb(255 255 255 / 0.12);
  --g-reg: rgb(255 255 255 / 0.3);
  --g-side: rgb(255 255 255 / 0.28);
  --g-pane: rgb(255 255 255 / 0.42);
  --g-card: rgb(255 255 255 / 0.5);
  --g-thick: rgb(255 255 255 / 0.64);
  --g-solid-1: #F7F8FB; --g-solid-2: #FFFFFF;
  /* light on the material */
  --rim-hi: rgb(255 255 255 / 1); --rim-mid: rgb(255 255 255 / 0.75); --rim-lo: rgb(255 255 255 / 0.28);
  --sheen: rgb(255 255 255 / 0.5); --spec: rgb(255 255 255 / 0.85);
  --g-shadow: inset 0 1px 1px rgb(255 255 255 / 0.8), inset 0 -1px 1px rgb(255 255 255 / 0.3), inset 0 0 20px -6px rgb(255 255 255 / 0.5), 0 1px 2px rgb(20 24 50 / 0.06), 0 8px 26px -10px rgb(20 24 50 / 0.24);
  --g-lift: inset 0 1px 1px rgb(255 255 255 / 0.85), inset 0 0 24px -6px rgb(255 255 255 / 0.5), 0 2px 6px rgb(20 24 50 / 0.08), 0 30px 70px -22px rgb(20 24 50 / 0.42);
  --card-sh: inset 0 1px 1px rgb(255 255 255 / 0.75), inset 0 0 16px -8px rgb(255 255 255 / 0.55), 0 1px 1px rgb(20 24 50 / 0.04), 0 4px 18px -8px rgb(20 24 50 / 0.14);
  /* Apple-style fills and separators, translucent so the glass shows through */
  --card: var(--g-card);
  --border: rgb(60 60 67 / 0.13); --border-subtle: rgb(60 60 67 / 0.08); --border-strong: rgb(60 60 67 / 0.26);
  --sunken: rgb(118 118 128 / 0.08); --bg-tertiary: rgb(118 118 128 / 0.08); --input-bg: rgb(255 255 255 / 0.55);
  --track-bg: rgb(118 118 128 / 0.12); --hover: rgb(127 127 127 / 0.08);
  --selected: color-mix(in oklab, var(--color-accent) 14%, rgb(255 255 255 / 0.5));
  --switch-off: rgb(118 118 128 / 0.16); --switch-thumb-off: #FFFFFF;
  --fill-hover: rgb(127 127 127 / 0.1); --fill-selected: rgb(127 127 127 / 0.16); --track-glass: rgb(118 118 128 / 0.12);
  --scrim: rgb(40 48 80 / 0.12);
  --shadow-sheet: var(--g-lift);
  --bf-pane: blur(14px) saturate(2) brightness(1.08);
  --bf-sheet: blur(18px) saturate(1.9) brightness(1.06);
  /* charts: gradient fills from the network colours (defs in the .ml-fx svg), glass tooltips, quiet grids */
  --chart-wifi: url(#ml-g-wifi); --chart-usb: url(#ml-g-usb); --chart-ethernet: url(#ml-g-ethernet);
  --spark-wifi: url(#ml-s-wifi); --spark-usb: url(#ml-s-usb); --spark-ethernet: url(#ml-s-ethernet); --spark-a: 1;
  --spark-ink: url(#ml-s-ink); --spark-ink-line: var(--color-accent-ink);
  --lane-wifi: url(#ml-l-wifi); --lane-usb: url(#ml-l-usb); --lane-ethernet: url(#ml-l-ethernet); --lane-tint: #FFFFFF;
  --lane-start-wifi: color-mix(in oklab, var(--color-wifi) 62%, var(--lane-tint));
  --lane-start-usb: color-mix(in oklab, var(--color-usb) 62%, var(--lane-tint));
  --lane-start-ethernet: color-mix(in oklab, var(--color-ethernet) 62%, var(--lane-tint));
  --chart-grid: rgb(60 60 67 / 0.12); --chart-sep: rgb(255 255 255 / 0.9); --chart-total: #1E2233; --chart-glow: rgb(255 255 255 / 0.9);
}
/* The sidebar's tokens follow the glass too, not its seed colours. */
:root[data-palette="liquid"] .ml-surface {
  --card: var(--g-card); --border: rgb(60 60 67 / 0.13); --border-subtle: rgb(60 60 67 / 0.08); --border-strong: rgb(60 60 67 / 0.26);
  --sunken: rgb(118 118 128 / 0.08); --track-bg: rgb(118 118 128 / 0.12); --hover: rgb(127 127 127 / 0.08);
  --selected: color-mix(in oklab, var(--color-accent) 14%, rgb(255 255 255 / 0.5)); --switch-off: rgb(118 118 128 / 0.16); --switch-thumb-off: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root[data-palette="liquid"]:not([data-theme="light"]), :root[data-palette="liquid"]:not([data-theme="light"]) .ml-surface {
    --wp0: #05070E; --wp1: #0B0920; --wp2: #03121A;
    --ra1: #4B3BFF; --ra2: #9A3CFF; --rb1: #1E6BFF; --rb2: #00B3C7; --rc1: #FF5A3C; --rc2: #E0337A; --rd1: #2D7DFF; --rd2: #36C5F0;

/* One second of the world: each network's capacity wanders, is capped by its download limit, is shared between the
   downloads routed to it, and the bytes land. Torrents also upload to their peers, over the upload route and under
   each network's upload limit. dt = 0 only recomputes speeds (after any setting changes). */
function advance(s, dt) {
  const now = Date.now();
  const anyDown = s.links.some((l) => l.state === 'down');
  const links = s.links.map((l) => {
    if (l.state !== 'up' || !l.enabled) return { ...l, cap: 0, upCap: 0 };
    if (dt === 0) return { ...l, upCap: l.upCap || l.upBase };
    const target = l.base * (anyDown ? 1.14 : 1) + gauss() * l.jitter;
    const upTarget = l.upBase * (0.85 + Math.random() * 0.3);
    return { ...l, cap: clamp(l.cap * 0.55 + target * 0.45, l.base * 0.4, l.base * 1.7), upCap: clamp((l.upCap || l.upBase) * 0.6 + upTarget * 0.4, l.upBase * 0.5, l.upBase * 1.4) };
  });
  // What each network can give downloads right now: its capacity, under its download limit.
  const eff = Object.fromEntries(links.map((l) => [l.id, Math.min(l.cap, limitFor(s, l.id, 'down'))]));
  const route = routeFor(s, links, 'down');
  const usesOf = (d) => route || d.uses;
  const capTotal = links.reduce((a, l) => a + eff[l.id], 0);
  const scale = s.slowMode && capTotal > SLOW_CAP ? SLOW_CAP / capTotal : 1;
  const running = (d) => !s.empty && d.status === 'downloading';
  const weightOn = {};
  for (const l of links) weightOn[l.id] = s.downloads.filter((d) => running(d) && usesOf(d).includes(l.id)).reduce((a, d) => a + d.weight, 0);

  let downloads = s.downloads.map((d) => {
    if (!running(d)) return sum(d.speedByLink) > 0 || sum(d.upByLink) > 0 ? { ...d, speedByLink: {}, upByLink: {} } : d;
    const speedByLink = {};
    const bytesByLink = { ...d.bytesByLink };
    const uses = usesOf(d);
    for (const l of links) {
      if (!uses.includes(l.id)) continue;
      const W = weightOn[l.id];
      const sp = W > 0 ? ((eff[l.id] * scale * d.weight) / W) * (dt ? 0.94 + Math.random() * 0.06 : 0.97) : 0;
      speedByLink[l.id] = sp;
      bytesByLink[l.id] = (bytesByLink[l.id] || 0) + sp * dt;
    }
    const got = sum(bytesByLink);
    if (got >= d.size) {
      const f = d.size / got;
      for (const k in bytesByLink) bytesByLink[k] *= f;
      return { ...d, bytesByLink, speedByLink: {}, upByLink: {}, status: 'finished', completedAt: now };
    }
    return { ...d, bytesByLink, speedByLink, peak: Math.max(d.peak || 0, sum(speedByLink)) };
  });
  // The queue: a finished download makes room for the next one waiting (not the scheduled ones).
  let active = downloads.filter((d) => d.status === 'downloading').length;
  downloads = downloads.map((d) => {
    if (d.status === 'queued' && !d.startAt && active < (s.maxActive || MAX_ACTIVE) && !s.empty) { active++; return { ...d, status: 'downloading', addedAt: d.addedAt || now }; }
    return d;
  });

  // Uploads: each running torrent offers pieces to its peers. Shared over the upload route, never above a network's
  // upload capacity or its upload limit.
  const upRoute = routeFor(s, links, 'up');
  const upRoom = Object.fromEntries(links.map((l) => [l.id, Math.min(l.upCap, limitFor(s, l.id, 'up'))]));
  downloads = downloads.map((d) => {
    if (d.kind !== 'torrent' || !running(d)) return d;
    const via = (upRoute || d.uses).filter((id) => upRoom[id] > 0);
    const want = 2.6e6 * (dt ? 0.9 + Math.random() * 0.2 : 1);
    const room = via.reduce((a, id) => a + upRoom[id], 0);
    const upByLink = {};
    for (const id of via) { const u = Math.min(upRoom[id], room > 0 ? (want * upRoom[id]) / room : 0); upByLink[id] = u; upRoom[id] -= u; }
    return { ...d, upByLink };
  });

  const onLink = (id) => downloads.reduce((a, d) => a + ((d.speedByLink && d.speedByLink[id]) || 0), 0);
  const upOnLink = (id) => downloads.reduce((a, d) => a + ((d.upByLink && d.upByLink[id]) || 0), 0);
  const mergeOn = s.merge.state === 'on';
  const links2 = links.map((l) => {
    const speed = onLink(l.id);
    const up = upOnLink(l.id);
    const dl = limitFor(s, l.id, 'down'), ul = limitFor(s, l.id, 'up');
    const m = l.merged;
    return {
      ...l, speed, up,
      // "At limit" when the limit, not the network, is what holds the speed back.
      atLimit: { down: isFinite(dl) && weightOn[l.id] > 0 && l.cap > dl, up: isFinite(ul) && up >= ul * 0.97 },
      history: dt ? [...l.history.slice(1), speed] : l.history,
      merged: dt && mergeOn && l.state === 'up'
        ? { rx: clamp(m.rx * 0.6 + (5e5 + Math.random() * 2.2e6) * 0.4, 1e5, 4e6), tx: clamp(m.tx * 0.6 + (5e4 + Math.random() * 2.6e5) * 0.4, 1e4, 6e5), flows: clamp(m.flows + Math.round(gauss() * 2), 3, 24) }
        : m,
    };
  });
  const total = links2.reduce((a, l) => a + l.speed, 0);
  const today = { ...s.today };
  if (dt) for (const l of links2) today[l.id] += l.speed * dt;
  const mergedBps = links2.reduce((a, l) => a + (l.state === 'up' ? l.merged.rx + l.merged.tx : 0), 0);
  const usage = dt ? nextUsage(s.usage, total, mergedBps, mergeOn) : s.usage;
  return { now, links: links2, downloads, today, peak: Math.max(s.peak, total), usage, route };
}

    if (reduced || cur.current.length !== targets.length) { cur.current = targets; setVals(targets); return undefined; }
    let last = performance.now();

      const dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      const a = 1 - Math.exp(-dt / 0.16);

      const settled = next.every((v, i) => Math.abs(v - tgt.current[i]) < 0.05);

  primary: 'bg-primary text-primary-foreground hover:bg-primary/88',
  secondary: 'bg-secondary text-foreground shadow-[inset_0_0_0_1px_var(--border)] hover:bg-hover',
  ghost: 'text-ink-2 hover:bg-hover hover:text-foreground',
  destructive: 'bg-destructive-soft text-destructive shadow-[inset_0_0_0_1px_var(--color-danger-border)]',
};
const BUTTON_SIZE = {
  sm: 'h-7 gap-1.5 px-3 text-[12.5px] [&_svg]:size-3.5',
  md: 'h-8 gap-1.5 px-3.5 text-[13px] [&_svg]:size-4',
  icon: 'size-8 [&_svg]:size-4',
  'icon-sm': 'size-7 [&_svg]:size-3.5',
};
const Button = React.forwardRef(function Button({ variant = 'secondary', size = 'md', className, ...props }, ref) {
  return (
    <button
      ref={ref}
      type="button"
      className={cn(
        'ml-btn inline-flex shrink-0 items-center justify-center rounded-full font-[580] whitespace-nowrap select-none', `ml-btn-${variant}`,
        'transition-[background-color,scale,opacity] duration-100 ease-out motion-safe:active:scale-[0.96]',
        'focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring disabled:pointer-events-none disabled:opacity-45 [&_svg]:shrink-0',
        BUTTON_VARIANT[variant], BUTTON_SIZE[size], className
      )}
      {...props}
    />
  );
});

/* A switch whose knob stretches while pressed, as macOS's does. */
function Switch({ checked, onCheckedChange, disabled, className, ...props }) {
  return (
    <button
      type="button"
      role="switch"
      aria-checked={checked}
      disabled={disabled}
      onClick={() => onCheckedChange(!checked)}
      className={cn(
        'ml-switch group relative inline-flex h-[22px] w-[38px] shrink-0 items-center rounded-full p-[3px] transition-colors duration-150',
        'focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring disabled:opacity-45',
        checked ? 'bg-[var(--switch-on)]' : 'bg-[var(--switch-off)] shadow-[inset_0_0_0_1px_var(--control)]',
        className
      )}
      {...props}
    >
      <span
        aria-hidden
        className={cn(
          'ml-switch-thumb block h-4 w-4 rounded-full shadow-[var(--shadow-raise)] transition-[translate,width] duration-200 ease-[cubic-bezier(0.25,1,0.5,1)] group-active:w-5',
          checked ? 'translate-x-4 bg-[var(--switch-thumb-on)] group-active:translate-x-3' : 'translate-x-0 bg-[var(--switch-thumb-off)]'
        )}
      />
    </button>
  );
}

/* Segmented control. Every theme shows the pressed segment raised; Liquid Glass instead draws one thumb that slides
   to it (and turns to glass while moving). The thumb is display: none in the other themes. */
function Segmented({ label, value, onChange, options, className }) {
  const trackRef = useRef(null);
  const thumbRef = useRef(null);
  const first = useRef(true);
  const key = options.map((o) => `${o.value}:${o.label}:${o.count ?? ''}`).join('|');
  useLayoutEffect(() => {
    const track = trackRef.current, thumb = thumbRef.current;
    if (!track || !thumb) return undefined;
    const place = (animate) => {
      const btn = track.querySelector('button[aria-pressed="true"]');
      if (!btn) { thumb.setAttribute('data-hidden', ''); return; }
      thumb.removeAttribute('data-hidden');
      if (!animate) thumb.style.transition = 'none';
      thumb.style.setProperty('--x', `${btn.offsetLeft}px`);
      thumb.style.setProperty('--w', `${btn.offsetWidth}px`);
      if (!animate) { void thumb.offsetWidth; thumb.style.transition = ''; }
    };
    place(!first.current);
    let t = 0;
    if (!first.current) {
      thumb.setAttribute('data-moving', '');
      t = setTimeout(() => thumb.removeAttribute('data-moving'), 260);
    }
    first.current = false;
    const ro = new ResizeObserver(() => place(false));
    ro.observe(track);
    return () => { clearTimeout(t); ro.disconnect(); };
  }, [value, key]);
  return (
    <div ref={trackRef} role="group" aria-label={label} className={cn('ml-seg relative inline-flex shrink-0 items-center gap-0.5 rounded-full bg-sunken p-[3px] shadow-[inset_0_0_0_1px_var(--border-subtle)]', className)}>
      <span ref={thumbRef} aria-hidden className="ml-seg-thumb" />
      {options.map((o) => (
        <button
          key={o.value}
          type="button"
          aria-pressed={value === o.value}
          aria-label={o.ariaLabel}
          onClick={() => onChange(o.value)}
          className={cn(
            'inline-flex h-[26px] items-center gap-1.5 rounded-full px-2.5 text-[12.5px] font-[580] whitespace-nowrap text-ink-2 transition-colors duration-100',
            'hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-ring',
            'aria-pressed:bg-card aria-pressed:text-foreground aria-pressed:shadow-[var(--shadow-raise)] [&_svg]:size-3.5'
          )}
        >
          {o.icon}
          {o.label}
          {o.count !== undefined && <span className="figures font-[500] text-ink-3">{o.count}</span>}
        </button>
      ))}
    </div>
  );
}

function Tag({ icon, children }) {
  return (
    <span className="inline-flex h-5 shrink-0 items-center gap-1 rounded-full bg-sunken px-2 text-[11.5px] font-[580] whitespace-nowrap text-ink-2 shadow-[inset_0_0_0_1px_var(--border)] [&_svg]:size-3">
      {icon}
      {children}
    </span>
  );
}

function Speed({ bps, unit, className, dash = false }) {
  if (dash) return <span className={cn('figures text-ink-3', className)}>—</span>;
  const [v, u] = fmtSpeed(bps, unit);
  return (
    <span className={cn('figures whitespace-nowrap', className)}>
      {v}
      <span className="ml-[0.3em] text-[max(11px,0.5em)] font-[540] tracking-normal text-ink-3">{u}</span>
    </span>
  );
}

function LinkTile({ kind, size = 28, dim = false }) {
  const Icon = KIND_ICON[kind];
  return (
    <span
      aria-hidden
      className="inline-flex shrink-0 items-center justify-center rounded-[32%] transition-opacity duration-200"
      style={{ width: size, height: size, background: `var(--color-${kind})`, color: `var(--color-${kind}-onsolid)`, opacity: dim ? 0.38 : 1 }}
    >
      <Icon className="size-[56%]" strokeWidth={2.25} />
    </span>

}

function Swatch({ kind, className }) {
  return <span aria-hidden className={cn('inline-block h-1.5 w-3 shrink-0 rounded-full', className)} style={{ background: `var(--color-${kind})` }} />;
}

function SectionTitle({ children, id, aside }) {
  return (
    <div className="flex min-h-7 flex-wrap items-center gap-x-3 gap-y-1">
      <h3 id={id} className="text-[13px] font-[650] tracking-[-0.005em] text-foreground">{children}</h3>
      {aside && <div className="ml-auto flex items-center gap-2">{aside}</div>}
    </div>

}

function TrafficLights() {
  return (
    <div aria-hidden className="flex items-center gap-2">
      <span className="size-3 rounded-full bg-[var(--traffic-close)]" />
      <span className="size-3 rounded-full bg-[var(--traffic-min)]" />
      <span className="size-3 rounded-full bg-[var(--traffic-max)]" />
    </div>

}

/* ── the confluence: each network is a lane as thick as its speed, and the lanes merge into one road ─────── */
function Confluence({ lanes, unit, compact = false, idle = false, label = 'Merged speed', caption }) {
  const reduced = useReducedMotion();
  const [outerRef, outerW] = useWidth();
  const [svgRef, w] = useWidth();
  const stacked = outerW > 0 && outerW < 440;
  const rowH = compact ? 32 : 40;
  const H = Math.max(lanes.length * rowH, compact ? 64 : 104);
  const pad = (H - lanes.length * rowH) / 2;
  const maxBand = H * 0.66;
  const k = maxBand / CAPACITY;
  // A lane never outgrows its row, so lanes can't overlap where they start.
  const maxLane = rowH - 6;
  const targets = lanes.map((l) => (idle || l.down || !l.on ? 0 : Math.min(l.speed * k, maxLane)));
  const thick = useEasedArray(targets, reduced);
  const total = lanes.reduce((a, l) => a + (l.down || !l.on ? 0 : l.speed), 0);
  const W = Math.max(60, w);
  // Room for the widest round cap at each lane's start, inside the drawing.
  const x0 = maxLane / 2 + 2;
  const mergeX = Math.round(W * 0.6);
  const xEnd = W - 1;
  const xm = (x0 + mergeX) / 2;
  const gap = 2;
  const drawn = thick.map((t) => (t > 0.8 ? t : 0));
  const live = drawn.filter(Boolean).length;
  const bandH = drawn.reduce((a, t) => a + t, 0) + gap * Math.max(0, live - 1);
  let cursor = H / 2 - bandH / 2;
  const geo = lanes.map((l, i) => {
    const t = drawn[i];
    const ys = pad + (i + 0.5) * rowH;
    const c = t ? cursor + t / 2 : H / 2;
    if (t) cursor += t + gap;
    const h = t / 2;
    return {
      t, ys,
      center: `M${x0},${ys} C${xm},${ys} ${xm},${c} ${mergeX},${c} L${xEnd},${c}`,
      approach: `M${x0},${ys} C${xm},${ys} ${xm},${H / 2} ${mergeX},${H / 2}`,
      ribbon: t
        ? `M${x0},${ys - h} C${xm},${ys - h} ${xm},${c - h} ${mergeX},${c - h} L${xEnd},${c - h} L${xEnd},${c + h} L${mergeX},${c + h} C${xm},${c + h} ${xm},${ys + h} ${x0},${ys + h} Z`
        : null,
    };
  });
  const flowing = !idle && !reduced;

  const totalBlock = (
    <div className="flex min-w-[7.5rem] flex-col gap-1">
      <span className="text-[12px] font-[580] text-ink-2">{label}</span>
      {idle ? (
        <span className="figures text-[40px] leading-[0.9] font-[680] text-ink-3">—</span>
      ) : (
        <Speed bps={total} unit={unit} className={cn('leading-[0.9] font-[700] tracking-[-0.02em]', compact ? 'text-[34px]' : 'text-[46px]')} />
      )}
      {caption && <span className="text-[12px] leading-snug text-ink-2">{caption}</span>}
    </div>
  );

  return (
    <div ref={outerRef} className={cn('grid items-center gap-x-4 gap-y-3', stacked ? 'grid-cols-[auto_minmax(0,1fr)]' : 'grid-cols-[auto_minmax(0,1fr)_auto]')}>
      {stacked && <div className="col-span-2">{totalBlock}</div>}
      <ul className="flex flex-col" style={{ paddingBlock: pad }} aria-label="Networks in this merge">
        {lanes.map((l) => (
          <li key={l.id} style={{ height: rowH }} className="flex flex-col items-end justify-center text-right">
            <span className="text-[12.5px] leading-tight font-[620] whitespace-nowrap">{l.name}</span>
            <span className="flex items-center gap-1.5 text-[11.5px] leading-tight whitespace-nowrap text-ink-3">
              {l.down ? (
                <span className="inline-flex items-center gap-1 text-destructive"><Unplug className="size-3" />Dropped</span>
              ) : !l.on ? (
                <span>{l.note || (idle ? 'Idle' : 'Off')}</span>
              ) : (
                <>
                  {l.limited && <Gauge className="size-3 text-ink-2" aria-label="at its speed limit" />}
                  <Speed bps={l.speed} unit={unit} className="text-[12px] font-[600] text-ink-2" />
                </>
              )}
              {!compact && <span className="font-mono text-[11px]">{l.id}</span>}
            </span>
          </li>
        ))}
      </ul>
      <div ref={svgRef} className="min-w-0">
        <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} aria-hidden className="block overflow-visible">
          {geo.map((g, i) => {
            const l = lanes[i];
            const color = idle ? 'var(--icon-muted)' : l.down ? 'var(--color-danger)' : `var(--color-${l.kind})`;
            if (!g.t) {
              return (
                <g key={l.id}>
                  <path d={g.approach} fill="none" stroke={color} strokeWidth={1.5} strokeDasharray="2 5" strokeLinecap="round" opacity={l.down ? 0.8 : 1} />
                  <circle cx={x0} cy={g.ys} r={3} fill={color} />
                </g>
              );
            }
            const pxPerSec = 6 + (l.speed / 1e6) * 1.8;
            const dur = Math.round((12 / pxPerSec) * 20) / 20;
            return (
              <g key={l.id}>
                <path d={g.ribbon} fill={color} style={idle || l.down ? undefined : { fill: `var(--lane-${l.kind}, ${color})` }} />
                <circle cx={x0} cy={g.ys} r={g.t / 2} fill={color} style={idle || l.down ? undefined : { fill: `var(--lane-start-${l.kind}, ${color})` }} />
                {g.t >= 5 && (
                  <path
                    d={g.center}
                    fill="none"
                    stroke="var(--lane-mark)"
                    strokeWidth={Math.max(1, g.t * 0.14)}
                    strokeDasharray="4 8"
                    strokeLinecap="round"
                    className={cn('ml-flow', !flowing && 'ml-still')}
                    style={{ animationDuration: `${dur}s` }}
                  />
                )}
              </g>
            );
          })}
          {(idle || live === 0) && <path d={`M${mergeX},${H / 2} L${xEnd},${H / 2}`} stroke="var(--icon-muted)" strokeWidth={1.5} strokeDasharray="2 5" strokeLinecap="round" />}
        </svg>
      </div>
      {!stacked && totalBlock}
    </div>
  );
}

/* ── download pieces ─────────────────────────────────────────────────────────────────── */
function FileGlyph({ d, size = 34 }) {
  const Icon = GLYPH[d.glyph] || Package;
  return (
    <span aria-hidden className="inline-flex shrink-0 items-center justify-center rounded-[10px] bg-sunken text-ink-2 shadow-[inset_0_0_0_1px_var(--border)]" style={{ width: size, height: size }}>
      <Icon className="size-[48%]" strokeWidth={1.75} />
    </span>
  );
}

function KindTags({ d }) {
  if (d.kind === 'torrent') return <Tag icon={<Magnet />}>Torrent</Tag>;
  if (d.kind === 'video') return (<><Tag icon={<Film />}>{d.source}</Tag><Tag>{d.quality}</Tag></>);
  return null;
}

/* Each network's share of the file, in its colour, with a 2px gap between shares. */
function SplitBar({ d, links, height = 6, dim = false }) {
  const segs = links.map((l) => ({ ...l, frac: (d.bytesByLink[l.id] || 0) / d.size })).filter((s) => s.frac > 0.0004);
  const pct = Math.floor((received(d) / d.size) * 100);
  const text = `${pct}% done. ` + segs.map((s) => `${s.name} ${Math.round(s.frac * 100)}%`).join(', ');
  return (
    <div
      role="progressbar"
      aria-label={`${d.name}, by network`}
      aria-valuemin={0}
      aria-valuemax={100}
      aria-valuenow={pct}
      aria-valuetext={text}
      className={cn('flex w-full gap-[2px] overflow-hidden rounded-full bg-track transition-opacity duration-200', dim && 'opacity-45')}
      style={{ height }}
    >
      {segs.map((s) => (
        <span key={s.id} className="h-full first:rounded-l-full motion-safe:transition-[width] motion-safe:duration-700 motion-safe:ease-out" style={{ width: `${s.frac * 100}%`, background: `var(--color-${s.kind})` }} />
      ))}
    </div>
  );
}

function rowMeta(d, now) {
  const got = received(d);
  const sp = speedOf(d);
  const pct = Math.floor((got / d.size) * 100);
  if (d.status === 'finished') return [fmtBytes(d.size), d.host || d.source, `Finished ${fmtAgo(now - d.completedAt)}`];
  if (d.status === 'downloading') return [`${pct}%`, `${fmtBytes(got)} of ${fmtBytes(d.size)}`, sp > 0 ? `${fmtEta((d.size - got) / sp)} left` : 'Starting'];
  if (d.status === 'paused') return [`Paused at ${pct}%`, `${fmtBytes(got)} of ${fmtBytes(d.size)}`];
  return [d.startAt ? `Starts at ${d.startAt}` : 'Waiting for a turn', fmtBytes(d.size)];
}

function RowAction({ d }) {
  const toggle = useApp((s) => s.toggleDownload);
  if (d.status === 'finished') return null;
  const running = d.status === 'downloading';
  const label = running ? 'Pause' : d.status === 'queued' ? 'Start now' : 'Resume';
  return (
    <Button variant="ghost" size="icon-sm" aria-label={`${label} ${d.name}`} title={label} onClick={() => toggle(d.id)}>
      {running ? <Pause /> : <Play />}
    </Button>
  );
}

function DownloadRow({ d, links, unit, now, selected, onOpen }) {
  const meta = rowMeta(d, now);
  const finished = d.status === 'finished';
  return (
    <li className={cn('group relative flex items-center gap-3 rounded-[12px] px-2.5 py-2.5 transition-colors duration-100', selected ? 'bg-selected' : 'hover:bg-hover active:bg-selected')}>
      <FileGlyph d={d} />
      <div className="flex min-w-0 flex-1 flex-col gap-1.5">
        <div className="flex min-w-0 items-center gap-2">
          <button
            type="button"
            onClick={() => onOpen(d.id)}
            aria-current={selected ? 'true' : undefined}
            className="min-w-0 truncate text-left text-[13.5px] leading-tight font-[580] outline-none after:absolute after:inset-0 after:rounded-[12px] focus-visible:after:outline-2 focus-visible:after:-outline-offset-2 focus-visible:after:outline-ring"
          >
            {d.name}
          </button>
          <span className="hidden shrink-0 items-center gap-1.5 @md:flex"><KindTags d={d} /></span>
        </div>
        {!finished && <SplitBar d={d} links={links} dim={d.status !== 'downloading'} />}
        <p className="flex min-w-0 gap-x-3 overflow-hidden text-[12px] leading-tight whitespace-nowrap text-ink-2">
          {meta.map((m, i) => <span key={i} className={cn(i > 0 && 'truncate', i === 1 && finished && 'font-mono text-[11.5px]')}>{m}</span>)}
        </p>
      </div>
      <div className="relative z-10 flex shrink-0 items-center gap-1">
        {d.status === 'downloading' && <Speed bps={speedOf(d)} unit={unit} className="hidden min-w-[5.5rem] text-right text-[17px] font-[650] @sm:inline" />}
        <RowAction d={d} />
      </div>
    </li>
  );
}

const GROUPS = [
  ['downloading', 'Downloading'],
  ['queued', 'Waiting'],
  ['paused', 'Paused'],
  ['finished', 'Finished'],
];
const IN_PROGRESS = ['downloading', 'queued', 'paused'];

/* Chunk, piece or segment map: rows of capsule dashes like lane markings, each in the colour of the
   network that fetched it. Point at one, or focus the map and use the arrow keys. */
function buildCells(d, links, N, route) {
  const p = received(d) / d.size;
  const shares = links.filter((l) => (d.bytesByLink[l.id] || 0) > 0).map((l) => ({ l, w: d.bytesByLink[l.id] }));
  const W = shares.reduce((a, s) => a + s.w, 0) || 1;
  const pick = (r) => { let acc = 0; for (const s of shares) { acc += s.w / W; if (r <= acc) return s.l; } return shares.length ? shares[shares.length - 1].l : links[0]; };
  const lanes = [];
  const routed = (d.status !== 'finished' && route) || d.uses;
  for (const l of links) if (routed.includes(l.id) && l.state === 'up') for (let k = 0; k < Math.min(3, d.streams[l.id] || 1); k++) lanes.push(l);
  const activeN = d.status === 'downloading' || d.status === 'paused' ? Math.min(lanes.length, N) : 0;
  const exact = d.status === 'finished' ? N : p * N;
  const doneN = d.status === 'finished' ? N : clamp(Math.floor(exact - activeN * 0.5), 0, N);
  const order = Array.from({ length: N }, (_, i) => i);
  if (d.kind === 'torrent') order.sort((a, b) => hash01(a, 3) - hash01(b, 3));
  const cells = new Array(N);
  order.forEach((idx, rank) => {
    if (rank < doneN) cells[idx] = { state: 'done', link: pick(hash01(idx, d.id.length * 7)) };
    else if (rank < doneN + activeN) {
      const j = rank - doneN;
      cells[idx] = { state: 'active', link: lanes[j % lanes.length], fill: clamp(((exact - doneN) / Math.max(1, activeN)) * (1.7 - (j * 1.4) / Math.max(1, activeN)), 0.08, 0.92) };
    } else cells[idx] = { state: 'pending' };
  });
  return cells;
}

function LaneMap({ d, links }) {
  const N = clamp(Math.round(d.size / d.chunk), 8, 160);
  const word = d.kind === 'torrent' ? 'piece' : d.kind === 'video' ? 'segment' : 'chunk';
  const Word = word[0].toUpperCase() + word.slice(1);
  const bucket = Math.floor((received(d) / d.size) * N * 3);
  const route = useApp((s) => s.route);
  const cells = useMemo(() => buildCells(d, links, N, route), [d.id, bucket, d.status, N, links.map((l) => l.state).join(), String(route)]);
  const [cursor, setCursor] = useState(null);
  const [ref, w] = useWidth();
  const cols = Math.max(8, Math.floor((w + 4) / 18));
  const readoutId = useId();
  const used = links.filter((l) => d.uses.includes(l.id) || (route || []).includes(l.id) || (d.bytesByLink[l.id] || 0) > 0);
  const cell = cursor !== null ? cells[cursor] : null;
  const readout = cell
    ? `${Word} ${cursor + 1} of ${N}: ${cell.state === 'done' ? `fetched over ${cell.link.name} (${cell.link.id})` : cell.state === 'active' ? `in progress over ${cell.link.name} (${cell.link.id})` : 'not fetched yet'}`
    : `${N} ${word}s of about ${fmtBytes(d.chunk)}. Point at one, or focus the map and use the arrow keys.`;
  const onKeyDown = (e) => {
    const moves = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols };
    if (e.key in moves) { e.preventDefault(); setCursor((c) => clamp((c ?? -1) + (c === null ? 1 : moves[e.key]), 0, N - 1)); }
    else if (e.key === 'Home') { e.preventDefault(); setCursor(0); }
    else if (e.key === 'End') { e.preventDefault(); setCursor(N - 1); }
    else if (e.key === 'Escape') setCursor(null);
  };
  return (
    <section aria-label={`${Word}s`} className="flex flex-col gap-2.5">
      <SectionTitle aside={<span className="flex flex-wrap items-center gap-x-3 gap-y-1">{used.map((l) => <span key={l.id} className="inline-flex items-center gap-1.5 text-[12px] text-ink-2"><Swatch kind={l.kind} />{l.name}</span>)}</span>}>
        {Word}s
      </SectionTitle>
      <div
        ref={ref}
        tabIndex={0}
        role="group"
        aria-label={`${Word} map`}
        aria-describedby={readoutId}
        onKeyDown={onKeyDown}
        onBlur={() => setCursor(null)}
        onPointerLeave={() => setCursor(null)}
        className="grid gap-x-1 rounded-md outline-none focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ring"
        style={{ gridTemplateColumns: `repeat(${cols}, minmax(0, 1fr))` }}
      >
        {cells.map((c, i) => {
          const color = c.link ? `var(--color-${c.link.kind})` : null;
          return (
            <span key={i} onPointerEnter={() => setCursor(i)} className="flex h-3.5 items-center">
              <span
                className="relative h-1.5 w-full overflow-hidden rounded-full"
                style={{
                  background: c.state === 'done' ? color : 'var(--track-bg)',
                  boxShadow: c.state === 'active' ? `0 0 0 1px ${color}` : undefined,
                  outline: cursor === i ? '2px solid var(--focus)' : undefined,
                  outlineOffset: 2,
                  opacity: c.state === 'active' && d.status === 'paused' ? 0.5 : 1,
                }}
              >
                {c.state === 'active' && <span className="absolute inset-y-0 left-0" style={{ width: `${c.fill * 100}%`, background: color }} />}
              </span>
            </span>
          );
        })}
      </div>
      <p id={readoutId} aria-live="polite" className="min-h-[1.5em] text-[12px] leading-snug text-ink-2">{readout}</p>
    </section>
  );
}

function Stat({ label, children }) {
  return (
    <div className="flex min-w-0 flex-col gap-0.5">
      <dt className="text-[12px] text-ink-3">{label}</dt>
      <dd className="figures truncate text-[17px] leading-tight font-[640]">{children}</dd>
    </div>
  );
}

function Inspector({ d, onBack }) {
  const links = useApp((s) => s.links);
  const unit = useApp((s) => s.unit);
  const now = useApp((s) => s.now);
  const toggle = useApp((s) => s.toggleDownload);
  const remove = useApp((s) => s.removeDownload);
  const [confirming, setConfirming] = useState(false);
  useEffect(() => setConfirming(false), [d.id]);
  const route = useApp((s) => s.route);
  const limits = useApp((s) => s.limits);
  // Networks it can use now (the download route overrides the download's own choice), plus any that already carried part of it.
  const routed = d.status !== 'finished' && route ? route : d.uses;
  const used = links.filter((l) => routed.includes(l.id) || (d.bytesByLink[l.id] || 0) > 0);
  const got = received(d);
  const sp = speedOf(d);
  const up = sum(d.upByLink);
  const running = d.status === 'downloading';
  const pct = Math.floor((got / d.size) * 100);
  const lanes = used.map((l) => ({ id: l.id, name: l.name, kind: l.kind, speed: (d.speedByLink && d.speedByLink[l.id]) || 0, down: l.state === 'down', on: running && l.enabled && routed.includes(l.id), limited: running && routed.includes(l.id) && l.atLimit && l.atLimit.down, note: d.status !== 'finished' && !routed.includes(l.id) ? 'Not used' : null }));
  const statusWord = { downloading: 'Speed', paused: 'Paused', queued: d.startAt ? `Starts at ${d.startAt}` : 'Waiting for a turn', finished: 'Finished' }[d.status];
  const linkNoun = d.kind === 'torrent' ? 'peers' : d.kind === 'video' ? 'streams' : 'streams';
  return (
    <div className="flex flex-col gap-6 p-4 @container">
      {onBack && (
        <Button variant="ghost" size="sm" className="-ml-2 self-start" onClick={onBack}><ChevronLeft />Downloads</Button>
      )}
      <header className="flex items-start gap-3">
        <FileGlyph d={d} size={40} />
        <div className="flex min-w-0 flex-1 flex-col gap-1.5">
          <h3 className="text-[15px] leading-snug font-[650] tracking-[-0.01em] break-words">{d.name}</h3>
          <div className="flex flex-wrap items-center gap-1.5">
            <KindTags d={d} />
            {d.host && <span className="font-mono text-[11.5px] text-ink-2">{d.host}</span>}
          </div>
          <p className="text-[12px] text-ink-3">Saving to ~/Downloads</p>
        </div>
      </header>

      {d.status !== 'finished' && (
        <Confluence compact lanes={lanes} unit={unit} idle={!running} label={statusWord} caption={running && sp > 0 ? `${fmtEta((d.size - got) / sp)} left` : null} />
      )}

      <dl className="grid grid-cols-2 gap-x-4 gap-y-3 @sm:grid-cols-4">
        <Stat label="Done">{d.status === 'finished' ? '100%' : `${pct}%`}</Stat>
        <Stat label="Received">{fmtBytes(got)}</Stat>
        <Stat label={d.kind === 'torrent' ? 'Peers' : d.kind === 'video' ? 'Quality' : 'Size'}>{d.kind === 'torrent' ? d.peers : d.kind === 'video' ? d.quality : fmtBytes(d.size)}</Stat>
        <Stat label={d.kind === 'torrent' && running ? 'Uploading' : 'Peak'}>{d.kind === 'torrent' && running ? fmtSpeedText(up, unit) : d.peak ? fmtSpeedText(d.peak, unit) : '—'}</Stat>
      </dl>

      <section aria-label="By network" className="flex flex-col gap-1">
        <SectionTitle>By network</SectionTitle>
        <ul className="flex flex-col">
          {used.map((l) => {
            const b = d.bytesByLink[l.id] || 0;
            const share = got > 0 ? Math.round((b / got) * 100) : 0;
            const s = (d.speedByLink && d.speedByLink[l.id]) || 0;
            return (
              <li key={l.id} className="grid grid-cols-[auto_minmax(0,1fr)_3.25rem_minmax(5.5rem,auto)] items-center gap-x-3 border-b border-rule py-2 last:border-b-0">
                <LinkTile kind={l.kind} size={22} dim={l.state === 'down'} />
                <div className="min-w-0">
                  <p className="flex items-center gap-1.5 text-[13px] leading-tight font-[600]"><span className="truncate">{l.name}</span><span className="font-mono text-[11px] font-normal text-ink-3">{l.id}</span></p>
                  <p className="truncate text-[12px] text-ink-3">
                    {l.state === 'down' ? <span className="text-destructive">Dropped, its {linkNoun} moved to the others</span>
                      : d.status !== 'finished' && !routed.includes(l.id) ? `${fmtBytes(b)}, not used now`
                      : [`${fmtBytes(b)}, ${d.streams[l.id] || 1} ${linkNoun}`,
                         running && isFinite(limitFor({ limits }, l.id, 'down')) ? `limit ${fmtSpeedText(limitFor({ limits }, l.id, 'down'), unit)}` : null,
                         d.kind === 'torrent' && running && (d.upByLink || {})[l.id] ? `↑ ${fmtSpeedText(d.upByLink[l.id], unit)}` : null].filter(Boolean).join(', ')}
                  </p>
                </div>
                <span className="figures text-right text-[14px] font-[600]">{share}%</span>
                <Speed bps={s} unit={unit} dash={!running || l.state === 'down' || !routed.includes(l.id)} className="text-right text-[14px] font-[600]" />
              </li>
            );
          })}
        </ul>
      </section>

      <LaneMap d={d} links={links} />

      <div className="flex flex-wrap items-center gap-2 border-t border-rule pt-4">
        {d.status !== 'finished' && (
          <Button variant="secondary" size="sm" onClick={() => toggle(d.id)}>
            {running ? <><Pause />Pause</> : <><Play />{d.status === 'queued' ? 'Start now' : 'Resume'}</>}
          </Button>
        )}
        {!confirming ? (
          <Button variant="ghost" size="sm" onClick={() => setConfirming(true)}><Trash2 />Remove from list</Button>
        ) : (
          <div role="group" aria-label="Confirm removal" className="flex flex-wrap items-center gap-2">
            <span className="text-[12.5px] text-ink-2">Remove it from the list? The file stays on disk.</span>
            <Button variant="destructive" size="sm" onClick={() => remove(d.id)}>Remove</Button>
            <Button variant="ghost" size="sm" onClick={() => setConfirming(false)}>Keep</Button>
          </div>
        )}
      </div>
    </div>
  );
}

function DownloadsScreen({ split, compact }) {
  const route = useApp((s) => s.route);
  const downloads = useApp((s) => s.downloads);
  const links = useApp((s) => s.links);
  const unit = useApp((s) => s.unit);
  const now = useApp((s) => s.now);
  const empty = useApp((s) => s.empty);
  const filter = useApp((s) => s.filter);
  const query = useApp((s) => s.query);
  const selectedId = useApp((s) => s.selectedId);
  const compactDetail = useApp((s) => s.compactDetail);
  const select = useApp((s) => s.select);
  const filters = useApp((s) => s.filters);
  const filtersOpen = useApp((s) => s.filtersOpen);
  const clearFilters = useApp((s) => s.clearFilters);
  const list = empty ? [] : downloads;

  if (!split && compactDetail && selected) {
    return (

  }

  // Date, type and search narrow the list first; the status tabs then count and split what's left.
  const q = query.trim().toLowerCase();
  const narrowed = list.filter((d) => matchesFilters(d, filters, now) && (!q || d.name.toLowerCase().includes(q)));
  const counts = {
    all: narrowed.length,
    progress: narrowed.filter((d) => IN_PROGRESS.includes(d.status)).length,
    finished: narrowed.filter((d) => d.status === 'finished').length,
    attention: 0,
  };
  const shown = narrowed.filter((d) => filter === 'all' || (filter === 'progress' ? IN_PROGRESS.includes(d.status) : filter === 'finished' ? d.status === 'finished' : false));
  const anyFilter = filtersActive(filters);
  const summary = GROUPS.filter(([k]) => k !== 'finished').map(([k, label]) => [list.filter((d) => d.status === k).length, label.toLowerCase()]).filter(([n]) => n > 0).map(([n, l]) => `${n} ${l}`).join(', ');
  const active = list.filter((d) => d.status === 'downloading');
  const lanes = links.map((l) => ({ id: l.id, name: l.name, kind: l.kind, speed: l.speed, down: l.state === 'down', on: l.enabled && l.speed > 0, limited: l.speed > 0 && l.atLimit && l.atLimit.down, note: route && !route.includes(l.id) && l.enabled && l.state === 'up' ? 'Not used' : null }));
  const etaSecs = (() => { const left = active.reduce((a, d) => a + d.size - received(d), 0); const sp = active.reduce((a, d) => a + speedOf(d), 0); return sp > 0 ? left / sp : Infinity; })();

  return (
    <div className="flex min-h-0 flex-1">
      <div className="flex min-w-0 flex-1 flex-col">
        <Toolbar title="Downloads" subtitle={list.length ? summary || 'All finished' : 'Nothing yet'}>
          <div className="flex w-full min-w-0 items-center gap-2 sm:w-auto">
          <label className="ml-field relative flex h-8 min-w-0 flex-1 items-center rounded-full bg-sunken shadow-[inset_0_0_0_1px_var(--border)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-ring sm:w-52 sm:flex-none">
            <Search className="pointer-events-none absolute left-2.5 size-3.5 text-ink-3" />
            <span className="sr-only">Search downloads</span>
            <input
              id="search-downloads"
              type="search"
              value={query}
              onChange={(e) => useApp.setState({ query: e.target.value })}
              onKeyDown={(e) => { if (e.key === 'Escape') useApp.setState({ query: '' }); }}
              placeholder="Search"
              className="h-full w-full min-w-0 rounded-full bg-transparent pr-3 pl-8 text-[13px] outline-none placeholder:text-ink-3"
            />
          </label>
          <NewDownloadButton compact={compact} />
          </div>
        </Toolbar>
        <div className="ml-scroll min-h-0 flex-1 @container md:overflow-y-auto">
          {list.length === 0 ? (
            <EmptyDownloads />
          ) : (
            <div className="flex flex-col gap-4 px-3 pt-4 pb-6">
              <div className="px-1.5">
                <Confluence lanes={lanes} unit={unit} idle={active.length === 0} caption={active.length ? `${active.length} downloading, about ${fmtEta(etaSecs)} left` : 'Nothing running'} />
              </div>
              <div className="flex flex-wrap items-center gap-2 px-1.5">
                <div className="min-w-0 overflow-x-auto [scrollbar-width:none]">
                  <Segmented
                    label="Show"
                    value={filter}
                    onChange={(v) => useApp.setState({ filter: v })}
                    options={[
                      { value: 'all', label: 'All', count: counts.all },
                      { value: 'progress', label: 'In progress', count: counts.progress },
                      { value: 'finished', label: 'Finished', count: counts.finished },
                      { value: 'attention', label: 'Needs attention', count: counts.attention },
                    ]}
                  />
                </div>
                <Button
                  size="sm"
                  className="h-8 px-3.5"
                  variant={filtersOpen ? 'primary' : 'secondary'}
                  aria-expanded={filtersOpen}
                  aria-controls="download-filters"
                  onClick={() => useApp.setState({ filtersOpen: !filtersOpen })}
                >
                  <ListFilter />Filters{anyFilter && <span className="figures ml-0.5 rounded-full bg-[var(--color-accent-soft)] px-1.5 text-[11.5px] text-[var(--color-accent-ink)]">{(filters.date !== 'any' ? 1 : 0) + filters.types.length}</span>}
                </Button>
              </div>
              {filtersOpen && <FilterPanel list={list} shownCount={narrowed.length} />}
              {!filtersOpen && anyFilter && <ActiveFilterChips />}
              {shown.length === 0 ? (
                <div role="status" className="flex flex-col items-start gap-2 px-2.5 py-6">
                  <p className="text-[14px] font-[620]">{q ? `No downloads match “${query.trim()}”` : anyFilter && narrowed.length === 0 ? 'No downloads match these filters' : filter === 'attention' ? 'Nothing needs attention' : 'Nothing here'}</p>
                  <div className="flex flex-wrap gap-2">
                    {anyFilter && <Button size="sm" onClick={clearFilters}>Clear filters</Button>}
                    <Button size="sm" variant={anyFilter ? 'ghost' : 'secondary'} onClick={() => { useApp.setState({ filter: 'all', query: '' }); clearFilters(); }}>Show all downloads</Button>
                  </div>
                </div>
              ) : (
                GROUPS.map(([key, label]) => {
                  const items = shown.filter((d) => d.status === key);
                  if (!items.length) return null;
                  return (
                    <section key={key} aria-labelledby={`group-${key}`}>
                      <h3 id={`group-${key}`} className="flex items-baseline gap-2 px-2.5 pb-1 text-[12.5px] font-[650] text-ink-2">
                        {label}<span className="figures font-[500] text-ink-3">{items.length}</span>
                      </h3>
                      <ul className="flex flex-col gap-0.5">
                        {items.map((d) => (
                          <DownloadRow key={d.id} d={d} links={links} unit={unit} now={now} selected={split && d.id === selectedId} onOpen={select} />
                        ))}
                      </ul>
                    </section>
                  );
                })
              )}
            </div>
          )}
        </div>
      </div>
      {split && selected && (
        <aside aria-label="Download details" className="ml-aside w-[400px] shrink-0 overflow-y-auto border-l border-rule bg-card">
          <Inspector d={selected} />
        </aside>
      )}
    </div>
  );
}

function ThroughputChart({ links, unit }) {
  const [ref, w] = useWidth();
  const [hover, setHover] = useState(null);
  const n = 60;
  const H = 156;
  const W = Math.max(w, 100);
  const totals = Array.from({ length: n }, (_, i) => links.reduce((a, l) => a + (l.history[i] || 0), 0));
  const { top, ticks } = speedTicks(Math.max(...totals, 1e6), unit);
  const x = (i) => (i / (n - 1)) * W;
  const y = (v) => H - (v / top) * H;
  let cum = new Array(n).fill(0);
  const layers = links.map((l) => {
    const lower = cum;
    const upper = cum.map((c, i) => c + (l.history[i] || 0));
    cum = upper;
    return { l, upper, lower };
  });
  const pts = (arr) => arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const onMove = (e) => { const r = e.currentTarget.getBoundingClientRect(); setHover(clamp(Math.round(((e.clientX - r.left) / r.width) * (n - 1)), 0, n - 1)); };
  const onKey = (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); setHover((h) => clamp((h ?? n - 1) - 1, 0, n - 1)); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); setHover((h) => clamp((h ?? n - 1) + 1, 0, n - 1)); }
    else if (e.key === 'Escape') setHover(null);
  };
  const ago = hover === null ? 0 : n - 1 - hover;
  const latest = totals[n - 1];
  return (
    <div className="flex flex-col gap-3">
      <ul className="flex flex-wrap items-center gap-x-5 gap-y-1.5" aria-label="Legend">
        {links.map((l) => (
          <li key={l.id} className="flex items-center gap-2 text-[12.5px]">
            <Swatch kind={l.kind} className="h-2 w-3.5" />
            <span className="font-[580]">{l.name}</span>
            <Speed bps={l.speed} unit={unit} className="text-[13px] font-[600] text-ink-2" />
          </li>
        ))}
      </ul>
      <div className="flex gap-2">
        <div className={cn('relative shrink-0', unit === 'kb' ? 'w-[4.75rem]' : 'w-[3.75rem]')} style={{ height: H }} aria-hidden>
          {ticks.map((t) => (
            <span key={t.value} className="figures absolute right-0 -translate-y-1/2 text-[11.5px] whitespace-nowrap text-ink-3" style={{ top: y(t.value) }}>{t.label}</span>
          ))}
        </div>
        <div className="min-w-0 flex-1">
          <div
            ref={ref}
            tabIndex={0}
            role="img"
            aria-label={`Merged throughput over the last minute, split by network. Now ${fmtSpeedText(latest, unit)}. Focus and use the left and right arrow keys to read each second.`}
            onPointerMove={onMove}
            onPointerLeave={() => setHover(null)}
            onKeyDown={onKey}
            onBlur={() => setHover(null)}
            className="relative rounded-[4px] outline-none focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ring"
            style={{ height: H }}
          >
            <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} aria-hidden className="block overflow-visible">
              {ticks.map((t) => <line key={t.value} className="ml-grid" x1={0} x2={W} y1={y(t.value)} y2={y(t.value)} stroke="var(--border)" strokeWidth={1} />)}
              {layers.map(({ l, upper, lower }) => (
                <polygon key={l.id} points={`${pts(upper)} ${lower.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).reverse().join(' ')}`} fill={`var(--color-${l.kind})`} style={{ fill: `var(--chart-${l.kind}, var(--color-${l.kind}))` }} />
              ))}
              {layers.slice(0, -1).map(({ l, upper }) => <polyline key={l.id} className="ml-chart-sep" points={pts(upper)} fill="none" stroke="var(--bg)" strokeWidth={2} strokeLinejoin="round" />)}
              <polyline className="ml-chart-total" points={pts(totals)} fill="none" stroke="var(--text)" strokeWidth={1.5} strokeLinejoin="round" />
              {hover !== null && <line className="ml-chart-cursor" x1={x(hover)} x2={x(hover)} y1={0} y2={H} stroke="var(--text)" strokeWidth={1} strokeDasharray="3 3" />}
            </svg>
            {hover !== null && (
              <div
                className="ml-tooltip pointer-events-none absolute top-1 z-10 flex min-w-[11rem] flex-col gap-1 rounded-[10px] bg-popover px-3 py-2 text-[12px] shadow-[var(--shadow-sheet)]"
                style={hover > (n - 1) / 2 ? { right: `calc(${100 - (hover / (n - 1)) * 100}% + 10px)` } : { left: `calc(${(hover / (n - 1)) * 100}% + 10px)` }}
              >
                <span className="text-[11.5px] text-ink-3">{ago === 0 ? 'Now' : `${ago} s ago`}</span>
                {links.map((l) => (
                  <span key={l.id} className="flex items-center gap-2"><Swatch kind={l.kind} /><span className="flex-1">{l.name}</span><Speed bps={l.history[hover] || 0} unit={unit} className="text-[13px] font-[600]" /></span>
                ))}
                <span className="flex items-center gap-2 border-t border-rule pt-1"><span className="flex-1 font-[600]">Merged</span><Speed bps={totals[hover]} unit={unit} className="text-[13px] font-[650]" /></span>
              </div>
            )}
          </div>
          <div className="mt-1.5 flex justify-between text-[11.5px] text-ink-3"><span>60 s ago</span><span>Now</span></div>
        </div>
      </div>
    </div>
  );
}

function DashboardScreen() {
  const route = useApp((s) => s.route);
  const links = useApp((s) => s.links);
  const downloads = useApp((s) => s.downloads);
  const unit = useApp((s) => s.unit);
  const today = useApp((s) => s.today);
  const peak = useApp((s) => s.peak);
  const events = useApp((s) => s.events);
  const empty = useApp((s) => s.empty);
  const select = useApp((s) => s.select);
  const list = empty ? [] : downloads;
  const active = list.filter((d) => IN_PROGRESS.includes(d.status));
  const running = list.filter((d) => d.status === 'downloading');
  const lanes = links.map((l) => ({ id: l.id, name: l.name, kind: l.kind, speed: l.speed, down: l.state === 'down', on: l.enabled && l.speed > 0, limited: l.speed > 0 && l.atLimit && l.atLimit.down, note: route && !route.includes(l.id) && l.enabled && l.state === 'up' ? 'Not used' : null }));
  const todayTotal = sum(today);
  const left = running.reduce((a, d) => a + d.size - received(d), 0);
  const sp = running.reduce((a, d) => a + speedOf(d), 0);
  const recent = events.filter((e) => Date.now() - e.at < 24 * 3600e3);
  return (
    <div className="flex min-h-0 flex-1 flex-col">
      <Toolbar title="Dashboard" subtitle="Every download and network at a glance" />
      <div className="ml-scroll min-h-0 flex-1 @container md:overflow-y-auto">
        <div className="flex flex-col gap-8 px-4 pt-5 pb-8">
          <Confluence lanes={lanes} unit={unit} idle={running.length === 0} caption={running.length ? `${running.length} downloading, about ${fmtEta(sp > 0 ? left / sp : Infinity)} left` : 'Nothing downloading'} />
          <section aria-labelledby="dash-minute" className="flex flex-col gap-3">
            <SectionTitle id="dash-minute">Last minute</SectionTitle>
            <ThroughputChart links={links} unit={unit} />
          </section>
          <div className="grid gap-8 @3xl:grid-cols-2">
            <section aria-labelledby="dash-today" className="flex flex-col gap-3">
              <SectionTitle id="dash-today">Today</SectionTitle>
              <p className="flex items-baseline gap-2"><span className="figures text-[34px] leading-none font-[700] tracking-[-0.02em]">{fmtBytes(todayTotal)}</span><span className="text-[13px] text-ink-2">downloaded</span></p>
              <div className="flex h-2 w-full gap-[2px] overflow-hidden rounded-full bg-track" aria-hidden>
                {links.map((l) => <span key={l.id} className="h-full first:rounded-l-full last:rounded-r-full" style={{ width: `${(today[l.id] / todayTotal) * 100}%`, background: `var(--color-${l.kind})` }} />)}
              </div>
              <ul className="flex flex-col">
                {links.map((l) => (
                  <li key={l.id} className="flex items-center gap-2.5 border-b border-rule py-1.5 text-[13px] last:border-b-0">
                    <Swatch kind={l.kind} />
                    <span className="flex-1 font-[560]">{l.name}</span>
                    <span className="figures text-[14px] font-[600]">{fmtBytes(today[l.id])}</span>
                    <span className="figures w-10 text-right text-[13px] text-ink-3">{Math.round((today[l.id] / todayTotal) * 100)}%</span>
                  </li>
                ))}
              </ul>
              <dl className="grid grid-cols-2 gap-4 pt-1">
                <Stat label="Fastest merged speed">{fmtSpeedText(peak, unit)}</Stat>
                <Stat label="Network dropouts">{`${recent.length}${recent.every((e) => e.backAt) ? ', all back' : ''}`}</Stat>
              </dl>
            </section>
            <section aria-labelledby="dash-active" className="flex flex-col gap-2">
              <SectionTitle id="dash-active" aside={<span className="text-[12px] text-ink-3">{active.length} in progress</span>}>Downloading</SectionTitle>
              {active.length === 0 ? (
                <div className="flex flex-col items-start gap-2 py-2">
                  <p className="text-[13px] leading-[1.6] text-ink-2">Nothing downloading. Each download shows here with its speed on every network.</p>
                  <Button variant="primary" size="sm" onClick={(e) => openSheet(e.currentTarget)}><Plus />New download</Button>
                </div>
              ) : (
                <ul className="flex flex-col gap-0.5">
                  {active.map((d) => (
                    <li key={d.id} className="relative flex flex-col gap-1.5 rounded-[10px] px-2 py-2 transition-colors duration-100 hover:bg-hover active:bg-selected">
                      <div className="flex items-center gap-3">
                        <button type="button" onClick={() => { useApp.setState({ screen: 'downloads' }); select(d.id); }} className="min-w-0 truncate text-left text-[13px] font-[580] outline-none after:absolute after:inset-0 after:rounded-[10px] focus-visible:after:outline-2 focus-visible:after:-outline-offset-2 focus-visible:after:outline-ring">{d.name}</button>
                        <span className="ml-auto shrink-0 text-[12.5px] text-ink-2">
                          {d.status === 'downloading' ? <Speed bps={speedOf(d)} unit={unit} className="text-[14px] font-[620] text-foreground" /> : d.status === 'paused' ? 'Paused' : 'Waiting'}
                        </span>
                      </div>
                      <SplitBar d={d} links={links} height={4} dim={d.status !== 'downloading'} />

                  ))}

          </div>
          <UsagePanel />
        </div>
      </div>

function Sparkline({ values, kind, color, label, height = 30 }) {
  const Wd = 160, Ht = height, n = values.length;
  const top = Math.max(...values, 1);
  const stroke = color || `var(--color-${kind})`;
  const p = values.map((v, i) => `${((i / (n - 1)) * Wd).toFixed(1)},${(Ht - 1 - (v / top) * (Ht - 3)).toFixed(1)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${Wd} ${Ht}`} preserveAspectRatio="none" className="block w-full" style={{ height: Ht }} role="img" aria-label={label}>
      <line className="ml-grid" x1={0} x2={Wd} y1={Ht - 0.5} y2={Ht - 0.5} stroke="var(--border)" strokeWidth={1} vectorEffect="non-scaling-stroke" />
      <polygon points={`0,${Ht} ${p} ${Wd},${Ht}`} fill={stroke} fillOpacity={color ? 0.08 : 0.16} style={kind && !color ? { fill: `var(--spark-${kind}, ${stroke})`, fillOpacity: 'var(--spark-a, 0.16)' } : { fill: `var(--spark-ink, ${stroke})`, fillOpacity: 'var(--spark-a, 0.08)' }} />
      <polyline className="ml-spark-line" points={p} fill="none" stroke={stroke} strokeWidth={2} strokeLinejoin="round" vectorEffect="non-scaling-stroke" style={color ? { stroke: `var(--spark-ink-line, ${stroke})` } : undefined} />
    </svg>
  );
}

const fmtMem = (b) => (b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : `${Math.round(b / 1e6)} MB`);
const fmtCpu = (c) => `${c < 10 ? c.toFixed(1) : Math.round(c)}%`;

/* How much of the Mac Mergelane itself is using. Ink only: colour stays reserved for networks. */
function UsagePanel() {
  const usage = useApp((s) => s.usage);
  const merge = useApp((s) => s.merge);
  const totalCpu = usage.procs.reduce((a, p) => a + p.cpu, 0);
  const totalMem = usage.procs.reduce((a, p) => a + p.mem, 0);
  const note = (p) => {
    if (p.id === 'tools') return 'Not running now';
    if (p.id === 'helper' && merge.state !== 'on') return 'System merge is off';
    return PROC_BY_ID[p.id].detail;
  };
  return (
    <section aria-labelledby="dash-usage" className="flex flex-col gap-3">
      <SectionTitle id="dash-usage" aside={<span className="text-[12px] text-ink-3">As Activity Monitor counts it: 100% is one full core</span>}>
        Mergelane on this Mac
      </SectionTitle>
      <div className="grid gap-x-8 gap-y-5 @3xl:grid-cols-[minmax(0,1fr)_minmax(0,1.5fr)]">
        <div className="flex flex-col gap-3">
          <dl className="grid grid-cols-2 gap-4">
            <div className="flex min-w-0 flex-col gap-0.5">
              <dt className="text-[12px] text-ink-3">CPU</dt>
              <dd className="figures text-[34px] leading-none font-[700] tracking-[-0.02em]">{fmtCpu(totalCpu)}</dd>
            </div>
            <div className="flex min-w-0 flex-col gap-0.5">
              <dt className="text-[12px] text-ink-3">Memory</dt>
              <dd className="figures text-[34px] leading-none font-[700] tracking-[-0.02em]">{fmtMem(totalMem)}</dd>
            </div>
          </dl>
          <Sparkline values={usage.history} color="var(--text)" height={44} label={`Mergelane's CPU over the last minute, now ${fmtCpu(totalCpu)}`} />
          <div className="flex justify-between text-[11.5px] text-ink-3"><span>60 s ago</span><span>Now</span></div>
        </div>
        <div className="min-w-0 overflow-x-auto">
          <table className="w-full border-collapse text-left">
            <caption className="sr-only">Mergelane's CPU and memory by part</caption>
            <thead>
              <tr className="border-b border-rule-strong text-[12px] text-ink-3">
                <th scope="col" className="pb-1.5 font-[600]">Part</th>
                <th scope="col" className="w-16 pb-1.5 text-right font-[600]">CPU</th>
                <th scope="col" className="w-20 pb-1.5 text-right font-[600]">Memory</th>
              </tr>
            </thead>
            <tbody>
              {usage.procs.map((p) => {
                const idle = p.id === 'tools';
                return (
                  <tr key={p.id} className="border-b border-rule last:border-b-0">
                    <th scope="row" className="py-2 pr-3 text-left font-normal">
                      <span className="block truncate text-[13px] font-[600]">{PROC_BY_ID[p.id].name}</span>
                      <span className="block truncate text-[12px] text-ink-3">{note(p)}</span>
                    </th>
                    <td className="figures py-2 text-right text-[14px] font-[600]">{idle ? <span className="text-ink-3">—</span> : fmtCpu(p.cpu)}</td>
                    <td className="figures py-2 text-right text-[13px] text-ink-2">{idle ? '—' : fmtMem(p.mem)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </section>
  );
}

function LimitTag({ dir, bps, at, unit }) {

      <Gauge className="size-3" /><Icon className="size-3" aria-label={dir === 'down' ? 'Download' : 'Upload'} />{fmtSpeedText(bps, unit)}{at && <span className="font-[520]">· at limit</span>}
    </span>
  );
}

function NetworkRow({ l, unit }) {

  const routing = useApp((s) => s.routing);
  const route = useApp((s) => s.route);

  const state = down
    ? { icon: Unplug, text: 'Dropped. Reconnecting…', alert: true }
    : !l.enabled
      ? { icon: CircleCheck, text: 'Connected, off for downloads', alert: false }

        : l.speed > 0

          : { icon: CircleCheck, text: 'Connected, idle', alert: false };
  const StateIcon = state.icon;
  return (
    <li className="grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-x-3 gap-y-2 border-b border-rule py-3 last:border-b-0 @2xl:grid-cols-[auto_minmax(0,1fr)_minmax(7rem,12rem)_auto]">

          <span className="truncate text-[12px] text-ink-3">{l.detail}</span>
        </p>
        <p className={cn('mt-1 flex items-center gap-1.5 text-[12px]', state.alert ? 'text-destructive' : 'text-ink-2')}>
          <StateIcon className="size-3.5 shrink-0" />{state.text}
        </p>
        {(isFinite(dl) || isFinite(ul)) && (
          <p className="mt-1.5 flex flex-wrap gap-1.5" aria-label={`${l.name} speed limits`}>
            {isFinite(dl) && <LimitTag dir="down" bps={dl} at={l.atLimit && l.atLimit.down} unit={unit} />}
            {isFinite(ul) && <LimitTag dir="up" bps={ul} at={l.atLimit && l.atLimit.up} unit={unit} />}

      <div className="flex items-center gap-3">
        <div className="flex min-w-[5.5rem] flex-col items-end">
          <Speed bps={l.speed} unit={unit} dash={down || !l.enabled || excluded} className="text-right text-[18px] font-[650]" />
          <span className="flex items-center gap-1 text-[12px] text-ink-3" title="Uploading">
            <ArrowUp className="size-3" aria-label="Uploading" /><Speed bps={l.up} unit={unit} dash={down || !l.enabled || !l.up} className="text-[12.5px] font-[600] text-ink-2" />
          </span>
        </div>
        <label htmlFor={id} className="sr-only">Use {l.name} for downloads</label>
        <Switch id={id} checked={l.enabled} onCheckedChange={(v) => setEnabled(l.id, v)} />
      </div>
    </li>
  );
}

/* A speed limit you can switch on or off without losing the number. Typed in the units chosen in Settings. */
function LimitField({ target, dir, entry, unit, label }) {
  const setEntry = useApp((s) => s.setLimitEntry);
  const div = UNIT_DIV[unit];
  const shown = String(+(entry.bps / div).toFixed(unit === 'kb' ? 0 : 2));
  const [text, setText] = useState(shown);
  const [bad, setBad] = useState(false);
  useEffect(() => { setText(shown); setBad(false); }, [shown]);
  const commit = () => {
    const v = parseFloat(text.replace(',', '.').replace(/[^\d.]/g, ''));
    if (!isFinite(v) || v <= 0) { setBad(true); return; }
    const bps = Math.max(10e3, v * div);
    setBad(false);
    setEntry(target, dir, { bps, on: true });
    setText(String(+(bps / div).toFixed(unit === 'kb' ? 0 : 2)));
  };
  const switchId = useId();
  const word = dir === 'down' ? 'Download' : 'Upload';
  return (
    <div className="flex items-center gap-2">
      <label htmlFor={switchId} className="sr-only">{label}: {word.toLowerCase()} limit on</label>
      <Switch id={switchId} checked={entry.on} onCheckedChange={(v) => setEntry(target, dir, { on: v })} />
      <span className={cn('flex h-8 items-center gap-1.5 rounded-full bg-[var(--input-bg)] pr-3 pl-3 shadow-[inset_0_0_0_1px_var(--control)] has-[:focus-visible]:outline-2 has-[:focus-visible]:outline-offset-2 has-[:focus-visible]:outline-ring', !entry.on && 'opacity-50', bad && 'shadow-[inset_0_0_0_1.5px_var(--color-danger)]')}>
        {dir === 'down' ? <ArrowDown className="size-3.5 text-ink-3" /> : <ArrowUp className="size-3.5 text-ink-3" />}
        <input
          type="text"
          inputMode="decimal"
          value={text}
          aria-label={`${label}: ${word.toLowerCase()} limit in ${UNIT_LABEL[unit]}`}
          aria-invalid={bad || undefined}
          onChange={(e) => setText(e.target.value)}
          onBlur={commit}
          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') { setText(shown); setBad(false); } }}
          className="figures w-[4.5rem] bg-transparent text-right text-[14px] font-[600] outline-none"
        />
        <span className="text-[12px] font-[540] text-ink-3">{UNIT_LABEL[unit]}</span>
      </span>
    </div>
  );
}

  const held = links.flatMap((l) => [

        <div className="flex min-w-0 flex-col gap-0.5">
          <h3 id="limits-title" className="flex items-center gap-1.5 text-[14px] font-[650]"><Gauge className="size-4" />Speed limits</h3>

        </div>

        <Segmented

          options={[{ value: 'all', label: 'Same for all' }, { value: 'each', label: 'Per network' }]}
        />
        {limits.scope === 'all' ? (
          <div className="flex flex-col">
            {['down', 'up'].map((dir) => (
              <div key={dir} className="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-b border-rule py-2.5 last:border-b-0">

let returnFocusTo = null;
